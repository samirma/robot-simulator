motions:
- id: arm
  velocity_driven: false
  command:
    interface: topic
    name: /joint_trajectory_controller/joint_trajectory
    type: trajectory_msgs/msg/JointTrajectory
    fields:
    - field: points[].positions[0] (shoulder_pan_joint)
      unit: rad
      min: -1.91986
      max: 1.91986
      source: https://github.com/ros-physical-ai/ros2_so_arm/blob/e166df9d51f43b24da9b99047c6c51c306bda74f/so_arm101_description/urdf/so_arm101_macro.xacro#L532
    - field: points[].positions[1] (shoulder_lift_joint)
      unit: rad
      min: -1.74533
      max: 1.74533
      source: https://github.com/ros-physical-ai/ros2_so_arm/blob/e166df9d51f43b24da9b99047c6c51c306bda74f/so_arm101_description/urdf/so_arm101_macro.xacro#L559
    - field: points[].positions[2] (elbow_flex_joint)
      unit: rad
      min: -1.69
      max: 1.54
      source: https://github.com/ros-physical-ai/ros2_so_arm/blob/e166df9d51f43b24da9b99047c6c51c306bda74f/so_arm101_description/urdf/so_arm101_macro.xacro#L584
    - field: points[].positions[3] (wrist_flex_joint)
      unit: rad
      min: -1.6
      max: 1.6
      source: https://github.com/ros-physical-ai/ros2_so_arm/blob/e166df9d51f43b24da9b99047c6c51c306bda74f/so_arm101_description/urdf/so_arm101_macro.xacro#L611
    - field: points[].positions[4] (wrist_roll_joint)
      unit: rad
      min: -2.3
      max: 2.3
      source: https://github.com/ros-physical-ai/ros2_so_arm/blob/e166df9d51f43b24da9b99047c6c51c306bda74f/so_arm101_description/urdf/so_arm101_macro.xacro#L638
    - field: points[].time_from_start
      unit: s
      source: https://github.com/ros-controls/ros2_controllers/blob/aacd842600a09d556b983ac3d53a0983e9ebcbb1/joint_trajectory_controller/src/joint_trajectory_controller.cpp#L1003
    also: /joint_trajectory_controller/follow_joint_trajectory (control_msgs/action/FollowJointTrajectory) with
      the same joint names, units and limits
    servo_profile:
      speed_ticks_per_s: 2400
      speed_rad_per_s: 3.682
      acceleration_register: 50
      basis: source
      source: https://github.com/ros-physical-ai/feetech_ros2_driver/blob/e424839f0fb23cc0b0ade8d6e5ea166e30811356/src/feetech_ros2_driver.cpp#L157
      notes: the plugin writes every goal with STS speed 2400 ticks/s (4096 ticks/rev) and acceleration register
        50; the register's physical unit is not stated in the pinned source
    example:
      joint_names:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_flex_joint
      - wrist_flex_joint
      - wrist_roll_joint
      points:
      - positions:
        - 0.3
        - -0.3
        - 0.3
        - 0.3
        - 0.5
        time_from_start:
          sec: 2
          nanosec: 0
  watchdog:
    present: false
    interval_s: null
    basis: source
    method: 'Derived from the pinned source, not measured on the real robot (the robot specification''s real-hardware
      measurement is outstanding): joint_trajectory_controller cmd_timeout defaults to 0.0 (disabled) and ros2_controllers.yaml
      does not set it; the Feetech hardware plugin writes the held position command every 20 ms and has no command
      timeout; the STS3215 holds its last goal.'
    date: '2026-09-30'
    source:
    - https://github.com/ros-controls/ros2_controllers/blob/aacd842600a09d556b983ac3d53a0983e9ebcbb1/joint_trajectory_controller/src/joint_trajectory_controller_parameters.yaml#L134
    - https://github.com/ros-physical-ai/feetech_ros2_driver/blob/e424839f0fb23cc0b0ade8d6e5ea166e30811356/src/feetech_ros2_driver.cpp#L144
  feedback:
  - name: /joint_states
    field: position (rad) of the five arm joints
  - name: /joint_trajectory_controller/controller_state
    field: feedback.positions, error.positions
  end_state: every arm joint within the arm-joint tolerance of the last trajectory point and at rest (joint velocity
    below 0.01 rad/s, constraints.stopped_velocity_tolerance)
- id: gripper
  velocity_driven: false
  command:
    interface: action
    name: /gripper_controller/gripper_cmd
    type: control_msgs/action/ParallelGripperCommand
    fields:
    - field: command.position[0] (gripper_joint)
      unit: rad
      min: 0.0
      max: 1.7
      source: https://github.com/ros-physical-ai/ros2_so_arm/blob/e166df9d51f43b24da9b99047c6c51c306bda74f/so_arm101_description/urdf/so_arm101_macro.xacro#L670
      notes: 0.0 closed, larger opens; command.velocity and command.effort are ignored (max_velocity_interface and
        max_effort_interface empty)
    example:
      command:
        name:
        - gripper_joint
        position:
        - 1.0
  watchdog:
    present: false
    interval_s: null
    basis: source
    method: 'Derived from the pinned source, not measured on the real robot (the robot specification''s real-hardware
      measurement is outstanding): the parallel gripper action controller holds its last position command with no
      timeout; the Feetech hardware plugin writes the held position command every 20 ms and has no command timeout;
      the STS3215 holds its last goal.'
    date: '2026-09-30'
    source:
    - https://github.com/ros-controls/ros2_controllers/blob/aacd842600a09d556b983ac3d53a0983e9ebcbb1/parallel_gripper_controller/include/parallel_gripper_controller/parallel_gripper_action_controller_impl.hpp#L86
    - https://github.com/ros-physical-ai/feetech_ros2_driver/blob/e424839f0fb23cc0b0ade8d6e5ea166e30811356/src/feetech_ros2_driver.cpp#L144
  feedback:
  - name: /joint_states
    field: position of gripper_joint (rad)
  - name: /gripper_controller/gripper_cmd
    field: result.state.position, reached_goal, stalled
  end_state: action succeeds when |command - position| < goal_tolerance 0.01 rad, or when the jaw stalls (|velocity|
    <= 0.001 rad/s for stall_timeout 1.0 s; allow_stalling true reports success with stalled=true)
sensors:
  cameras:
  - id: wrist
    image_topic: /image_raw
    info_topic: /camera_info
    compressed_topic: /image_raw/compressed
    frame_id: default_cam
    width: 640
    height: 480
    rate: 30
    encoding: yuv422_yuy2
    hfov_deg: 70.0
    hfov_basis: estimate
    hfov_note: the boot publishes no calibration; 70 deg horizontal is an estimate for the recommended 32x32 mm
      UVC module (not a manufacturer figure); the model camera uses fovy 55.4 deg (= 2 atan(tan(35 deg) * 480/640))
    intrinsics:
      fx: 0.0
      fy: 0.0
      cx: 0.0
      cy: 0.0
      distortion_model: ''
      d: []
      basis: uncalibrated
      source:
      - https://github.com/ros-drivers/usb_cam/blob/cb2ae6bc0a312de629f84fef933fb3e07dac1ef8/src/ros2/usb_cam_node.cpp#L66
      - https://github.com/ros-drivers/usb_cam/blob/cb2ae6bc0a312de629f84fef933fb3e07dac1ef8/src/ros2/usb_cam_node.cpp#L147
      notes: camera_info_url is empty, so CameraInfo carries only width/height/frame_id; usb_cam's config/camera_info.yaml
        belongs to its params_1.yaml example, which this boot does not load
    mount:
      parent: gripper_link
      xyz:
      - -0.008
      - 0.045
      - -0.01
      rpy:
      - 2.8797933
      - 0.0
      - 0.0
      basis: estimate
      source:
      - https://github.com/TheRobotStudio/SO-ARM100/blob/aec17bbc256d1a7342d53aaa4950595d4c30b40d/Optional/SO101_Wrist_Cam_Hex-Nut_Mount_32x32_UVC_Module/README.md
      - https://github.com/TheRobotStudio/SO-ARM100/blob/aec17bbc256d1a7342d53aaa4950595d4c30b40d/media/UVC_cam_mount_so101.jpg
      notes: 'optical frame (z forward, x right, y down) pose in the boot''s gripper_link frame, estimated from
        the pinned photo media/UVC_cam_mount_so101.jpg of the SO101 hex-nut wrist mount: the lens sits on a plate
        rising from the Wrist_Roll_Follower on the +y side of gripper_link (moving jaw appears on the observer''s
        left when viewed from the fingertips), about 4.5 cm off the jaw plane, centred over the jaw gap (x = -0.008,
        the gripper_frame_link x), near the wrist (z = -0.01), looking along the fingers (-z) and pitched 15 deg
        toward them. Not measured; the real mount may differ by about 2 cm and 10 deg; no TF for default_cam is
        published by the boot. Image orientation (derived): jaws at the bottom of the image (as in the pinned photos and
        recorded SO-101 wrist footage), moving jaw on the right (pinned photo). At home (all joints 0.0) the jaws open in the
        vertical plane (official model at qpos 0; LeRobot SO-101 calibration video, middle-of-range pose), so the
        camera is beside the gripper and the image is rolled 90 deg (world up = image right); it is upright at
        wrist_roll_joint = -pi/2. See import.md, Wrist camera'
    hardware: 32x32 mm USB UVC camera module (README-recommended innomaker module or equivalent, min 720p/30 fps)
      on the SO101 hex-nut wrist-camera mount; run at the usb_cam defaults 640x480 YUYV 30 fps
  lidars: []
  imus: []
tolerances:
- figure: arm joint final position after a trajectory
  applies_to:
  - shoulder_pan_joint
  - shoulder_lift_joint
  - elbow_flex_joint
  - wrist_flex_joint
  - wrist_roll_joint
  tolerance:
    absolute: 0.035
    unit: rad
  basis: estimate
  notes: 'about 2 deg: STS3215 resolution is 4096 ticks/rev (0.0015 rad), the official MJCF models +/-0.5 deg backlash
    and load sag; no manufacturer accuracy figure exists for the SO-101'
- figure: gripper final position after a free (non-grasping) command
  applies_to:
  - gripper_joint
  tolerance:
    absolute: 0.05
    unit: rad
  basis: estimate
  notes: the controller itself declares success at 0.01 rad (goal_tolerance) or on stall; 0.05 rad allows for the
    printed jaw's compliance; not a manufacturer figure
notes: 'TheRobotStudio publishes no ROS interface for the SO-101; this is the approved community interface (workspace
  spec §1.3): the pinned ros2_so_arm real-hardware bringup plus the pinned usb_cam boot. Excluded as ROS infrastructure:
  /rosout, /parameter_events, every node''s parameter, logger and type-description services, ROS 2 action-internal
  topics and services, and the client-library parameters every rclcpp node declares (use_sim_time: false, start_type_description_service:
  true). Rates are derived from the pinned source (rate_basis: source), not measured on hardware. The feetech_ros2_driver
  0.2.2 plugin decodes position as (ticks - offset) * 2 pi / 4096 and writes position commands as offset + rad *
  4096 / (2 pi); the servos'' own P gains are written from the p_cofficient values (8 for shoulder_pan, 16 for the
  others).'
