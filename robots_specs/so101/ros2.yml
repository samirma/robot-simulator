  url: https://github.com/ros/diagnostics
  revision: 809c7da54886cc2cca8923125282e6a73e1fa276
  role: 'dependency: diagnostic_updater used by controller_manager, release 4.2.7 (Jazzy binary 4.2.7-1)'
