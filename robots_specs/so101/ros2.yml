- id: ros2_controllers
  url: https://github.com/ros-controls/ros2_controllers
  revision: aacd842600a09d556b983ac3d53a0983e9ebcbb1
  role: 'dependency: joint_trajectory_controller, joint_state_broadcaster, parallel_gripper_controller, release
