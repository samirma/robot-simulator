  role: 'dependency: image_transport and camera_info_manager, release 5.1.8 (Jazzy binary 5.1.8-1)'
- id: image_transport_plugins
  url: https://github.com/ros-perception/image_transport_plugins
  revision: bcc913e69d3db54b90b989c6b79c1b22d50e79c8
  role: 'optional plugins: compressed, compressedDepth, theora, zstd image transports, release 4.0.7 (Jazzy binary
    4.0.7-1)'
