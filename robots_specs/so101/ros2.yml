    branch''s newest, read for behaviour'
boot:
  summary: 'ros2_so_arm''s so_arm101_description controllers_bringup.launch.py with hardware_type:=real (ros2_control_node
    as /controller_manager with the Feetech STS3215 bus via feetech_ros2_driver/FeetechHardwareInterface, /robot_state_publisher,
    and spawners that load and activate joint_state_broadcaster, joint_trajectory_controller and gripper_controller),
    plus the usb_cam wrist camera started the way the pinned usb_cam README documents first: `ros2 run usb_cam usb_cam_node_exe`
    with default settings (node /usb_cam, no namespace, no params file). The launch defaults use_namespace:=false
    and namespace:='''' leave every name at the root. forward_position_controller is declared in ros2_controllers.yaml
    but not spawned, so its node and topic are optional. The spawner processes exit once their controller is active
    and are not part of the running graph.'
  commands:
  - ros2 launch so_arm101_description controllers_bringup.launch.py hardware_type:=real
  - ros2 run usb_cam usb_cam_node_exe
  launch_files:
  - source: ros2_so_arm
    path: so_arm101_description/launch/controllers_bringup.launch.py
    role: authoritative arm boot
  - source: ros2_so_arm
    path: so_arm101_description/control/ros2_controllers.yaml
    role: controller_manager and controller parameters
  - source: ros2_so_arm
    path: so_arm101_description/control/so_arm101.ros2_control.xacro
    role: ros2_control hardware description (servo ids, tick offsets, P gains)
  - source: ros2_so_arm
    path: so_arm101_description/urdf/so_arm101.urdf.xacro
    role: robot_description top-level xacro
  - source: ros2_so_arm
    path: so_arm101_description/urdf/so_arm101_macro.xacro
    role: robot_description links, joints, limits
  - source: usb_cam
    path: README.md
    role: documents `ros2 run usb_cam usb_cam_node_exe` (default settings)
  - source: usb_cam
    path: src/ros2/usb_cam_node.cpp
    role: 'usb_cam node: parameter defaults, publishers, service'
  data_files: []
  hardware: 'SO-101 follower arm: six Feetech STS3215 serial-bus servos (ids 1-6: shoulder_pan, shoulder_lift, elbow_flex,
    wrist_flex, wrist_roll, gripper) on one USB serial adapter at usb_port /dev/LeRobotFollower (launch default);
    4096 ticks per revolution; joint zero = the per-joint `offset` tick value of the ros2_control xacro (2048, 2125,
    2080, 3110, 1024, 2070). Wrist camera: a 32x32 mm USB UVC camera module on the SO101 hex-nut wrist-camera mount
    (SO-ARM100 Optional/SO101_Wrist_Cam_Hex-Nut_Mount_32x32_UVC_Module), at /dev/video0. Host: Ubuntu 24.04 with
    ROS 2 Jazzy (the lowest distribution in ros2_so_arm''s CI matrix jazzy/kilted/rolling and the one with binary
    releases of every dependency above).'
model:
  urdf: so101_new_calib.urdf
  urdf_sha256: 3a65d2d35e68a8d2f0c2cc176d19b884506543c93ba72980145b80abe276022c
  urdf_source:
    source: SO-ARM100
    path: Simulation/SO101/so101_new_calib.urdf
  mjcf: model.xml
  mjcf_official: false
  official_mjcf: so101_new_calib.xml
  robot_description:
    published_as: /robot_state_publisher parameter robot_description and the transient-local topic /robot_description
    content:
      file: boot/robot_description.urdf
      generated: xacro so_arm101_description/urdf/so_arm101.urdf.xacro with prefix:='' ros2_control_file:=<share>/control/so_arm101.ros2_control.xacro
        ros2_control_hardware_type:=real usb_port:=/dev/LeRobotFollower (the launch's load_xacro mappings); generated
        here with xacro 2.1.1. The leading xacro banner comment names the xacro file's absolute install path and
        varies by installation; everything after it is fixed by the pinned sources.
      sha256_after_banner: c5ecc5c7424bb675d6ec2772081d6c92ca260bf9e1599aa547f2133e927a5dfc
    differences_from_model:
    - 'names: links world, base_link, shoulder_link, upper_arm_link, lower_arm_link, wrist_link, gripper_link, gripper_frame_link,
      jaw_link and joints shoulder_pan_joint, shoulder_lift_joint, elbow_flex_joint, wrist_flex_joint, wrist_roll_joint,
      gripper_joint, world_to_base_joint, gripper_frame_joint (official model: base, shoulder, upper_arm, lower_arm,
      wrist, gripper, moving_jaw_so101_v1; joints shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll,
      gripper)'
    - 'limits: elbow_flex_joint [-1.69, 1.54] (official [-1.69, 1.69]); wrist_flex_joint [-1.6, 1.6] (official [-1.65806,
      1.65806]); wrist_roll_joint [-2.3, 2.3] (official [-2.74385, 2.84121]); gripper_joint [0.0, 1.70] (official
      [-0.174533, 1.74533]); effort 10, velocity 10 on every joint as in the official URDF'
    - 'zero offsets (rotation about the joint axis between the boot''s and the official child frame at q=0; q_official
      = q_boot + delta): wrist_roll_joint delta = +0.04709 rad (boot origin rpy -1.57 3.14 0 vs official 1.5708
      0.0486795 3.14159); gripper_joint delta = -0.18 rad (boot origin rpy 1.5708 0.18 0 vs official 1.5708 -5.24e-08
      0); wrist_flex_joint delta = +0.0008 rad (boot rpy yaw -1.57 vs official -1.5708); every other joint identical'
    - 'axes: identical (0 0 1 in every child frame)'
    - the boot has a fixed root link world (world_to_base_joint at identity) and no camera link or frame
nodes:
- name: /controller_manager
  package: controller_manager
  executable: ros2_control_node
  source:
  - https://github.com/ros-physical-ai/ros2_so_arm/blob/e166df9d51f43b24da9b99047c6c51c306bda74f/so_arm101_description/launch/controllers_bringup.launch.py#L119
  - https://github.com/ros-controls/ros2_control/blob/b7f1a5d420443c7a079f4c81e80d5e39759acf4c/controller_manager/src/ros2_control_node.cpp#L43
  notes: Hosts the hardware plugin and the controllers; remaps ~/robot_description to /robot_description.
- name: /so_arm101
  package: hardware_interface
  executable: ros2_control_node
  source: https://github.com/ros-controls/ros2_control/blob/b7f1a5d420443c7a079f4c81e80d5e39759acf4c/hardware_interface/src/hardware_component_interface.cpp#L120
  notes: Per-hardware-component node the controller_manager creates for ros2_control system SO_ARM101 (name lower-cased);
    it has no topics, services or parameters of its own.
- name: /joint_state_broadcaster
  package: joint_state_broadcaster
  executable: ros2_control_node
  source:
  - https://github.com/ros-physical-ai/ros2_so_arm/blob/e166df9d51f43b24da9b99047c6c51c306bda74f/so_arm101_description/launch/controllers_bringup.launch.py#L14
  - https://github.com/ros-physical-ai/ros2_so_arm/blob/e166df9d51f43b24da9b99047c6c51c306bda74f/so_arm101_description/control/ros2_controllers.yaml#L8
  notes: Controller (lifecycle node inside the controller_manager process, lifecycle services disabled), type joint_state_broadcaster/JointStateBroadcaster.
- name: /joint_trajectory_controller
  package: joint_trajectory_controller
  executable: ros2_control_node
  source:
  - https://github.com/ros-physical-ai/ros2_so_arm/blob/e166df9d51f43b24da9b99047c6c51c306bda74f/so_arm101_description/launch/controllers_bringup.launch.py#L15
  - https://github.com/ros-physical-ai/ros2_so_arm/blob/e166df9d51f43b24da9b99047c6c51c306bda74f/so_arm101_description/control/ros2_controllers.yaml#L6
  notes: Controller, type joint_trajectory_controller/JointTrajectoryController, position command interface on the
    five arm joints.
- name: /gripper_controller
  package: parallel_gripper_controller
  executable: ros2_control_node
  source:
  - https://github.com/ros-physical-ai/ros2_so_arm/blob/e166df9d51f43b24da9b99047c6c51c306bda74f/so_arm101_description/launch/controllers_bringup.launch.py#L16
  - https://github.com/ros-physical-ai/ros2_so_arm/blob/e166df9d51f43b24da9b99047c6c51c306bda74f/so_arm101_description/control/ros2_controllers.yaml#L15
  notes: Controller, type parallel_gripper_action_controller/GripperActionController on gripper_joint.
- name: /forward_position_controller
  package: position_controllers
  executable: ros2_control_node
  source: https://github.com/ros-physical-ai/ros2_so_arm/blob/e166df9d51f43b24da9b99047c6c51c306bda74f/so_arm101_description/control/ros2_controllers.yaml#L11
  optional: true
  notes: Declared in ros2_controllers.yaml but not in the launch's startup_controllers; exists only if loaded by
    hand.
- name: /robot_state_publisher
  package: robot_state_publisher
  executable: robot_state_publisher
  source: https://github.com/ros-physical-ai/ros2_so_arm/blob/e166df9d51f43b24da9b99047c6c51c306bda74f/so_arm101_description/launch/controllers_bringup.launch.py#L38
- name: /usb_cam
  package: usb_cam
  executable: usb_cam_node_exe
  source:
  - https://github.com/ros-drivers/usb_cam/blob/cb2ae6bc0a312de629f84fef933fb3e07dac1ef8/README.md#L73
  - https://github.com/ros-drivers/usb_cam/blob/cb2ae6bc0a312de629f84fef933fb3e07dac1ef8/src/ros2/usb_cam_node.cpp#L43
topics:
- name: /joint_trajectory_controller/joint_trajectory
  type: trajectory_msgs/msg/JointTrajectory
  direction: in
  nodes:
  - /joint_trajectory_controller
  rate: non_periodic
  qos:
    reliability: reliable
    durability: volatile
    depth: 10
  source: https://github.com/ros-controls/ros2_controllers/blob/aacd842600a09d556b983ac3d53a0983e9ebcbb1/joint_trajectory_controller/src/joint_trajectory_controller.cpp#L1003
  notes: Arm trajectory command (joint names must be the five arm joints; positions in rad). A new message replaces
    the current trajectory.
- name: /joint_trajectory_controller/controller_state
  type: control_msgs/msg/JointTrajectoryControllerState
  direction: out
  nodes:
  - /joint_trajectory_controller
  rate: 50
  rate_basis: source
  rate_note: published every controller update; controller update_rate defaults to the controller_manager update_rate
    50 Hz (ros2_controllers.yaml)
  source:
  - https://github.com/ros-controls/ros2_controllers/blob/aacd842600a09d556b983ac3d53a0983e9ebcbb1/joint_trajectory_controller/src/joint_trajectory_controller.cpp#L1007
  - https://github.com/ros-controls/ros2_controllers/blob/aacd842600a09d556b983ac3d53a0983e9ebcbb1/joint_trajectory_controller/src/joint_trajectory_controller.cpp#L580
  - https://github.com/ros-physical-ai/ros2_so_arm/blob/e166df9d51f43b24da9b99047c6c51c306bda74f/so_arm101_description/control/ros2_controllers.yaml#L3
- name: /joint_trajectory_controller/speed_scaling_input
  type: control_msgs/msg/SpeedScalingFactor
  direction: in
  nodes:
  - /joint_trajectory_controller
  rate: non_periodic
  qos:
    reliability: reliable
    durability: transient_local
    depth: 10
  source: https://github.com/ros-controls/ros2_controllers/blob/aacd842600a09d556b983ac3d53a0983e9ebcbb1/joint_trajectory_controller/src/joint_trajectory_controller.cpp#L1082
  notes: Created because the only command interface is position.
- name: /joint_states
  type: sensor_msgs/msg/JointState
  direction: out
  nodes:
  - /joint_state_broadcaster
  rate: 50
  rate_basis: source
  frame_id: base_link
  rate_note: published every controller update at the 50 Hz controller_manager rate
  source:
  - https://github.com/ros-controls/ros2_controllers/blob/aacd842600a09d556b983ac3d53a0983e9ebcbb1/joint_state_broadcaster/src/joint_state_broadcaster.cpp#L142
  - https://github.com/ros-controls/ros2_controllers/blob/aacd842600a09d556b983ac3d53a0983e9ebcbb1/joint_state_broadcaster/src/joint_state_broadcaster.cpp#L445
  notes: Position (rad) and velocity (rad/s) of all six joints, names ordered ['elbow_flex_joint', 'gripper_joint',
    'shoulder_lift_joint', 'shoulder_pan_joint', 'wrist_flex_joint', 'wrist_roll_joint'] (URDF joint map order,
    use_urdf_to_filter true); header.frame_id base_link (frame_id default); effort empty (no effort state interface).
- name: /dynamic_joint_states
  type: control_msgs/msg/DynamicJointState
  direction: out
  nodes:
  - /joint_state_broadcaster
  rate: 50
  rate_basis: source
  frame_id: base_link
  source:
  - https://github.com/ros-controls/ros2_controllers/blob/aacd842600a09d556b983ac3d53a0983e9ebcbb1/joint_state_broadcaster/src/joint_state_broadcaster.cpp#L152
  - https://github.com/ros-controls/ros2_controllers/blob/aacd842600a09d556b983ac3d53a0983e9ebcbb1/joint_state_broadcaster/src/joint_state_broadcaster.cpp#L460
  notes: All state interfaces (position, velocity) of every joint; publish_dynamic_joint_states defaults to true.
- name: /robot_description
  type: std_msgs/msg/String
  direction: out
  nodes:
  - /robot_state_publisher
  rate: non_periodic
  latched: true
  qos:
    reliability: reliable
    durability: transient_local
    depth: 1
  source: https://github.com/ros/robot_state_publisher/blob/d1b994d2d2eb19e4d2886be57211114134f25b50/src/robot_state_publisher.cpp#L133
  notes: The boot robot_description (model.robot_description); also subscribed by /controller_manager.
- name: /tf
  type: tf2_msgs/msg/TFMessage
  direction: out
  nodes:
  - /robot_state_publisher
  rate: 16.67
  rate_basis: source
  rate_note: robot_state_publisher republishes the moving joints' transforms on a /joint_states message only when
    its stamp is at least 1/publish_frequency = 50 ms after the last published one; with /joint_states every 20
    ms that is every third message, 50/3 = 16.67 Hz
  source:
  - https://github.com/ros/robot_state_publisher/blob/d1b994d2d2eb19e4d2886be57211114134f25b50/src/robot_state_publisher.cpp#L338
  - https://github.com/ros/robot_state_publisher/blob/d1b994d2d2eb19e4d2886be57211114134f25b50/src/robot_state_publisher.cpp#L118
  notes: Transforms of the six revolute joints (see tf).
- name: /tf_static
  type: tf2_msgs/msg/TFMessage
  direction: out
  nodes:
  - /robot_state_publisher
  rate: non_periodic
  latched: true
  qos:
    reliability: reliable
    durability: transient_local
    depth: 1
  source: https://github.com/ros/robot_state_publisher/blob/d1b994d2d2eb19e4d2886be57211114134f25b50/src/robot_state_publisher.cpp#L150
  notes: world->base_link and gripper_link->gripper_frame_link, published once.
- name: /controller_manager/activity
  type: controller_manager_msgs/msg/ControllerManagerActivity
  direction: out
  nodes:
  - /controller_manager
  rate: non_periodic
  latched: true
  qos:
    reliability: reliable
    durability: transient_local
    depth: 1
  source: https://github.com/ros-controls/ros2_control/blob/b7f1a5d420443c7a079f4c81e80d5e39759acf4c/controller_manager/src/controller_manager.cpp#L659
  notes: Published on every controller or hardware state change.
- name: /diagnostics
  type: diagnostic_msgs/msg/DiagnosticArray
  direction: out
  nodes:
  - /controller_manager
  rate: 1
  rate_basis: source
  rate_note: diagnostic_updater period parameter diagnostic_updater.period defaults to 1.0 s
  source:
  - https://github.com/ros-controls/ros2_control/blob/b7f1a5d420443c7a079f4c81e80d5e39759acf4c/controller_manager/src/controller_manager.cpp#L543
  - https://github.com/ros/diagnostics/blob/809c7da54886cc2cca8923125282e6a73e1fa276/diagnostic_updater/src/diagnostic_updater.cpp#L56
  notes: Controllers Activity, Hardware Components Activity and Controller Manager Activity statuses (hardware id
    ros2_control).
- name: /controller_manager/introspection_data/full
  type: pal_statistics_msgs/msg/Statistics
  direction: out
  nodes:
  - /controller_manager
  rate: 50
  rate_basis: source
  rate_note: filled every controller_manager update (50 Hz) and published only while subscribed
  qos:
    reliability: best_effort
    durability: transient_local
    depth: 1
  source:
  - https://github.com/ros-controls/ros2_control/blob/b7f1a5d420443c7a079f4c81e80d5e39759acf4c/controller_manager/src/controller_manager.cpp#L681
  - https://github.com/pal-robotics/pal_statistics/blob/fb01203897860844c038663b813a7ca7de7ba520/pal_statistics/src/pal_statistics.cpp#L77
- name: /controller_manager/introspection_data/names
  type: pal_statistics_msgs/msg/StatisticsNames
  direction: out
  nodes:
  - /controller_manager
  rate: non_periodic
  latched: true
  qos:
    reliability: reliable
    durability: transient_local
    depth: 1
  source: https://github.com/pal-robotics/pal_statistics/blob/fb01203897860844c038663b813a7ca7de7ba520/pal_statistics/src/pal_statistics.cpp#L80
  notes: Republished only when the registered names change.
- name: /controller_manager/introspection_data/values
  type: pal_statistics_msgs/msg/StatisticsValues
  direction: out
  nodes:
  - /controller_manager
  rate: 50
  rate_basis: source
  rate_note: every controller_manager update while subscribed
  qos:
    reliability: best_effort
    durability: transient_local
    depth: 1
  source: https://github.com/pal-robotics/pal_statistics/blob/fb01203897860844c038663b813a7ca7de7ba520/pal_statistics/src/pal_statistics.cpp#L82
- name: /controller_manager/statistics/full
  type: pal_statistics_msgs/msg/Statistics
  direction: out
  nodes:
  - /controller_manager
  rate: 50
  rate_basis: source
  rate_note: controller_manager execution statistics, filled every update (50 Hz), published only while subscribed
  qos:
    reliability: best_effort
    durability: transient_local
    depth: 1
  source:
  - https://github.com/ros-controls/ros2_control/blob/b7f1a5d420443c7a079f4c81e80d5e39759acf4c/controller_manager/src/controller_manager.cpp#L685
