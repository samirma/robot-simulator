- name: /image_raw
  type: sensor_msgs/msg/Image
  direction: out
  nodes:
  - /usb_cam
  rate: 30
  rate_basis: source
  camera: true
  frame_id: default_cam
  rate_note: framerate parameter default 30.0; the capture timer period is int(1000/30) = 33 ms and each tick publishes
    the frame the V4L2 device delivered at its 30 fps mode
  qos:
    reliability: reliable
    durability: volatile
    depth: 100
  source:
  - https://github.com/ros-drivers/usb_cam/blob/cb2ae6bc0a312de629f84fef933fb3e07dac1ef8/src/ros2/usb_cam_node.cpp#L37
  - https://github.com/ros-drivers/usb_cam/blob/cb2ae6bc0a312de629f84fef933fb3e07dac1ef8/src/ros2/usb_cam_node.cpp#L67
  - https://github.com/ros-drivers/usb_cam/blob/cb2ae6bc0a312de629f84fef933fb3e07dac1ef8/src/ros2/usb_cam_node.cpp#L212
  notes: 'Wrist camera raw image: 640x480, encoding yuv422_yuy2 (pixel_format default yuyv), published through image_transport::CameraPublisher
    (sent only while subscribed).'
- name: /camera_info
  type: sensor_msgs/msg/CameraInfo
  direction: out
  nodes:
  - /usb_cam
  rate: 30
  rate_basis: source
  frame_id: default_cam
  qos:
    reliability: reliable
    durability: volatile
    depth: 100
  source:
  - https://github.com/ros-drivers/usb_cam/blob/cb2ae6bc0a312de629f84fef933fb3e07dac1ef8/src/ros2/usb_cam_node.cpp#L380
  - https://github.com/ros-drivers/usb_cam/blob/cb2ae6bc0a312de629f84fef933fb3e07dac1ef8/src/ros2/usb_cam_node.cpp#L147
  notes: 'Published with every image. camera_info_url is empty by default, so the camera is uncalibrated: width
    640, height 480, header.frame_id default_cam, K/D/R/P all zero, distortion_model empty.'
- name: /image_raw/compressed
  type: sensor_msgs/msg/CompressedImage
  direction: out
  nodes:
  - /usb_cam
  rate: 30
  rate_basis: source
  optional: true
  frame_id: default_cam
  source: https://github.com/ros-perception/image_transport_plugins/blob/bcc913e69d3db54b90b989c6b79c1b22d50e79c8/compressed_image_transport/include/compressed_image_transport/compressed_publisher.hpp#L61
  notes: image_transport compressed plugin (optional plugin); JPEG of each frame while subscribed.
- name: /image_raw/compressedDepth
  type: sensor_msgs/msg/CompressedImage
  direction: out
  nodes:
  - /usb_cam
  rate: non_periodic
  optional: true
  source: https://github.com/ros-perception/image_transport_plugins/blob/bcc913e69d3db54b90b989c6b79c1b22d50e79c8/compressed_depth_image_transport/include/compressed_depth_image_transport/compressed_depth_publisher.hpp#L57
  frame_id: default_cam
  notes: 'compressedDepth plugin (optional plugin); advertises but encodes only depth encodings, so it publishes
    nothing for this colour stream; it would carry the raw image header (compressed_depth_image_transport/src/codec.cpp#L215;
    amended 2026-10-03: frame recorded).'
- name: /image_raw/theora
  type: theora_image_transport/msg/Packet
  direction: out
  nodes:
  - /usb_cam
  rate: non_periodic
  optional: true
  source: https://github.com/ros-perception/image_transport_plugins/blob/bcc913e69d3db54b90b989c6b79c1b22d50e79c8/theora_image_transport/include/theora_image_transport/theora_publisher.hpp#L66
  notes: theora plugin (optional plugin); packets are emitted by the encoder, not one per frame.
- name: /image_raw/zstd
  type: sensor_msgs/msg/CompressedImage
  direction: out
  nodes:
  - /usb_cam
  rate: 30
  rate_basis: source
  optional: true
  source: https://github.com/ros-perception/image_transport_plugins/blob/bcc913e69d3db54b90b989c6b79c1b22d50e79c8/zstd_image_transport/include/zstd_image_transport/zstd_publisher.hpp#L60
  frame_id: default_cam
  notes: 'zstd plugin (optional plugin); one compressed frame per image while subscribed, carrying the raw
    image header (zstd_image_transport/src/zstd_publisher.cpp#L148; amended 2026-10-03: frame recorded).'
