  revision: e424839f0fb23cc0b0ade8d6e5ea166e30811356
  role: ros2_control hardware plugin feetech_ros2_driver/FeetechHardwareInterface for hardware_type:=real; release
    0.2.2 (the Jazzy binary release 0.2.2-1). ros2_so_arm pins no revision; 0.2.2 is the release whose parameter
