# SO-101 - ROS 2 interface (schema: robots_specs/SCHEMA.md).
# Approved community interface, not manufacturer-provided: ros-physical-ai/ros2_so_arm real-hardware
# bringup (hardware_type:=real) + ros-drivers/usb_cam wrist camera, on ROS 2 Jazzy.
# Generated from the pinned sources listed under `sources`; every row cites its pinned line.
schema_version: 1
robot_id: so101
name: SO-101
dialect: ros2
ros_distribution: jazzy
interface_authority: approved_community
sources:
- id: ros2_so_arm
  url: https://github.com/ros-physical-ai/ros2_so_arm
  revision: e166df9d51f43b24da9b99047c6c51c306bda74f
  branch: main
  role: approved community real-hardware ROS 2 bringup (so_arm101_description); authoritative boot
- id: usb_cam
  url: https://github.com/ros-drivers/usb_cam
  revision: cb2ae6bc0a312de629f84fef933fb3e07dac1ef8
