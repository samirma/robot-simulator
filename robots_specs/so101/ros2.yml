    source: https://github.com/ros-drivers/usb_cam/blob/cb2ae6bc0a312de629f84fef933fb3e07dac1ef8/src/ros2/usb_cam_node.cpp#L75-L85

stop_command: >-
  No dedicated stop topic or service exists. Per the sources: (1) cancel the active
  /joint_trajectory_controller/follow_joint_trajectory goal — the controller then holds the current
  position (decelerate_on_cancel is false) [joint_trajectory_controller.cpp#L1423-L1449]; an empty
  JointTrajectory on /joint_trajectory_controller/joint_trajectory is rejected by validation in 4.42.1
  ("Empty trajectory received", #L1695) despite the userdoc saying it overrides the goal, so it is not a
  stop. (2) cancel the /gripper_controller/gripper_cmd goal — the gripper holds its current position
  [parallel_gripper_action_controller_impl.hpp#L175-L186]. (3) Torque-off: deactivate the hardware with
  /controller_manager/set_hardware_component_state {name: SO_ARM101, target_state: {id: 2, label: inactive}};
  FeetechHardwareInterface::on_deactivate writes TORQUE_ENABLE=0 to all servos
  [feetech_ros2_driver/src/feetech_ros2_driver.cpp#L316-L327].
