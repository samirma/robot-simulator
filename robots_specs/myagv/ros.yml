    role: dependency, tag 0.7.7 (Noetic tf2_ros broadcasters)
  - id: robot_state_publisher
    url: https://github.com/ros/robot_state_publisher
    revision: bd2a7c6528b4850e3d1cfd4ec55f5798e87d6388
    role: dependency, tag 1.15.2 (Noetic)
  - id: joint_state_publisher
    url: https://github.com/ros/joint_state_publisher
    revision: af3dd1bec348adba7879e3e7a866c5a28816bd38
    role: dependency, tag 1.15.1 (Noetic)
  - id: ydlidar_sdk
    url: https://github.com/YDLIDAR/YDLidar-SDK
    revision: 42a82ed10d2304094c111fc63dee8e4a229b79b7
    role: >-
      dependency of ydlidar_ros_driver; the vendor pins no SDK revision (the robot image carries
