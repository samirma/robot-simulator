  - {name: /usb_cam/image_raw/compressed/jpeg_progressive, node: /usb_cam, value: false, optional: true, source: "https://github.com/ros-perception/image_transport_plugins/blob/7825def310eaab518da912bc491266e76eda8742/compressed_image_transport/cfg/CompressedPublisher.cfg#L14", notes: "dynamic_reconfigure default written by the plugin's server at start"}
  - {name: /usb_cam/image_raw/compressed/jpeg_optimize, node: /usb_cam, value: false, optional: true, source: "https://github.com/ros-perception/image_transport_plugins/blob/7825def310eaab518da912bc491266e76eda8742/compressed_image_transport/cfg/CompressedPublisher.cfg#L15", notes: "dynamic_reconfigure default written by the plugin's server at start"}
  - {name: /usb_cam/image_raw/compressed/jpeg_restart_interval, node: /usb_cam, value: 0, optional: true, source: "https://github.com/ros-perception/image_transport_plugins/blob/7825def310eaab518da912bc491266e76eda8742/compressed_image_transport/cfg/CompressedPublisher.cfg#L16", notes: "dynamic_reconfigure default written by the plugin's server at start"}
  - {name: /usb_cam/image_raw/compressed/png_level, node: /usb_cam, value: 9, optional: true, source: "https://github.com/ros-perception/image_transport_plugins/blob/7825def310eaab518da912bc491266e76eda8742/compressed_image_transport/cfg/CompressedPublisher.cfg#L17", notes: "dynamic_reconfigure default written by the plugin's server at start"}
  - {name: /usb_cam/image_raw/compressedDepth/format, node: /usb_cam, value: png, optional: true, source: "https://github.com/ros-perception/image_transport_plugins/blob/7825def310eaab518da912bc491266e76eda8742/compressed_depth_image_transport/cfg/CompressedDepthPublisher.cfg#L13", notes: "dynamic_reconfigure default written by the plugin's server at start"}
  - {name: /usb_cam/image_raw/compressedDepth/depth_max, node: /usb_cam, value: 10.0, optional: true, source: "https://github.com/ros-perception/image_transport_plugins/blob/7825def310eaab518da912bc491266e76eda8742/compressed_depth_image_transport/cfg/CompressedDepthPublisher.cfg#L14", notes: "dynamic_reconfigure default written by the plugin's server at start"}
  - {name: /usb_cam/image_raw/compressedDepth/depth_quantization, node: /usb_cam, value: 100.0, optional: true, source: "https://github.com/ros-perception/image_transport_plugins/blob/7825def310eaab518da912bc491266e76eda8742/compressed_depth_image_transport/cfg/CompressedDepthPublisher.cfg#L15", notes: "dynamic_reconfigure default written by the plugin's server at start"}
  - {name: /usb_cam/image_raw/compressedDepth/png_level, node: /usb_cam, value: 1, optional: true, source: "https://github.com/ros-perception/image_transport_plugins/blob/7825def310eaab518da912bc491266e76eda8742/compressed_depth_image_transport/cfg/CompressedDepthPublisher.cfg#L16", notes: "dynamic_reconfigure default written by the plugin's server at start"}
  - {name: /usb_cam/image_raw/theora/optimize_for, node: /usb_cam, value: 1, optional: true, source: "https://github.com/ros-perception/image_transport_plugins/blob/7825def310eaab518da912bc491266e76eda8742/theora_image_transport/cfg/TheoraPublisher.cfg#L12", notes: "dynamic_reconfigure default written by the plugin's server at start"}
  - {name: /usb_cam/image_raw/theora/target_bitrate, node: /usb_cam, value: 800000, optional: true, source: "https://github.com/ros-perception/image_transport_plugins/blob/7825def310eaab518da912bc491266e76eda8742/theora_image_transport/cfg/TheoraPublisher.cfg#L14", notes: "dynamic_reconfigure default written by the plugin's server at start"}
  - {name: /usb_cam/image_raw/theora/quality, node: /usb_cam, value: 31, optional: true, source: "https://github.com/ros-perception/image_transport_plugins/blob/7825def310eaab518da912bc491266e76eda8742/theora_image_transport/cfg/TheoraPublisher.cfg#L15", notes: "dynamic_reconfigure default written by the plugin's server at start"}
  - {name: /usb_cam/image_raw/theora/keyframe_frequency, node: /usb_cam, value: 64, optional: true, source: "https://github.com/ros-perception/image_transport_plugins/blob/7825def310eaab518da912bc491266e76eda8742/theora_image_transport/cfg/TheoraPublisher.cfg#L16", notes: "dynamic_reconfigure default written by the plugin's server at start"}
  # Beyond the values above, these optional nodes write parameters at run time that no launch
  # or yaml file sets: every dynamic_reconfigure server (/amcl, /move_base, both costmaps and
  # their layers, /move_base/GlobalPlanner, /move_base/TrajectoryPlannerROS) writes its whole
  # config, the .cfg default for each value not set above (navigation 1.17.3 */cfg/*.cfg), and
  # amcl saves its pose estimate to initial_pose_* and initial_cov_* (amcl_node.cpp L782-L790).
  # costmap_2d also copies local_costmap/inflation_radius into local_costmap/inflation_layer
  # (costmap_2d_ros.cpp L265-L297), which already holds the same 0.25.

tf:
  - parent: base_footprint
    child: base_up
    static: false
    publisher: /robot_state_publisher
    rate: 10
    source: https://github.com/ros/robot_state_publisher/blob/bd2a7c6528b4850e3d1cfd4ec55f5798e87d6388/src/joint_state_listener.cpp#L151
    notes: continuous joint base_up at the published position 0 (identity transform), one per /joint_states message.
  - parent: /base_footprint
    child: /camera_link
    static: true
    publisher: /base2camera_link
    rate: 20
    xyz: [0.13, 0.0, 0.131]
    rpy: [0.0, 0.0, 0.0]
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_odometry/launch/myagv_active.launch#L9
    notes: >-
      tf static_transform_publisher (period 50 ms) sends on /tf, not /tf_static, with the frame
      ids exactly as given in the launch - including the leading slash - and stamps future-dated
      by one period (geometry tf/src/static_transform_publisher.cpp L70-88; tf's
      TransformBroadcaster does not strip the slash).
  - parent: /base_footprint
    child: /imu_link
    static: true
    publisher: /base2imu_link
    rate: 20
    xyz: [0.0, 0.0, 0.0]
    rpy: [3.14159, 3.14159, 0.0]
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_odometry/launch/myagv_active.launch#L10
    notes: launch args are "yaw pitch roll" = 0 3.14159 3.14159 (together a rotation of ~pi about z); period 50 ms; same slash/stamp behaviour as above.
  - parent: /base_footprint
    child: /laser_frame
    static: true
    publisher: /base2laser_link
    rate: 100
    xyz: [0.065, 0.0, 0.08]
    rpy: [0.0, 0.0, 3.14159265]
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_odometry/launch/myagv_active.launch#L11
    notes: yaw pi; period 10 ms; same slash/stamp behaviour as above.
  - parent: odom
    child: base_footprint
    static: false
    publisher: /robot_pose_ekf
    rate: 30
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/robot_pose_ekf/src/odom_estimation_node.cpp#L474-L480
    notes: EKF estimate with z forced to 0 (vo and gps unused), sent with each odom_combined message.
  - parent: map
    child: odom
    static: false
    publisher: /amcl
    rate: non_periodic
    optional: true
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/launch/navigation_active.launch#L13
    notes: also published by /gmapping in the mapping launch.

motions:
  - id: drive
    velocity_driven: true
    command:
      interface: topic
      name: /cmd_vel
      type: geometry_msgs/Twist
      fields:
        - field: linear.x
          unit: m/s
          min: -1.0
          max: 1.0
          source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_odometry/src/myAGV.cpp#L223-L224
          notes: >-
            clamped to [-1, 1], then sent as a signed byte value*100 (truncation toward zero, so
            the resolution is 0.01 and |v| < 0.01 sends 0; L230). The manufacturer's maximum
            movement speed is 0.9 m/s (docs 2.1 L18).
        - field: linear.y
          unit: m/s
          min: -1.0
          max: 1.0
          source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_odometry/src/myAGV.cpp#L225-L226
          notes: positive = left (holonomic mecanum base); same encoding as linear.x
        - field: angular.z
          unit: rad/s
          min: -1.0
          max: 1.0
          source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_odometry/src/myAGV.cpp#L227-L228
          notes: positive = counter-clockwise; same encoding as linear.x
        - field: linear.z, angular.x, angular.y
          unit: n/a
          notes: ignored by the driver (myAGVSub.cpp L8-14)
      example: {linear: {x: 0.2, y: 0.0, z: 0.0}, angular: {x: 0.0, y: 0.0, z: 0.0}}
      notes: >-
        The driver forwards the command to the MCU only in loop cycles in which an MCU report was
        read successfully (myAGV.cpp L342-349). The MCU performs the mecanum mixing; its firmware
        is not published (see kinematics). The vendor's keyboard teleop defaults to 0.25 m/s and
        0.5 rad/s (myagv_teleop.py L192-193).
    stop:
      interface: topic
      name: /cmd_vel
      type: geometry_msgs/Twist
      message: {linear: {x: 0.0, y: 0.0, z: 0.0}, angular: {x: 0.0, y: 0.0, z: 0.0}}
      source:
        - https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_teleop/scripts/myagv_teleop.py#L235-L245
        - https://github.com/elephantrobotics/myAGV-docs/blob/2510f8a3bd399823dd82088a92b1b2ee62d6d130/MYAGV_PI_2023_EN/6-SDKDevelopment/6.2-ApplicationBaseROS1/6.2.4-Basic_Control_Based_on_ROS.md#L42-L50
        - https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_teleop/scripts/myagv_teleop.py#L149-L156
      notes: >-
        The official teleop sends an all-zero Twist on "k" or any unbound key, and when it exits. A zero Twist is the
        only way to stop: the driver holds the last command indefinitely.
    watchdog:
      present: false
      interval_s: null
      basis: source
      method: >-
        DERIVED FROM SOURCE, NOT MEASURED ON HARDWARE. myAGVSub.cpp stores the last /cmd_vel in
        globals (L4-14) and main() passes them to MyAGV::execute() every 10 ms loop cycle (L29-34),
        which writes them to the MCU (myAGV.cpp L338-349) with no timestamp or age check, so the
        ROS interface has no command timeout. The base MCU firmware is not published, so whether
        the MCU itself applies a timeout could not be established from source. The real-hardware
        measurement the robot specification asks for (publish one non-zero /cmd_vel, stop
        publishing, observe whether and when the base stops) has not been performed.
      date: 2026-09-30
      source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_odometry/src/myAGVSub.cpp#L4-L34
    feedback:
      - {name: /odom, field: "pose.pose (x, y, yaw) and twist.twist"}   # amended 2026-10-03: quoted (the unquoted commas split the field)
      - {name: /robot_pose_ekf/odom_combined, field: pose.pose}
    kinematics:
      type: mecanum
      wheel_radius: 0.040
      lx: 0.1069
      ly: 0.09875
      wheel_joints: [front_left_wheel_joint, front_right_wheel_joint, rear_left_wheel_joint, rear_right_wheel_joint]
      mixing: >-
        w_fl = (vx - vy - (lx+ly) wz) / r;  w_fr = (vx + vy + (lx+ly) wz) / r;
        w_rl = (vx + vy - (lx+ly) wz) / r;  w_rr = (vx - vy + (lx+ly) wz) / r   (rad/s, positive = rolling forward)
      basis: estimate
      source: robots_specs/myagv/import.md (wheel geometry measured on the official CAD mesh myagv_base.dae)
      notes: >-
        The MCU's own mixing is not published. The figures come from the official mesh (wheel
        diameter 80 mm, width 31.5 mm, wheel centres x +0.1124/-0.1014 m, y +0.09455/-0.10295 m
        in base_footprint) and the standard mecanum inverse kinematics; the roller handedness in
        model.xml realises exactly this mixing.

sensors:
  cameras:
    - id: front_camera
      image_topic: /usb_cam/image_raw
      info_topic: /usb_cam/camera_info
      frame_id: camera_link
      width: 640
      height: 480
      rate: 30
      encoding: rgb8
      hfov_deg: 53.98
      intrinsics:
        fx: 0.0
        fy: 0.0
        cx: 0.0
        cy: 0.0
        distortion_model: ""
        d: []
        basis: uncalibrated
        source: https://github.com/ros-drivers/usb_cam/blob/addab4a65fdf65c460fec2cc3eee8fab94699370/nodes/usb_cam_node.cpp#L128-L136
        notes: >-
          The wire publishes an uncalibrated CameraInfo (K, P zero). The model camera's field of
          view is an estimate: the manufacturer states a 65 deg viewing angle (docs 2.1 L15)
          without an axis; taken as the diagonal of the 640x480 image it gives f = 627.9 px,
          hfov 53.98 deg, vfov 41.83 deg (model.xml fovy), consistent with the vendor's own
          approximation f = image width = 640 px in simple_navigation_goals/scripts/aruco_detector.py L27-31.
      mount:
        parent: base_footprint
        xyz: [0.13, 0.0, 0.131]
        rpy: [0.0, 0.0, 0.0]
        basis: source
        source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_odometry/launch/myagv_active.launch#L9
      hardware: >-
        Built-in CSI camera, 5 MP, 65 deg viewing angle (docs 2.1 L15, 3_hardware.md L97);
        exposed as /dev/video0 (V4L2). Served on the wire by the approved community camera
        boot (usb_cam 0.3.7, defaults: 640x480 mjpeg decoded to rgb8 at 30 Hz).
  lidars:
    - id: lidar
      topic: /scan
      frame_id: laser_frame
      model: YDLIDAR X2L
      angle_min: -3.14159265
      angle_max: 3.14159265
      samples: 400
      range_min: 0.1
      range_max: 12.0
      scan_rate: 10
      basis: manufacturer
      mount:
        parent: base_footprint
        xyz: [0.065, 0.0, 0.08]
        rpy: [0.0, 0.0, 3.14159265]
        basis: source
        source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_odometry/launch/myagv_active.launch#L11
      source:
        - https://github.com/elephantrobotics/myAGV-docs/blob/2510f8a3bd399823dd82088a92b1b2ee62d6d130/MYAGV_PI_2023_EN/3-UserNotes/3_hardware.md#L3-L9
        - https://github.com/elephantrobotics/myAGV-docs/blob/2510f8a3bd399823dd82088a92b1b2ee62d6d130/MYAGV_PI_2023_EN/resources/3-UserNotes/FAQ/hardware_1.png
        - https://github.com/YDLIDAR/YDLidar-SDK/blob/42a82ed10d2304094c111fc63dee8e4a229b79b7/src/CYdLidar.cpp#L620-L635
      notes: >-
        Vendor X2L table: ranging 4000 Hz, scan 10 Hz typical (8-12, PWM/voltage speed), range
        0.12 to >8 m, 0.90 deg resolution at 10 Hz, 0-360 deg, pitch 0.25-1.75 deg. Message
        fields: angle_min/max = -pi/pi and range_min/max = 0.1/12.0 from the launch; with
        resolution_fixed and a single-channel lidar the SDK fixes the point count to the
        measured points per revolution rounded to 10 (4000/10 = 400), angle_increment =
        2*pi/(400-1) = 0.015747 rad (estimate for the exact count). Counter-clockwise
        (inverted: true). Every return inside the ignore_array sector [-50 deg, 50 deg] of
        laser_frame - which points to the robot's rear (yaw pi) - is reported as 0.0
        (CYdLidar.cpp L727-731), as are invalid returns (invalid_range_is_inf false).
  imus:
    - id: base_imu
      topic: /imu
      frame_id: imu_link
      rate: 100
      mount:
        parent: base_footprint
        xyz: [0.0, 0.0, 0.0]
        rpy: [3.14159, 3.14159, 0.0]
        basis: source
        source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_odometry/launch/myagv_active.launch#L10
      source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_odometry/src/myAGV.cpp#L259-L291
      notes: IMU inside the base MCU; orientation is yaw only, relative to the power-on heading.

tolerances:
  - figure: drive displacement (forward, back, sideways) reported by /odom after a timed /cmd_vel
    applies_to: motions[drive], /odom pose x/y vs commanded velocity x duration
    tolerance: {relative: 0.10, absolute: 0.02, unit: m}
    basis: estimate
    notes: >-
      No manufacturer accuracy figure exists. Allows for the acceleration transient of the
      unpublished MCU speed loop and mecanum roller slip; the derived model reached 95.6-97.3%
      of the commanded 0.4 m at 0.2 m/s in a 2 s drive (import.md).
  - figure: drive rotation reported by /odom yaw after a timed /cmd_vel angular.z
    applies_to: motions[drive], /odom yaw vs commanded angular.z x duration
    tolerance: {relative: 0.10, absolute: 0.05, unit: rad}
    basis: estimate
    notes: >-
      Use |angular.z| >= 0.3 rad/s: the driver drops IMU yaw changes below 0.1 deg per report
      (myAGV.cpp L208), so slower turns under-report on the real robot too.
  - figure: residual chassis speed 0.5 s after the zero Twist
    applies_to: motions[drive] stop, /odom twist
    tolerance: {absolute: 0.01, unit: m/s}
    basis: estimate
    notes: one count of the MCU's 0.01 m/s velocity resolution.
  - figure: lidar range, 0.12-1 m
    applies_to: /scan ranges
    tolerance: {absolute: 0.02, unit: m}
    basis: manufacturer
    source: https://github.com/elephantrobotics/myAGV-docs/blob/2510f8a3bd399823dd82088a92b1b2ee62d6d130/MYAGV_PI_2023_EN/resources/3-UserNotes/FAQ/hardware_1.png
  - figure: lidar range, 1-6 m
    applies_to: /scan ranges
    tolerance: {relative: 0.035}
    basis: manufacturer
    source: https://github.com/elephantrobotics/myAGV-docs/blob/2510f8a3bd399823dd82088a92b1b2ee62d6d130/MYAGV_PI_2023_EN/resources/3-UserNotes/FAQ/hardware_1.png
  - figure: lidar scan rate
    applies_to: /scan
    tolerance: {relative: 0.2}
    basis: manufacturer
    notes: the X2L scan frequency is 8-12 Hz (typical 10); the simulator spec's own +-10% rate bound still applies to the recorded 10 Hz.

notes: >-
  ROS infrastructure (rosout, roslaunch and master parameters, logger services) is omitted.
  The vendor's keyboard teleop (myagv_teleop), joystick launches (myagv_ps2) and socket server
  (simple_navigation_goals/scripts/agv_socket_server.py) are clients of this interface, not part
  of it.
