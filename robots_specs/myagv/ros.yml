  # set by move_base when it loads its default recovery behaviours (no recovery_behaviors parameter)
  - {name: /move_base/conservative_reset/reset_distance, node: /move_base, value: 3.0, optional: true, source: "https://github.com/ros-planning/navigation/blob/f13af47ee2bca6c3bf99db2965e46e55303f6e66/move_base/src/move_base.cpp#L1110", notes: "conservative_reset_dist unset, default 3.0 (L113)"}
