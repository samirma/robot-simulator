# myAGV (Raspberry Pi 2023) — authoritative ROS 1 interface, schema version 1 (robots_specs/SCHEMA.md).
#
# Every row was derived by reading the pinned sources below on 2026-09-30. Rates marked
# rate_basis: estimate or manufacturer could not be fixed from source alone; nothing here was
# measured on a real robot.
schema_version: 1
robot_id: myagv
name: myAGV
dialect: ros1
ros_distribution: noetic
interface_authority: manufacturer
# The camera rows come from the approved community camera boot (usb_cam 0.3.7, see boot and the
# usb_cam source): approved, not manufacturer-provided, and required (not optional).
camera_boot_authority: approved_community

sources:
  - id: myagv_ros
    url: https://github.com/elephantrobotics/myagv_ros
    branch: myagv_ros_2023Pi
    revision: c71f3cc574e5ed1973a925238eabe88662cfa701
    role: official source (boot launch, base driver, EKF, lidar driver, URDF and meshes)
  - id: myagv_docs
    url: https://github.com/elephantrobotics/myAGV-docs
    revision: 2510f8a3bd399823dd82088a92b1b2ee62d6d130
    role: official documentation (markdown source of https://docs.elephantrobotics.com/docs/myagv_pi23_en/)
  - id: geometry
    url: https://github.com/ros/geometry
    revision: 86618c7f902ef17b91bfb414652b3a82f7a40d67
    role: dependency, tag 1.13.2 (Noetic tf, static_transform_publisher)
  - id: geometry2
    url: https://github.com/ros/geometry2
    revision: 309814fd7d55d874f9bac40b2cc8669a5b86f3c5
    role: dependency, tag 0.7.7 (Noetic tf2_ros broadcasters)
  - id: robot_state_publisher
    url: https://github.com/ros/robot_state_publisher
    revision: bd2a7c6528b4850e3d1cfd4ec55f5798e87d6388
    role: dependency, tag 1.15.2 (Noetic)
  - id: joint_state_publisher
    url: https://github.com/ros/joint_state_publisher
    revision: af3dd1bec348adba7879e3e7a866c5a28816bd38
    role: dependency, tag 1.15.1 (Noetic)
  - id: ydlidar_sdk
    url: https://github.com/YDLIDAR/YDLidar-SDK
    revision: 42a82ed10d2304094c111fc63dee8e4a229b79b7
    role: >-
      dependency of ydlidar_ros_driver; the vendor pins no SDK revision (the robot image carries
      its own build), so this is the upstream head read on 2026-09-30 for the scan geometry logic
  - id: usb_cam
    url: https://github.com/ros-drivers/usb_cam
    revision: addab4a65fdf65c460fec2cc3eee8fab94699370
    branch: develop (ROS 1)
    role: >-
      approved community camera boot, tag 0.3.7 (the Noetic release; lightweight tag on commit
      addab4a); not manufacturer-provided. Its camera streams are required.
  - id: image_common
    url: https://github.com/ros-perception/image_common
    revision: 5559cc5ff15c4e94bef7912eabe5e330de62475c
    role: dependency of usb_cam, tag 1.12.1 (camera_info_manager, image_transport)

boot:
  summary: >-
    The documented bring-up (docs 6.2.4 "Basic Control Based on ROS") powers the lidar with
    start_ydlidar.sh and runs `roslaunch myagv_odometry myagv_active.launch`: the base driver
    myagv_odometry_node (MCU on /dev/ttyAMA2), robot_description + joint_state_publisher +
    robot_state_publisher, three tf static_transform_publisher nodes (camera, IMU, laser mounts),
    robot_pose_ekf fusing /odom and /imu, and the YDLIDAR driver via X2.launch. Keyboard/joystick
    teleop, gmapping and navigation are separate launches (clients or optional rows). No vendor
    launch starts a ROS camera driver (the vendor reads the CSI camera through OpenCV on
    /dev/video0 in simple_navigation_goals/scripts/aruco_detector.py), so the camera is served by
    the approved community camera boot: the pinned usb_cam 0.3.7 node run beside the vendor launch
    as `rosrun usb_cam usb_cam_node _camera_frame_id:=camera_link`, every other setting at the
    driver's defaults (video_device /dev/video0, 640x480, pixel_format mjpeg, framerate 30,
    io_method mmap, camera_info_url empty). This camera boot is approved, not manufacturer-
    provided, and its camera streams are required.
  commands:
    - cd ~/myagv_ros/src/myagv_odometry/scripts && ./start_ydlidar.sh   # sets GPIO20 high: lidar power
    - roslaunch myagv_odometry myagv_active.launch
    - rosrun usb_cam usb_cam_node _camera_frame_id:=camera_link   # approved community camera boot (usb_cam 0.3.7)
  launch_files:
    - {source: myagv_ros, path: myagv_odometry/launch/myagv_active.launch}
    - {source: usb_cam, path: nodes/usb_cam_node.cpp, role: approved community camera boot (rosrun with _camera_frame_id:=camera_link; no launch file)}
    - {source: myagv_ros, path: ydlidar_ros_driver/launch/X2.launch, role: included by myagv_active.launch (L25)}
    - {source: myagv_ros, path: myagv_odometry/scripts/start_ydlidar.sh, role: lidar power script (calls start_ydlidar.py, GPIO20)}
    - {source: myagv_docs, path: MYAGV_PI_2023_EN/6-SDKDevelopment/6.2-ApplicationBaseROS1/6.2.4-Basic_Control_Based_on_ROS.md, role: "documentation of the bring-up (L7-19)"}
  data_files:
    - {source: myagv_ros, path: myagv_urdf/urdf/myAGV.urdf, role: robot_description (textfile)}
  hardware: >-
    Raspberry Pi 4B (4 GB) running Elephant Robotics' Ubuntu 20.04 image (latest listed:
    myAGV2023_ubuntu_V20250815_20.04Pi_aarch64, v1.2) with ROS Noetic. Base MCU (motor drivers,
    IMU, battery monitor) on /dev/ttyAMA2 at 115200 8N1, auto-report enabled by the driver
    (0xfe 0xfe 0x01 0x0c 0x01). Four mecanum wheels on planetary brushless DC motors. YDLIDAR X2L
    on /dev/ttyAMA0 at 115200, powered through GPIO20. CSI camera, 5 MP, 65 deg viewing angle
    (/dev/video0; no ROS driver in the boot). Weight 4.16 kg, max speed 0.9 m/s (docs 2.1).
    Base MCU firmware source is not published.

model:
  urdf: myAGV.urdf
  urdf_sha256: afdac8fa76d01d15ca91b9ec6bc488e1c53a1abf50f417f67f92f6ac84fa43e7
  urdf_source: {source: myagv_ros, path: myagv_urdf/urdf/myAGV.urdf}
  mjcf: model.xml
  mjcf_official: false
  robot_description:
    published_as: ROS parameter /robot_description (textfile), read by robot_state_publisher and joint_state_publisher
    content: {file: myAGV.urdf}
    differences_from_model:
      - >-
        joint base_up (continuous, base_footprint -> base_up) is kept with the same name and axis
        but locked at 0 by an equality constraint: the real top plate is rigid and
        joint_state_publisher only ever publishes 0 for it.
      - >-
        the model adds bodies the URDF lacks (four mecanum wheels with passive rollers,
        camera_link body, laser_frame and imu_link sites); their joints are not in
        robot_description and never appear on the wire. See import.md.

nodes:
  - name: /myagv_odometry_node
    package: myagv_odometry
    executable: myagv_odometry_node
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_odometry/launch/myagv_active.launch#L3
  - name: /joint_state_publisher
    package: joint_state_publisher
    executable: joint_state_publisher
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_odometry/launch/myagv_active.launch#L6
  - name: /robot_state_publisher
    package: robot_state_publisher
    executable: robot_state_publisher
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_odometry/launch/myagv_active.launch#L7
  - name: /base2camera_link
    package: tf
    executable: static_transform_publisher
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_odometry/launch/myagv_active.launch#L9
    notes: roslaunch's __name disables the executable's AnonymousName (geometry tf/src/static_transform_publisher.cpp#L68).
  - name: /base2imu_link
    package: tf
    executable: static_transform_publisher
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_odometry/launch/myagv_active.launch#L10
  - name: /base2laser_link
    package: tf
    executable: static_transform_publisher
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_odometry/launch/myagv_active.launch#L11
  - name: /robot_pose_ekf
    package: robot_pose_ekf
    executable: robot_pose_ekf
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_odometry/launch/myagv_active.launch#L13
    notes: vendored and modified copy (publishes nav_msgs/Odometry instead of PoseWithCovarianceStamped).
  - name: /ydlidar_lidar_publisher
    package: ydlidar_ros_driver
    executable: ydlidar_ros_driver_node
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/ydlidar_ros_driver/launch/X2.launch#L2
  # --- camera driver: approved community camera boot (usb_cam 0.3.7) ---
  - name: /usb_cam
    package: usb_cam
    executable: usb_cam_node
    source: https://github.com/ros-drivers/usb_cam/blob/addab4a65fdf65c460fec2cc3eee8fab94699370/nodes/usb_cam_node.cpp
    notes: >-
      Approved community camera boot, not manufacturer-provided: the pinned Noetic driver run
      beside the vendor launch as `rosrun usb_cam usb_cam_node _camera_frame_id:=camera_link` (frame from the boot's
      base2camera_link transform); everything else at the driver defaults.
  # --- optional: mapping (myagv_navigation/launch/myagv_slam_laser.launch -> gmapping.launch) ---
  - name: /gmapping
    package: gmapping
    executable: slam_gmapping
    optional: true
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/launch/gmapping.launch#L5
  # --- optional: navigation (myagv_navigation/launch/navigation_active.launch) ---
  - name: /map_server_for_test
    package: map_server
    executable: map_server
    optional: true
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/launch/navigation_active.launch#L6
  - name: /amcl
    package: amcl
    executable: amcl
    optional: true
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/launch/navigation_active.launch#L13
  - name: /move_base
    package: move_base
    executable: move_base
    optional: true
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/launch/navigation_active.launch#L20

topics:
  # --- base driver: myagv_odometry_node ---
  - name: /cmd_vel
    type: geometry_msgs/Twist
    direction: in
    nodes: [/myagv_odometry_node]
    rate: non_periodic
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_odometry/src/myAGVSub.cpp#L26
    notes: >-
      Only linear.x, linear.y and angular.z are read (myAGVSub.cpp L8-14); the last value is held
      and re-sent to the MCU every loop cycle (see motions[drive]). Also published by the
      optional /move_base.
  - name: /odom
    type: nav_msgs/Odometry
    direction: out
    nodes: [/myagv_odometry_node]
    rate: 100
    rate_basis: estimate
    rate_note: >-
      ros::Rate(100) loop (myAGVSub.cpp L27), but each cycle blocks in readSpeed() on the MCU's
      serial auto-report (myAGV.cpp L122-145), whose period is not documented and whose firmware
      is not published; 100 Hz assumes the MCU reports at least that fast. Not measured.
    frame_id: odom
    child_frame_id: base_footprint
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_odometry/src/myAGV.cpp#L293-L336
    notes: >-
      twist.linear.x/y and twist.angular.z are the MCU-reported chassis velocities
      ((byte-128)*0.01, i.e. 0.01 m/s and 0.01 rad/s resolution, L172-174). Pose x/y integrate
      that twist; the heading is the MCU IMU yaw (degrees, L195-197) accumulated with a
      per-sample dead band: yaw changes smaller than 0.1 deg between two reports are dropped
      (L206-211), so at 100 Hz a turn slower than ~0.17 rad/s adds nothing to the odometry
      heading. pose.position.z = 0. Covariances are the fixed arrays at L13-26. No TF is
      broadcast by this node (L317).
  - name: /imu
    type: sensor_msgs/Imu
    direction: out
    nodes: [/myagv_odometry_node]
    rate: 100
    rate_basis: estimate
    rate_note: same MCU-gated loop as /odom
    frame_id: imu_link
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_odometry/src/myAGV.cpp#L259-L291
    notes: >-
      orientation = yaw only (roll = pitch = 0), the MCU yaw converted deg -> rad (L267);
      angular_velocity = (raw-10000)*0.1 and linear_acceleration = (raw-10000)*0.001 exactly as the
      MCU reports them (L176-182); the driver converts no units and the MCU units are not
      documented (deg/s and m/s^2 are the likely units - estimate). Covariances fixed (L282-288).
  - name: /Voltage
    type: std_msgs/Float32
    direction: out
    nodes: [/myagv_odometry_node]
    rate: 100
    rate_basis: estimate
    rate_note: same MCU-gated loop as /odom
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_odometry/src/myAGV.cpp#L249-L257
    notes: Main battery voltage, V (byte/10, L186).
  - name: /voltage_backup
    type: std_msgs/Float32
    direction: out
    nodes: [/myagv_odometry_node]
    rate: 100
    rate_basis: estimate
    rate_note: same MCU-gated loop as /odom
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_odometry/src/myAGV.cpp#L249-L257
    notes: Backup battery voltage, V; 0.0 when no backup battery is fitted (L188-193).

  # --- robot description ---
  - name: /joint_states
    type: sensor_msgs/JointState
    direction: out
    nodes: [/joint_state_publisher]
    rate: 10
    rate_basis: source
    rate_note: joint_state_publisher default rate 10 Hz (param "rate" unset by the boot)
    source: https://github.com/ros/joint_state_publisher/blob/af3dd1bec348adba7879e3e7a866c5a28816bd38/joint_state_publisher/src/joint_state_publisher/__init__.py#L210
    notes: name [base_up], position [0.0] (the URDF's only movable joint, default position).
  - name: /tf
    type: tf2_msgs/TFMessage
    direction: out
    nodes: [/robot_state_publisher, /base2camera_link, /base2imu_link, /base2laser_link, /robot_pose_ekf]
    rate: 180
    rate_basis: source
    rate_note: >-
      sum of the publishers in tf[]: robot_state_publisher 10 (one message per /joint_states),
      base2camera_link 20, base2imu_link 20, base2laser_link 100, robot_pose_ekf 30.
    source: https://github.com/ros/geometry2/blob/309814fd7d55d874f9bac40b2cc8669a5b86f3c5/tf2_ros/src/transform_broadcaster.cpp#L42
  - name: /tf_static
    type: tf2_msgs/TFMessage
    direction: out
    nodes: [/robot_state_publisher]
    rate: non_periodic
    latched: true
    source: https://github.com/ros/robot_state_publisher/blob/bd2a7c6528b4850e3d1cfd4ec55f5798e87d6388/src/robot_state_publisher.cpp#L145-L167
    notes: >-
      One latched message sent at start-up with the URDF's fixed joints; myAGV.urdf has none, so
      its transforms list is empty (use_tf_static default true, one-shot timer
      joint_state_listener.cpp#L86).

  # --- robot_pose_ekf ---
  - name: /robot_pose_ekf/odom_combined
    type: nav_msgs/Odometry
    direction: out
    nodes: [/robot_pose_ekf]
    rate: 30
    rate_basis: source
    rate_note: >-
      timer at freq 30 Hz (launch L16, odom_estimation_node.cpp L103); a message is published
      only when the filter updates with newer sensor data, so 30 Hz holds while /odom and /imu
      arrive faster than 30 Hz.
    frame_id: odom
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/robot_pose_ekf/src/odom_estimation_node.cpp#L436-L470
    notes: >-
      Pose from the EKF of /odom + /imu; twist copied from the last /odom; child_frame_id is left
      empty ("") by this modified node; header.stamp is the publish time.

  # --- lidar: ydlidar_lidar_publisher (YDLIDAR X2L) ---
  - name: /scan
    type: sensor_msgs/LaserScan
    direction: out
    nodes: [/ydlidar_lidar_publisher]
    rate: 10
    rate_basis: manufacturer
    rate_note: >-
      The driver loop (ros::Rate 30, ydlidar_ros_driver.cpp L172) blocks in doProcessSimple() for
      one full revolution, so /scan follows the lidar's own scan frequency; the launch's
      frequency parameter is ignored for this lidar (X2.launch L34-35: motor speed is external
      PWM). Vendor FAQ table for the X2L: scan frequency typical 10 Hz (8-12 Hz).
    frame_id: laser_frame
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/ydlidar_ros_driver/src/ydlidar_ros_driver.cpp#L172-L241
  - name: /point_cloud
    type: sensor_msgs/PointCloud
    direction: out
    nodes: [/ydlidar_lidar_publisher]
    rate: 10
    rate_basis: manufacturer
    rate_note: published with every /scan
    frame_id: laser_frame
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/ydlidar_ros_driver/src/ydlidar_ros_driver.cpp#L224-L242
    notes: Valid points (range_min..range_max) with channels "intensities" and "stamps".

  # --- camera (approved community camera boot, required) ---
  - name: /usb_cam/image_raw
    type: sensor_msgs/Image
    direction: out
    nodes: [/usb_cam]
    rate: 30
    rate_basis: source
    rate_note: usb_cam default framerate 30 (usb_cam_node.cpp L101, loop L258)
    frame_id: camera_link
    camera: true
    source: https://github.com/ros-drivers/usb_cam/blob/addab4a65fdf65c460fec2cc3eee8fab94699370/nodes/usb_cam_node.cpp#L89
    notes: 640x480, rgb8 (driver defaults, pixel_format mjpeg decoded). image_transport plugin topics appear only when those plugins are installed.
  - name: /usb_cam/camera_info
    type: sensor_msgs/CameraInfo
    direction: out
    nodes: [/usb_cam]
    rate: 30
    rate_basis: source
    rate_note: published with every image (image_transport CameraPublisher)
    frame_id: camera_link
    source: https://github.com/ros-drivers/usb_cam/blob/addab4a65fdf65c460fec2cc3eee8fab94699370/nodes/usb_cam_node.cpp#L128-L136
    notes: camera_info_url is empty, so the CameraInfo is uncalibrated - width 640, height 480, K/P/D zero or empty.

  # --- optional: mapping / navigation ---
  - name: /map
    type: nav_msgs/OccupancyGrid
    direction: out
    nodes: [/gmapping, /map_server_for_test]
    rate: non_periodic
    latched: true
    optional: true
    frame_id: map
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/launch/navigation_active.launch#L6-L8
  - name: /map_metadata
    type: nav_msgs/MapMetaData
    direction: out
    nodes: [/gmapping, /map_server_for_test]
    rate: non_periodic
    latched: true
    optional: true
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/launch/gmapping.launch#L5
  - name: /gmapping/entropy
    type: std_msgs/Float64
    direction: out
    nodes: [/gmapping]
    rate: non_periodic
    optional: true
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/launch/gmapping.launch#L5
  - name: /amcl_pose
    type: geometry_msgs/PoseWithCovarianceStamped
    direction: out
    nodes: [/amcl]
    rate: non_periodic
    optional: true
    frame_id: map
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/launch/navigation_active.launch#L13
  - name: /particlecloud
    type: geometry_msgs/PoseArray
    direction: out
    nodes: [/amcl]
    rate: non_periodic
    optional: true
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/launch/navigation_active.launch#L13
  - name: /initialpose
    type: geometry_msgs/PoseWithCovarianceStamped
    direction: in
    nodes: [/amcl]
    rate: non_periodic
    optional: true
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/launch/navigation_active.launch#L13
  - name: /move_base_simple/goal
    type: geometry_msgs/PoseStamped
    direction: in
    nodes: [/move_base]
    rate: non_periodic
    optional: true
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/launch/navigation_active.launch#L20
    notes: move_base's costmap, plan and action-internal topics are not enumerated here (optional launch).

services:
  - name: /start_scan
    type: std_srvs/Empty
    node: /ydlidar_lidar_publisher
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/ydlidar_ros_driver/src/ydlidar_ros_driver.cpp#L159
  - name: /stop_scan
    type: std_srvs/Empty
    node: /ydlidar_lidar_publisher
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/ydlidar_ros_driver/src/ydlidar_ros_driver.cpp#L157
  - name: /robot_pose_ekf/get_status
    type: robot_pose_ekf/GetStatus
    node: /robot_pose_ekf
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/robot_pose_ekf/src/odom_estimation_node.cpp#L143
    notes: "robot_pose_ekf/srv/GetStatus.srv: request empty, response string status."
  - name: /usb_cam/start_capture
    type: std_srvs/Empty
    node: /usb_cam
