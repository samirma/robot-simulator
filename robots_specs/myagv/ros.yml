# myAGV (Raspberry Pi 2023) — authoritative ROS 1 interface, schema version 1 (robots_specs/SCHEMA.md).
#
# Every row was derived by reading the pinned sources below on 2026-09-30. Rates marked
# rate_basis: estimate or manufacturer could not be fixed from source alone; nothing here was
# measured on a real robot.
schema_version: 1
robot_id: myagv
name: myAGV
dialect: ros1
ros_distribution: noetic
interface_authority: manufacturer
# The camera rows come from the approved community camera boot (usb_cam 0.3.7, see boot and the
# usb_cam source): approved, not manufacturer-provided, and required (not optional).
camera_boot_authority: approved_community

