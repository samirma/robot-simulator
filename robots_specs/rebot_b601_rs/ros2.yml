robot_id: rebot_b601_rs
name: reBot Arm B601-RS
dialect: ros2
ros_distribution: jazzy
interface_authority: manufacturer
# The camera rows come from the approved community camera boot (Seeed's B601-RS grasping guide: the Intel RealSense D405 on
# realsense2_camera, see camera_boot and the realsense-ros source): approved, not manufacturer-provided, and served (not
# optional).
