  notes: 'name [joint1..joint6, gripper_joint1, gripper_joint2]; arm: SDK motor position (rad), velocity (rad/s) and torque
    (N m) from the latest RobStride status frames; gripper: ratio = clamp(motor rad / 5.0, 0, 1), positions [0.05 * ratio,
    0.0715 * ratio] m, velocities (ratio(motor + motor velocity) - ratio(motor)) times the same limits (m/s), effort the
    gripper motor torque (N m) on both. header.stamp is the node clock at publication; frame_id is never set. RobStride
    motors report only in reply to commands (motorbridge request_feedback is a no-op), so while the motors are disabled
    the values repeat the last frames.'
