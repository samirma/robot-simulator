boot:
  summary: 'rebotarm_bringup bringup.launch.py with model:=rs channel:=can0 (Seeed''s B601-RS ROS 2 wiki). It starts /reBotArmController
    (rebotarmcontroller, rclpy, MultiThreadedExecutor) and /robot_state_publisher (robot_description = stdout of rviz_urdf_compat.py
    run on the RS URDF; /joint_states remapped to /rebotarm/joint_states); rviz2 only with use_rviz:=true (default false).
    The controller resolves rebotarm_hardware.yaml model rs: the SDK''s config/rebotarm_rs.yaml deep-merged with the rs
    overrides and channel can0, written to a temporary <model>_hardware.yaml that the SDK''s RebotArm loads; it connects
    the seven RobStride motors through motorbridge on SocketCAN can0, puts the arm group in MIT mode (kp/kd from the overrides)
    and the gripper in MIT mode, enables them and starts a 500 Hz loop that holds the current pose (MIT target, gravity
    feedforward) and the gripper''s current position. Every topic, service and action is under arm_namespace rebotarm. On
    shutdown (Ctrl+C) the node runs safe_home (gripper closed, arm to all-zero) and, with disable_after_safe_home true,
    disables the motors.'
  commands:
  - sudo ip link set can0 type can bitrate 1000000
  - sudo ip link set can0 up
  - ros2 launch rebotarm_bringup bringup.launch.py model:=rs channel:=can0
  launch_files:
  - source: reBotArmController_ROS2
    path: src/rebotarm_bringup/launch/bringup.launch.py
    role: authoritative boot
  - source: reBotArmController_ROS2
    path: src/rebotarm_bringup/launch/rviz_urdf_compat.py
    role: robot_description generator (run by the launch's Command substitution)
  data_files:
  - source: reBotArmController_ROS2
    path: src/rebotarm_bringup/config/rebotarm_hardware.yaml
    role: 'hardware selection: model rs, sdk_config rebotarm_rs.yaml and the rs overrides (default hardware_config)'
  - source: reBotArm_control_py
    path: config/rebotarm_rs.yaml
    role: SDK RS config (motor ids, models, MIT and POS_VEL gains, gripper joint), merged under the rs overrides
  - source: reBotArmController_ROS2
    path: src/rebotarm_bringup/description/RS/urdf/ReBot_Arm_RS.urdf
    role: input of robot_description and the SDK's Pinocchio model (urdf_path override)
  hardware: 'reBot Arm B601-RS, 6 DOF plus gripper: RobStride RS-06 on joint1-joint3 (CAN ids 0x01-0x03) and RS-00 on joint4-joint6
    (0x04-0x06) and the gripper (0x07), all with host (feedback) id 0xFD, one CAN bus at 1 Mbit/s. Gripper: the RS-00 turns
    a module-1 16-tooth pinion between two racks on an MGN9 rail (DevArm BOM). Host: Ubuntu 24.04, ROS 2 Jazzy, Python 3.12
    (the wiki''s main reference; Humble on 22.04 also documented), motorbridge 0.5.6 from PyPI, Pinocchio from ros-jazzy-pinocchio.
    CAN adapter: the kit''s USB-to-CAN board with PCAN-USB firmware (Linux peak_usb SocketCAN), interface can0, 1 Mbit/s,
    120 ohm termination switch. Power: DC 48 V (MeanWell LRS-600-48, 48 V 12.5 A, recommended) through an XT30 2+2 power
    separation board. No camera, lidar or IMU is started by the boot (Seeed publishes optional wrist-camera mounts only).'
model:
  urdf: ReBot_Arm_RS.urdf
  urdf_sha256: 978568c1b73310ec134b8f2285295f46d0c32c904d397bd097e3bcc81507b77b
  urdf_source:
    source: reBotArmController_ROS2
    path: src/rebotarm_bringup/description/RS/urdf/ReBot_Arm_RS.urdf
  mjcf: model.xml
  mjcf_official: false
  robot_description:
    published_as: /robot_state_publisher parameter robot_description and the transient-local topic /robot_description
    content:
      file: boot/robot_description.urdf
      generated: 'stdout of `python3 <share>/launch/rviz_urdf_compat.py <share>/description/RS/urdf/ReBot_Arm_RS.urdf` (bringup.launch.py
        L59-L75 with model:=rs), unstripped by the launch Command substitution, so it ends with a newline. Generated here
        by running the pinned script (read in full: it only parses the URDF with ElementTree and prints it) on the pinned
        URDF with Python 3.12 (Jazzy''s), python3 -I, from a directory outside the clone; Python 3.11, 3.13 and 3.14 give
        the same bytes. No installation-dependent content.'
      sha256: b45bd97e4b1ebd94283b59f2034e3451a5946db75a2b8d1a871cbaaf600e6f64
    differences_from_model:
    - 'compat split (rviz_urdf_compat.py L57-L87): every link with several visuals keeps only its first; each further visual
      moves, unchanged, into a new child link <link>__rviz_visual_<mesh stem> joined by a fixed joint <child>__fixed_joint
      at xyz 0 0 0, rpy 0 0 0, with no inertial or collision. 15 such links: link2 (cnc2, pla2_black, pla2_green), link3
      (motor_4, pla3_black_without_seeed_badge, pla3_seeed_badge_with_counters, pla3_seeed_wordmark_backing, pla3_green),
      link4 (cnc4), link5 (cnc5, pla5_green), gripper_end (cnc7, motor_7), gripper_left (cnc_left), gripper_right (cnc_right).
      Masses, inertias, collisions and every geometry pose are unchanged; the model keeps the official URDF''s links with
      all their visuals'
    - 'materials (rviz_urdf_compat.py L27-L33): rs_base_black, rs_motor_black and rs_pla_black become rgba 0.140 0.160 0.150
      1 (official 0.055 0.065 0.060 1, 0.045 0.052 0.049 1, 0.090 0.106 0.102 1), a presentation override for RViz; the
      model keeps the official colours'
    - 'serialisation: ElementTree drops the XML declaration and every comment (the exporter banner, the palette note and
      the commented-out whole-link visuals of link2-link5, gripper_end, gripper_left and gripper_right); attribute values
      are unchanged'
    - 'names, axes, origins, limits, zero offsets: identical to the official URDF (revolute joint1-joint6, prismatic gripper_joint1
      and gripper_joint2, fixed j_gripper_end; root base_link)'
    - 'arm command frame: the motors'' positions are the URDF joint angles with no sign, offset or ratio (joint_states publishes
      the SDK motor positions as joint1-joint6, and the SDK pads the same values into its Pinocchio model of this URDF for
      IK and gravity); the motor zero is the set_zero position, i.e. the URDF zero. The driver does not clamp arm targets
      to the URDF limits (motorbridge clamps MIT targets to +-4 pi rad); joint2 and joint3 have their URDF lower limit 0.0
      at the zero (safe_home) pose'
    - 'gripper: one motor (RS-00, id 7) commanded in motor rad, close 0.0 to open 5.0 (rebotarm_hardware.yaml rs position_limits);
      /rebotarm/joint_states reports it on the URDF''s two prismatic finger joints as ratio = clamp(motor / 5.0, 0, 1),
      gripper_joint1 = 0.05 * ratio m and gripper_joint2 = 0.0715 * ratio m (the URDF upper limits), so the two fingers
      are reported asymmetric (0.0100 and 0.0143 m per motor rad), while the rack-and-pinion moves both equally; Seeed''s
      fake driver and MoveIt pick-place config use 0.045 m per finger at 5.0 rad instead. Positive finger travel opens (each
      finger axis points away from the jaw centre)'
    - 'velocity and effort limits: URDF effort 36 N m (joint1-joint3) and 14 N m (joint4-joint6) equal motorbridge''s RS-06
      and RS-00 MIT torque ranges; URDF velocity 50 rad/s (joint1-joint3) equals the RS-06 MIT velocity range but 40 rad/s
      (joint4-joint6) exceeds the RS-00''s 33 rad/s; finger joints effort 500, velocity 10 (URDF values, no motor counterpart)'
