# reBot Arm B601-RS - ROS 2 interface (schema: robots_specs/SCHEMA.md).
# Manufacturer interface: Seeed's rebotarm_bringup bringup.launch.py model:=rs channel:=can0 (reBotArmController
# + robot_state_publisher) on ROS 2 Jazzy, with the reBotArm_control_py SDK and motorbridge on SocketCAN can0.
# Every row cites its pinned line in the sources listed under `sources`.
