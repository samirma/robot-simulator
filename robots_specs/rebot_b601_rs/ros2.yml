tolerances:
- figure: arm joint final position after a trajectory
  applies_to:
  - joint1
  - joint2
  - joint3
  - joint4
  - joint5
  - joint6
  tolerance:
    absolute: 0.03
    unit: rad
  basis: estimate
  notes: 'about 1.7 deg: the MIT position loop (kp 50-150 N m/rad) with gravity feedforward leaves a static error of residual
    torque / kp; 0.3 N m of unmodelled friction or gravity on a kp-50 wrist joint is 0.006 rad, and the 16-bit MIT position
    resolution is 0.0004 rad. Seeed states no joint accuracy'
- figure: gripper motor final position after a free (non-grasping) command
  applies_to:
  - gripper
  tolerance:
    absolute: 0.12
    unit: rad (gripper motor)
  basis: source
  source: https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/hardware_manager.py#L13
  notes: the driver's own goal test (_GRIPPER_GOAL_TOLERANCE_RAD); on /rebotarm/joint_states that is 0.0012 m on gripper_joint1
    and 0.0017 m on gripper_joint2
- figure: camera and lidar mount poses
  applies_to: sensors.cameras[*].mount
  tolerance:
    absolute: 0.002
    unit: m
  basis: estimate
  notes: the community mount is one unit's hand-eye result, rounded to 0.01 mm; the position of the colour sensor inside the D405
    case is the device's factory extrinsic. Orientation is exact
- figure: camera horizontal field of view
  applies_to: sensors.cameras[*].hfov_deg
  tolerance:
    absolute: 3.0
    unit: deg
  basis: manufacturer
  source: https://store.intelrealsense.com/buy-intel-realsense-depth-camera-d405.html
  notes: Intel states 87 +-3 deg; intrinsics are an estimate (see sensors.cameras[*].intrinsics)
- figure: end-effector repeatability
  applies_to:
  - gripper_end
  tolerance:
    absolute: 0.0002
    unit: m
  basis: manufacturer
  source: https://github.com/Seeed-Projects/reBot-DevArm/blob/0dfb49b85bc146eb3741f414be9dd2b1662345e8/README.md#L157
  notes: Seeed's specification '< 0.2 mm' (repeatability, not absolute accuracy)
notes: 'Seeed publishes and documents this interface (Seeed-Projects reBotArmController_ROS2 and the B601-RS ROS 2 wiki),
  so it is the manufacturer''s. Excluded as ROS infrastructure: /rosout, /parameter_events, every node''s parameter, logger
  and type-description services, ROS 2 action-internal topics and services, and the client-library parameters every node
  declares (use_sim_time: false; start_type_description_service: true). Rates are derived from the pinned source (rate_basis
  source), the /tf rate is an estimate, nothing is measured on hardware. The MoveIt 2 launches (rebotarm_moveit_config demo/hardware.launch.py),
  fake_rs_bringup.launch.py, driver.launch.py, the agent and MuJoCo packages and the example executables are other launches
  and are not recorded; MoveIt''s hardware path uses this boot''s /rebotarm/follow_joint_trajectory and /rebotarm/gripper/command.'
