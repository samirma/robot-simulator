motions:
- id: arm
  velocity_driven: false
  command:
    interface: action
    name: /rebotarm/follow_joint_trajectory
    type: control_msgs/action/FollowJointTrajectory
    fields:
    - field: trajectory.joint_names
      unit: joint name
      source: https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_actions.py#L146-L152
      notes: must be exactly [joint1, joint2, joint3, joint4, joint5, joint6] in this order, else INVALID_GOAL
    - field: trajectory.points[].positions[0] (joint1)
      unit: rad
      min: -2.8
      max: 2.8
      source: https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarm_bringup/description/RS/urdf/ReBot_Arm_RS.urdf#L111-L115
      notes: URDF limit of the boot's robot_description; the driver does not clamp
    - field: trajectory.points[].positions[1] (joint2)
      unit: rad
      min: 0.0
      max: 3.14
      source: https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarm_bringup/description/RS/urdf/ReBot_Arm_RS.urdf#L205-L209
      notes: URDF limit of the boot's robot_description; the driver does not clamp
    - field: trajectory.points[].positions[2] (joint3)
      unit: rad
      min: 0.0
      max: 3.14
      source: https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarm_bringup/description/RS/urdf/ReBot_Arm_RS.urdf#L319-L323
      notes: URDF limit of the boot's robot_description; the driver does not clamp
    - field: trajectory.points[].positions[3] (joint4)
      unit: rad
      min: -1.57
      max: 1.57
      source: https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarm_bringup/description/RS/urdf/ReBot_Arm_RS.urdf#L393-L397
      notes: URDF limit of the boot's robot_description; the driver does not clamp
    - field: trajectory.points[].positions[4] (joint5)
      unit: rad
      min: -1.57
      max: 1.57
      source: https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarm_bringup/description/RS/urdf/ReBot_Arm_RS.urdf#L477-L481
      notes: URDF limit of the boot's robot_description; the driver does not clamp
    - field: trajectory.points[].positions[5] (joint6)
      unit: rad
      min: -3.14
      max: 3.14
      source: https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarm_bringup/description/RS/urdf/ReBot_Arm_RS.urdf#L531-L535
      notes: URDF limit of the boot's robot_description; the driver does not clamp
    - field: trajectory.points[].time_from_start
      unit: s
      source: https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_actions.py#L165-L172
      notes: a first point after 0 s is preceded by the current position at 0 s; velocities, accelerations, effort and the
        goal's tolerances and goal_time_tolerance are ignored
    notes: Executed by linear joint-space interpolation between the points, writing the hold target about every 20 ms (sleep
      0.02 s) and publishing feedback (desired, actual, error) each step; desired velocities are zero. A goal is rejected
      while a trajectory, gravity compensation or safe home runs, and a disabled arm is re-enabled by the goal. Cancel holds
      the current position. The example is Seeed's pick-place ready_point [0.0, 0.75, 0.55, 0.0, 0.0, 0.0] with joint1 at
      0.3 (the wiki's own example keeps joint2 and joint3 on their 0.0 lower limits).
    source:
    - https://github.com/Seeed-Studio/wiki-documents/blob/2d9c3d1225f1ab98b79e1382b72ca9e2148bb23a/sites/en/docs/Robotics/Robot_Kits/reBot_Arm/B601_RS/reBot_Arm_B601_RS_ROS2_Integration.md#L370-L373
    - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_actions.py#L46-L49
    - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarm_moveit_demos/config/pick_place_rs.yaml#L12
    servo_profile:
      mode: MIT (RobStride operation control)
      loop_rate_hz: 500
      kp:
      - 50.0
      - 150.0
      - 150.0
      - 50.0
      - 50.0
      - 50.0
      kd:
      - 3.0
      - 10.0
      - 10.0
      - 5.0
      - 4.0
      - 4.0
      feedforward: Pinocchio gravity torque of the URDF at the measured joints (g = -9.81 m/s^2 along base z)
      basis: source
      source:
      - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarm_bringup/config/rebotarm_hardware.yaml#L42
      - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarm_bringup/config/rebotarm_hardware.yaml#L52-L55
      - https://github.com/Seeed-Projects/reBotArm_control_py/blob/6415d43130d1e143c70dc106096a857ac5556f81/reBotArm_control_py/controllers/rebotarm_endpose_controller.py#L328-L345
      - https://github.com/Seeed-Projects/reBotArm_control_py/blob/6415d43130d1e143c70dc106096a857ac5556f81/reBotArm_control_py/actuator/rebotarm.py#L382-L411
      - https://github.com/motorbridge/motorbridge/blob/c652ce420e7da1008fa1864cc7f47d7d7c57fdb6/motor_vendors/robstride/src/protocol.rs#L142-L170
      - https://github.com/motorbridge/motorbridge/blob/c652ce420e7da1008fa1864cc7f47d7d7c57fdb6/motor_vendors/robstride/src/motor.rs#L17-L24
      - https://github.com/motorbridge/motorbridge/blob/c652ce420e7da1008fa1864cc7f47d7d7c57fdb6/motor_vendors/robstride/src/motor.rs#L60-L66
      - https://github.com/motorbridge/motorbridge/blob/c652ce420e7da1008fa1864cc7f47d7d7c57fdb6/motor_vendors/robstride/src/motor.rs#L167-L171
      notes: 'per joint1..joint6: tau = kp (q_target - q) + kd (0 - dq) + tau_gravity, computed in the motor; motorbridge
        clamps MIT fields to position +-4 pi rad, velocity +-50 (RS-06) / +-33 (RS-00) rad/s, kp 0-5000 / 0-500, kd 0-100
        / 0-5, torque +-36 / +-14 N m'
    also: /rebotarm/move_to_pose (rebotarm_msgs/action/MoveToPose, Cartesian gripper_end goal in base_link with a duration)
      and /rebotarm/move_to_pose_ik (rebotarm_msgs/srv/MoveToPoseIK, IK then an immediate step of the hold target)
    alternative: per-joint raw commands /rebotarm/joints/<joint>/cmd/mit (JointMitCmd) and /rebotarm/joints/<joint>/cmd/pos_vel
      (JointPosVelCmd), debugging paths that stop the hold loop
    example:
      trajectory:
        joint_names:
        - joint1
        - joint2
        - joint3
        - joint4
        - joint5
        - joint6
        points:
        - positions:
          - 0.3
          - 0.75
          - 0.55
          - 0.0
          - 0.0
          - 0.0
          time_from_start:
            sec: 4
            nanosec: 0
  watchdog:
    present: false
    interval_s: null
    basis: source
    method: 'Derived from the pinned source, not measured on the real robot (the robot specification''s real-hardware measurement
      is outstanding): a trajectory ends by leaving the last point as the MIT hold target. Nothing times the target out:
      the SDK control loop resends it every 2 ms (500 Hz) for as long as the node runs, the controller has no command timeout,
      and motorbridge never writes the RobStride canTimeout parameter (0x7028, default 0 = off), so the motors also hold
      their last MIT command if the loop stops.'
    date: '2026-10-08'
    source:
    - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_actions.py#L174-L220
    - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/hardware_manager.py#L251-L262
    - https://github.com/Seeed-Projects/reBotArm_control_py/blob/6415d43130d1e143c70dc106096a857ac5556f81/reBotArm_control_py/controllers/rebotarm_endpose_controller.py#L328-L345
    - https://github.com/Seeed-Projects/reBotArm_control_py/blob/6415d43130d1e143c70dc106096a857ac5556f81/reBotArm_control_py/actuator/rebotarm.py#L785-L814
    - https://github.com/motorbridge/motorbridge/blob/c652ce420e7da1008fa1864cc7f47d7d7c57fdb6/motor_vendors/robstride/src/registers.rs#L185
  feedback:
  - name: /rebotarm/joint_states
    field: position[0..5] (joint1..joint6, rad)
  - name: /rebotarm/follow_joint_trajectory
    field: feedback.actual.positions, feedback.error.positions
  - name: /rebotarm/arm_status
    field: state_machine (TRAJ_RUNNING while executing, then IDLE)
  end_state: the action succeeds with error_code SUCCESSFUL once the elapsed time reaches the last point's time_from_start;
    the driver checks no position tolerance. The 500 Hz MIT loop then holds the last point (kp, kd, gravity feedforward),
    where the joints settle
- id: gripper
  velocity_driven: false
  command:
    interface: action
    name: /rebotarm/gripper/command
    type: control_msgs/action/GripperCommand
    fields:
    - field: command.position
      unit: rad (gripper motor angle)
      min: 0.0
      max: 5.0
      source:
      - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarm_bringup/config/rebotarm_hardware.yaml#L48-L51
      - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/hardware_manager.py#L72-L80
      - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/hardware_manager.py#L133-L143
      notes: 0.0 closed, 5.0 fully open; outside the range the goal aborts. /rebotarm/joint_states shows it as gripper_joint1
        = 0.01 m and gripper_joint2 = 0.0143 m per motor rad
    - field: command.max_effort
      unit: N m
      source: https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_actions.py#L274
      notes: 'used only for the stalled flag: stalled when the position changes < 1e-4 rad in 50 ms and |torque| >= max_effort;
        the gripper always moves with MIT kp 50, kd 4'
    notes: Sets the gripper target of the 500 Hz loop (MIT kp 50, kd 4 from rebotarm_rs.yaml) and sends it once; then polls
      every 50 ms for up to 5.0 s. Rejected in gravity compensation and safe home; aborts while disabled or during a trajectory.
    source:
    - https://github.com/Seeed-Projects/reBotArm_control_py/blob/6415d43130d1e143c70dc106096a857ac5556f81/config/rebotarm_rs.yaml#L122-L134
    - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_actions.py#L51-L52
    also: /rebotarm/gripper/set (rebotarm_msgs/srv/SetGripper, same units and range), /rebotarm/gripper/open and /rebotarm/gripper/close
      (rebotarm_msgs/srv/GripperCommand; position 0.0 means 5.0 / 0.0)
    alternative: raw /rebotarm/gripper/cmd/mit and /rebotarm/gripper/cmd/pos_vel (stop the hold loop)
    example:
      command:
        position: 5.0
        max_effort: 0.0
  watchdog:
    present: false
    interval_s: null
    basis: source
    method: 'Derived from the pinned source, not measured on the real robot (the robot specification''s real-hardware measurement
      is outstanding): the gripper goal stays the loop''s gripper target after the action returns. Nothing times the target
      out: the SDK control loop resends it every 2 ms (500 Hz) for as long as the node runs, the controller has no command
      timeout, and motorbridge never writes the RobStride canTimeout parameter (0x7028, default 0 = off), so the motors
      also hold their last MIT command if the loop stops.'
    date: '2026-10-08'
    source:
    - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_actions.py#L259-L291
    - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/hardware_manager.py#L563-L573
    - https://github.com/Seeed-Projects/reBotArm_control_py/blob/6415d43130d1e143c70dc106096a857ac5556f81/reBotArm_control_py/controllers/rebotarm_endpose_controller.py#L353-L358
    - https://github.com/Seeed-Projects/reBotArm_control_py/blob/6415d43130d1e143c70dc106096a857ac5556f81/reBotArm_control_py/actuator/rebotarm.py#L785-L814
    - https://github.com/motorbridge/motorbridge/blob/c652ce420e7da1008fa1864cc7f47d7d7c57fdb6/motor_vendors/robstride/src/registers.rs#L185
  feedback:
  - name: /rebotarm/gripper/state
    field: position (motor rad)
  - name: /rebotarm/joint_states
    field: position[6..7] (gripper_joint1, gripper_joint2, m)
  - name: /rebotarm/gripper/command
    field: result.position, result.reached_goal, result.stalled
  end_state: the action ends when |motor position - target| < 0.12 rad or after 5.0 s and always reports success; result.reached_goal
    is that 0.12 rad test, result.position the motor angle. A grasped object stops the fingers short of the target, squeezed
    by the motor's MIT torque kp * error (kp 50 N m/rad, at most the RS-00's 14 N m)
sensors:
  cameras: []
  lidars: []
  imus: []
tolerances:
- figure: arm joint final position after a trajectory
  applies_to:
  - joint1
  - joint2
  - joint3
  - joint4
  - joint5
  - joint6
  tolerance:
    absolute: 0.03
    unit: rad
  basis: estimate
  notes: 'about 1.7 deg: the MIT position loop (kp 50-150 N m/rad) with gravity feedforward leaves a static error of residual
    torque / kp; 0.3 N m of unmodelled friction or gravity on a kp-50 wrist joint is 0.006 rad, and the 16-bit MIT position
    resolution is 0.0004 rad. Seeed states no joint accuracy'
- figure: gripper motor final position after a free (non-grasping) command
  applies_to:
  - gripper
  tolerance:
    absolute: 0.12
    unit: rad (gripper motor)
  basis: source
  source: https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/hardware_manager.py#L13
  notes: the driver's own goal test (_GRIPPER_GOAL_TOLERANCE_RAD); on /rebotarm/joint_states that is 0.0012 m on gripper_joint1
    and 0.0017 m on gripper_joint2
- figure: end-effector repeatability
  applies_to:
  - gripper_end
  tolerance:
    absolute: 0.0002
    unit: m
  basis: manufacturer
  source: https://github.com/Seeed-Projects/reBot-DevArm/blob/0dfb49b85bc146eb3741f414be9dd2b1662345e8/README.md#L157
  notes: Seeed's specification '< 0.2 mm' (repeatability, not absolute accuracy)
notes: 'Seeed publishes and documents this interface (Seeed-Projects reBotArmController_ROS2 and the B601-RS ROS 2 wiki),
  so it is the manufacturer''s. Excluded as ROS infrastructure: /rosout, /parameter_events, every node''s parameter, logger
  and type-description services, ROS 2 action-internal topics and services, and the client-library parameters every node
  declares (use_sim_time: false; start_type_description_service: true). Rates are derived from the pinned source (rate_basis
  source), the /tf rate is an estimate, nothing is measured on hardware. The MoveIt 2 launches (rebotarm_moveit_config demo/hardware.launch.py),
  fake_rs_bringup.launch.py, driver.launch.py, the agent and MuJoCo packages and the example executables are other launches
  and are not recorded; MoveIt''s hardware path uses this boot''s /rebotarm/follow_joint_trajectory and /rebotarm/gripper/command.'
