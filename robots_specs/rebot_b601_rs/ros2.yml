boot:
  summary: 'rebotarm_bringup bringup.launch.py with model:=rs channel:=can0 (Seeed''s B601-RS ROS 2 wiki). It starts /reBotArmController
    (rebotarmcontroller, rclpy, MultiThreadedExecutor) and /robot_state_publisher (robot_description = stdout of rviz_urdf_compat.py
    run on the RS URDF; /joint_states remapped to /rebotarm/joint_states); rviz2 only with use_rviz:=true (default false).
    The controller resolves rebotarm_hardware.yaml model rs: the SDK''s config/rebotarm_rs.yaml deep-merged with the rs
    overrides and channel can0, written to a temporary <model>_hardware.yaml that the SDK''s RebotArm loads; it connects
    the seven RobStride motors through motorbridge on SocketCAN can0, puts the arm group in MIT mode (kp/kd from the overrides)
    and the gripper in MIT mode, enables them and starts a 500 Hz loop that holds the current pose (MIT target, gravity
    feedforward) and the gripper''s current position. Every topic, service and action is under arm_namespace rebotarm. On
    shutdown (Ctrl+C) the node runs safe_home (gripper closed, arm to all-zero) and, with disable_after_safe_home true,
    disables the motors. Camera: the boot starts no camera driver; the wrist camera is served by the camera boot
    (camera_boot).'
  commands:
  - sudo ip link set can0 type can bitrate 1000000
  - sudo ip link set can0 up
  - ros2 launch rebotarm_bringup bringup.launch.py model:=rs channel:=can0
  launch_files:
  - source: reBotArmController_ROS2
    path: src/rebotarm_bringup/launch/bringup.launch.py
    role: authoritative boot
  - source: reBotArmController_ROS2
    path: src/rebotarm_bringup/launch/rviz_urdf_compat.py
    role: robot_description generator (run by the launch's Command substitution)
  data_files:
  - source: reBotArmController_ROS2
    path: src/rebotarm_bringup/config/rebotarm_hardware.yaml
    role: 'hardware selection: model rs, sdk_config rebotarm_rs.yaml and the rs overrides (default hardware_config)'
  - source: reBotArm_control_py
    path: config/rebotarm_rs.yaml
    role: SDK RS config (motor ids, models, MIT and POS_VEL gains, gripper joint), merged under the rs overrides
  - source: reBotArmController_ROS2
    path: src/rebotarm_bringup/description/RS/urdf/ReBot_Arm_RS.urdf
    role: input of robot_description and the SDK's Pinocchio model (urdf_path override)
  hardware: 'reBot Arm B601-RS, 6 DOF plus gripper: RobStride RS-06 on joint1-joint3 (CAN ids 0x01-0x03) and RS-00 on joint4-joint6
    (0x04-0x06) and the gripper (0x07), all with host (feedback) id 0xFD, one CAN bus at 1 Mbit/s. Gripper: the RS-00 turns
    a module-1 16-tooth pinion between two racks on an MGN9 rail (DevArm BOM). Host: Ubuntu 24.04, ROS 2 Jazzy, Python 3.12
    (the wiki''s main reference; Humble on 22.04 also documented), motorbridge 0.5.6 from PyPI, Pinocchio from ros-jazzy-pinocchio.
    CAN adapter: the kit''s USB-to-CAN board with PCAN-USB firmware (Linux peak_usb SocketCAN), interface can0, 1 Mbit/s,
    120 ohm termination switch. Power: DC 48 V (MeanWell LRS-600-48, 48 V 12.5 A, recommended) through an XT30 2+2 power
    separation board. Wrist camera of the camera boot: Intel RealSense D405 (USB 3.0, 640x360 colour and depth at 30 Hz, no
    IMU) on the community D405 mount (Seeed''s grasping guide). No lidar or IMU. The arm boot itself starts no camera driver.'
camera_boot:
  authority: approved_community
  summary: 'Seeed''s B601-RS grasping guide runs the Intel RealSense D405 as the wrist camera with the realsense-ros wrapper
    (`ros2 launch realsense2_camera rs_launch.py align_depth.enable:=true depth_module.depth_profile:=640x360x30
    depth_module.color_profile:=640x360x30`) beside the arm boot: /camera/camera (realsense2_camera_node) with its colour and
    aligned-depth streams (640x360 at 30 Hz, global names under /camera/camera, not under /rebotarm), and the mount transform
    of the community rebot_visual_grasp package (/camera_mount_tf, from its wrist_extrinsics_d405.yaml). It is approved, not
    manufacturer-provided; its rows carry camera_boot: true and are served.'
  commands:
  - ros2 launch realsense2_camera rs_launch.py align_depth.enable:=true depth_module.depth_profile:=640x360x30 depth_module.color_profile:=640x360x30   # approved community camera boot (realsense-ros 4.58.4)
  - ros2 run tf2_ros static_transform_publisher --x -0.10873 --y 0.00908 --z 0.10761 --roll 0.003575 --pitch 0.537753 --yaw -0.006233 --frame-id gripper_end --child-frame-id camera_link --ros-args -r __node:=camera_mount_tf   # the wrist mount of rebot_visual_grasp (its xacro's three fixed joints composed, import.md "Wrist camera"); the package publishes it through its own robot_description, which the arm boot's replaces
  files:
  - source: realsense-ros
    path: realsense2_camera/launch/rs_launch.py
    role: approved community camera boot (the guide's launch with align_depth.enable and the 640x360x30 colour and depth profiles)
  - source: wiki-grasping-demo
    path: sites/en/docs/Robotics/Robot_Kits/reBot_Arm/B601_RS/reBot_Arm_B601_RS_Grasping_Demo.md
    role: the guide's D405 camera command (L886-L898) and topics (L952-L962)
  - source: rebot_visual_grasp
    path: config/wrist_extrinsics_d405.yaml
    role: the wrist D405's mount on gripper_end (the camera boot's mount transform)
model:
  urdf: ReBot_Arm_RS.urdf
  urdf_sha256: 978568c1b73310ec134b8f2285295f46d0c32c904d397bd097e3bcc81507b77b
  urdf_source:
    source: reBotArmController_ROS2
    path: src/rebotarm_bringup/description/RS/urdf/ReBot_Arm_RS.urdf
  mjcf: model.xml
  mjcf_official: false
  robot_description:
    published_as: /robot_state_publisher parameter robot_description and the transient-local topic /robot_description
    content:
      file: boot/robot_description.urdf
      generated: 'stdout of `python3 <share>/launch/rviz_urdf_compat.py <share>/description/RS/urdf/ReBot_Arm_RS.urdf` (bringup.launch.py
        L59-L75 with model:=rs), unstripped by the launch Command substitution, so it ends with a newline. Generated here
        by running the pinned script (read in full: it only parses the URDF with ElementTree and prints it) on the pinned
        URDF with Python 3.12 (Jazzy''s), python3 -I, from a directory outside the clone; Python 3.11, 3.13 and 3.14 give
        the same bytes. No installation-dependent content.'
      sha256: b45bd97e4b1ebd94283b59f2034e3451a5946db75a2b8d1a871cbaaf600e6f64
    differences_from_model:
    - 'compat split (rviz_urdf_compat.py L57-L87): every link with several visuals keeps only its first; each further visual
      moves, unchanged, into a new child link <link>__rviz_visual_<mesh stem> joined by a fixed joint <child>__fixed_joint
      at xyz 0 0 0, rpy 0 0 0, with no inertial or collision. 15 such links: link2 (cnc2, pla2_black, pla2_green), link3
      (motor_4, pla3_black_without_seeed_badge, pla3_seeed_badge_with_counters, pla3_seeed_wordmark_backing, pla3_green),
      link4 (cnc4), link5 (cnc5, pla5_green), gripper_end (cnc7, motor_7), gripper_left (cnc_left), gripper_right (cnc_right).
      Masses, inertias, collisions and every geometry pose are unchanged; the model keeps the official URDF''s links with
      all their visuals'
    - 'materials (rviz_urdf_compat.py L27-L33): rs_base_black, rs_motor_black and rs_pla_black become rgba 0.140 0.160 0.150
      1 (official 0.055 0.065 0.060 1, 0.045 0.052 0.049 1, 0.090 0.106 0.102 1), a presentation override for RViz; the
      model keeps the official colours'
    - 'serialisation: ElementTree drops the XML declaration and every comment (the exporter banner, the palette note and
      the commented-out whole-link visuals of link2-link5, gripper_end, gripper_left and gripper_right); attribute values
      are unchanged'
    - 'names, axes, origins, limits, zero offsets: identical to the official URDF (revolute joint1-joint6, prismatic gripper_joint1
      and gripper_joint2, fixed j_gripper_end; root base_link)'
    - 'arm command frame: the motors'' positions are the URDF joint angles with no sign, offset or ratio (joint_states publishes
      the SDK motor positions as joint1-joint6, and the SDK pads the same values into its Pinocchio model of this URDF for
      IK and gravity); the motor zero is the set_zero position, i.e. the URDF zero. The driver does not clamp arm targets
      to the URDF limits (motorbridge clamps MIT targets to +-4 pi rad); joint2 and joint3 have their URDF lower limit 0.0
      at the zero (safe_home) pose'
    - 'gripper: one motor (RS-00, id 7) commanded in motor rad, close 0.0 to open 5.0 (rebotarm_hardware.yaml rs position_limits);
      /rebotarm/joint_states reports it on the URDF''s two prismatic finger joints as ratio = clamp(motor / 5.0, 0, 1),
      gripper_joint1 = 0.05 * ratio m and gripper_joint2 = 0.0715 * ratio m (the URDF upper limits), so the two fingers
      are reported asymmetric (0.0100 and 0.0143 m per motor rad), while the rack-and-pinion moves both equally; Seeed''s
      fake driver and MoveIt pick-place config use 0.045 m per finger at 5.0 rad instead. Positive finger travel opens (each
      finger axis points away from the jaw centre)'
    - 'wrist camera: the model adds the D405''s colour optical frame as a camera named camera_color_optical_frame on gripper_end
      (sensors.cameras); robot_description (the arm boot''s) has no camera link, the camera frames reach /tf_static from the
      camera boot (tf)'
    - 'velocity and effort limits: URDF effort 36 N m (joint1-joint3) and 14 N m (joint4-joint6) equal motorbridge''s RS-06
      and RS-00 MIT torque ranges; URDF velocity 50 rad/s (joint1-joint3) equals the RS-06 MIT velocity range but 40 rad/s
      (joint4-joint6) exceeds the RS-00''s 33 rad/s; finger joints effort 500, velocity 10 (URDF values, no motor counterpart)'
nodes:
- name: /reBotArmController
  package: rebotarmcontroller
  executable: reBotArmController
  source:
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarm_bringup/launch/bringup.launch.py#L95-L117
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/rebotarm_controller.py#L18
  notes: 'rclpy node (MultiThreadedExecutor, 4 threads) wrapping the SDK: hardware manager, joint/status publishers, services,
    actions and per-motor raw command subscriptions. on_exit shuts the launch down.'
- name: /robot_state_publisher
  package: robot_state_publisher
  executable: robot_state_publisher
  source:
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarm_bringup/launch/bringup.launch.py#L118-L125
  - https://github.com/ros/robot_state_publisher/blob/d1b994d2d2eb19e4d2886be57211114134f25b50/src/robot_state_publisher.cpp#L78
  notes: Remaps /joint_states to /rebotarm/joint_states (arm_namespace).
- name: /camera/camera
  camera_boot: true
  package: realsense2_camera
  executable: realsense2_camera_node
  source:
  - https://github.com/IntelRealSense/realsense-ros/blob/9a11121700cb4780e273e34141f6402fe184321d/realsense2_camera/launch/rs_launch.py#L155-L162
  - https://github.com/Seeed-Studio/wiki-documents/blob/2d9c3d1225f1ab98b79e1382b72ca9e2148bb23a/sites/en/docs/Robotics/Robot_Kits/reBot_Arm/B601_RS/reBot_Arm_B601_RS_Grasping_Demo.md#L886-L898
  notes: 'Approved community camera boot (realsense-ros 4.58.4), not manufacturer-provided: the node of rs_launch.py (camera_name
    camera in namespace camera) for the D405, with the guide''s arguments. Its colour and aligned-depth streams are required.
    Its remaining launch and dynamic parameters (exposure, gain, filters, point cloud, IMU) and its metadata, extrinsics and
    device services have no served counterpart: the optional rows below.'
- name: /camera_mount_tf
  camera_boot: true
  package: tf2_ros
  executable: static_transform_publisher
  source:
  - https://github.com/xiehuangbao888/rebot_visual_grasp/blob/dd28d65598deec767cf95fa45521d69b38155833/config/wrist_extrinsics_d405.yaml#L6-L16
  - https://github.com/xiehuangbao888/rebot_visual_grasp/blob/dd28d65598deec767cf95fa45521d69b38155833/description/urdf/rebotarm_rs_with_d405.urdf.xacro#L17-L46
  notes: 'Approved community camera boot: the mount of the community rebot_visual_grasp package (gripper_end -> camera_mount_link
    -> camera_bottom_screw_frame -> camera_link, published there by robot_state_publisher from the package''s xacro) as
    one static transform gripper_end -> camera_link, composed from the three fixed joints (import.md, "Wrist camera"), run as
    the stock tf2_ros static_transform_publisher with the node name camera_mount_tf; the arm boot''s robot_description stays
    the boot''s.'
- name: /rviz2
  package: rviz2
  executable: rviz2
  optional: true
  source: https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarm_bringup/launch/bringup.launch.py#L126-L133
  notes: Started only with use_rviz:=true (default false); config rviz/rebotarm.rviz shows the RobotModel from /robot_description
    and has no publishing tools.
topics:
- name: /rebotarm/joint_states
  type: sensor_msgs/msg/JointState
  direction: out
  nodes:
  - /reBotArmController
  rate: 100
  rate_basis: source
  rate_note: rclpy timer of period 1/joint_state_rate; joint_state_rate 100.0 (bringup.launch.py default, the wiki command
    passes none)
  frame_id: ''
  qos:
    reliability: best_effort
    durability: volatile
    depth: 5
  internal_subscribers:
  - /robot_state_publisher
  source:
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_publishers.py#L25-L30
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_publishers.py#L59-L64
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_publishers.py#L67-L125
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarm_bringup/launch/bringup.launch.py#L87
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/rebotarm_controller.py#L22
  - https://github.com/ros2/rclpy/blob/bd637294dd02b1c128422395c059fa06df8387a3/rclpy/rclpy/qos.py#L453-L454
  - https://github.com/ros2/rmw/blob/8cb94a87cf3f4049abe2d563af893517bf336930/rmw/include/rmw/qos_profiles.h#L25-L36
  notes: 'name [joint1..joint6, gripper_joint1, gripper_joint2]; arm: SDK motor position (rad), velocity (rad/s) and torque
    (N m) from the latest RobStride status frames; gripper: ratio = clamp(motor rad / 5.0, 0, 1), positions [0.05 * ratio,
    0.0715 * ratio] m, velocities (ratio(motor + motor velocity) - ratio(motor)) times the same limits (m/s), effort the
    gripper motor torque (N m) on both. header.stamp is the node clock at publication; frame_id is never set. RobStride
    motors report only in reply to commands (motorbridge request_feedback is a no-op), so while the motors are disabled
    the values repeat the last frames.'
- name: /rebotarm/joints/joint1/state
  type: rebotarm_msgs/msg/JointMotorState
  direction: out
  nodes:
  - /reBotArmController
  rate: 100
  rate_basis: source
  rate_note: published in the same 100 Hz callback
  frame_id: ''
  qos:
    reliability: best_effort
    durability: volatile
    depth: 5
  source:
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_publishers.py#L31-L39
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_publishers.py#L76-L85
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarm_msgs/msg/JointMotorState.msg#L1-L6
