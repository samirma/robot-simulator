- name: /robot_description
  type: std_msgs/msg/String
  direction: out
  nodes:
  - /robot_state_publisher
  rate: non_periodic
  latched: true
  qos:
    reliability: reliable
    durability: transient_local
    depth: 1
  source:
  - https://github.com/ros/robot_state_publisher/blob/d1b994d2d2eb19e4d2886be57211114134f25b50/src/robot_state_publisher.cpp#L132-L135
  - https://github.com/ros/robot_state_publisher/blob/d1b994d2d2eb19e4d2886be57211114134f25b50/src/robot_state_publisher.cpp#L209-L213
  notes: The boot robot_description (model.robot_description), published once.
- name: /tf
  type: tf2_msgs/msg/TFMessage
  direction: out
  nodes:
  - /robot_state_publisher
  rate: 18.2
  rate_basis: estimate
  rate_note: 'robot_state_publisher republishes the moving joints on a /rebotarm/joint_states message only when its stamp
    is at least 1/publish_frequency = 50 ms after the last published one. joint_states comes every 10 ms stamped by the
    node clock after the motor read, so the 50 ms threshold falls exactly on the 5th message: an interval is 50 ms when
    that message''s latency is at least the first one''s, else 60 ms. With independent latencies that averages 55 ms, 18.2
    Hz (between 16.7 and 20 Hz); estimate, not measured'
  qos:
    reliability: reliable
    durability: volatile
    depth: 100
  source:
  - https://github.com/ros/robot_state_publisher/blob/d1b994d2d2eb19e4d2886be57211114134f25b50/src/robot_state_publisher.cpp#L336-L340
  - https://github.com/ros/robot_state_publisher/blob/d1b994d2d2eb19e4d2886be57211114134f25b50/src/robot_state_publisher.cpp#L118
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_publishers.py#L75
  - https://github.com/ros2/geometry2/blob/f702874b1c8535d6a038230ab2cda0ba5d521ebd/tf2_ros/include/tf2_ros/qos.hpp#L46-L51
  notes: One TFMessage with the eight moving transforms (see tf), stamped with the joint_states stamp.
- name: /tf_static
  type: tf2_msgs/msg/TFMessage
  direction: out
  nodes:
  - /robot_state_publisher
  rate: non_periodic
  latched: true
  qos:
    reliability: reliable
    durability: transient_local
    depth: 1
  source:
  - https://github.com/ros/robot_state_publisher/blob/d1b994d2d2eb19e4d2886be57211114134f25b50/src/robot_state_publisher.cpp#L279-L298
  - https://github.com/ros2/geometry2/blob/f702874b1c8535d6a038230ab2cda0ba5d521ebd/tf2_ros/include/tf2_ros/qos.hpp#L63-L71
  notes: The 16 fixed transforms (link6 -> gripper_end and the 15 compat-split visual links), published once.
services:
- name: /rebotarm/enable
  type: std_srvs/srv/Trigger
  node: /reBotArmController
  source:
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_services.py#L20
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_services.py#L60-L61
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/hardware_manager.py#L264-L281
  notes: When the hold loop is stopped (after disable, set_zero or a raw command), puts arm and gripper in MIT mode, enables
    them and restarts the 500 Hz hold loop on the current position; otherwise only sets IDLE. Rejected during gravity compensation,
    safe home or a trajectory.
- name: /rebotarm/disable
  type: std_srvs/srv/Trigger
  node: /reBotArmController
  source:
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_services.py#L21
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_services.py#L63-L68
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/hardware_manager.py#L283-L293
  notes: 'Stops gravity compensation and the hold loop, then disables every motor (torque off: the arm is no longer held
    against gravity).'
- name: /rebotarm/safe_home
  type: std_srvs/srv/Trigger
  node: /reBotArmController
  source:
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_services.py#L22
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_services.py#L70-L71
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/hardware_manager.py#L295-L328
  - https://github.com/Seeed-Projects/reBotArm_control_py/blob/6415d43130d1e143c70dc106096a857ac5556f81/reBotArm_control_py/controllers/rebotarm_endpose_controller.py#L175-L227
  notes: Closes the gripper (target 0.0, up to 3 s), then drives every arm joint to 0.0 along a minimum-jerk profile of
    duration 2 * max|q| / 0.5 s sent at 50 Hz, and waits up to 3 s for max|q| < 0.01 rad; state SAFE_HOMING meanwhile, IDLE
    after. Arm stays enabled.
- name: /rebotarm/gravity_compensation/start
  type: std_srvs/srv/Trigger
  node: /reBotArmController
  source:
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_services.py#L23-L28
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/hardware_manager.py#L453-L486
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarm_bringup/config/rebotarm_hardware.yaml#L56-L58
  - https://github.com/Seeed-Projects/reBotArm_control_py/blob/6415d43130d1e143c70dc106096a857ac5556f81/config/rebotarm_rs.yaml#L136-L141
  notes: 'Arm MIT with kp 2.0, kd 1.0 (rs overrides) and Pinocchio gravity torque scaled by tau_scale [1.0, 0.98, 0.98,
    1.0, 1.0, 1.0] at 500 Hz; the gripper holds its position. State GRAVITY_COMP: arm and gripper goals and raw commands
    are rejected.'
- name: /rebotarm/gravity_compensation/stop
  type: std_srvs/srv/Trigger
  node: /reBotArmController
  source:
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_services.py#L29-L34
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/hardware_manager.py#L488-L502
  notes: Ends gravity compensation and resumes the MIT hold loop at the last compensated position.
- name: /rebotarm/set_zero
  type: rebotarm_msgs/srv/SetZero
  node: /reBotArmController
  source:
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_services.py#L35
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_services.py#L87-L93
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/hardware_manager.py#L330-L343
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarm_msgs/srv/SetZero.srv#L1-L4
  - https://github.com/motorbridge/motorbridge/blob/c652ce420e7da1008fa1864cc7f47d7d7c57fdb6/motor_vendors/robstride/src/motor.rs#L398-L412
  notes: 'Disables every motor and stores the current position as zero on joint_name (empty: all seven motors, gripper included);
    leaves the arm disabled.'
- name: /rebotarm/move_to_pose_ik
  type: rebotarm_msgs/srv/MoveToPoseIK
  node: /reBotArmController
  source:
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_services.py#L36
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_services.py#L95-L109
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/hardware_manager.py#L432-L437
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarm_msgs/srv/MoveToPoseIK.srv#L1-L5
  notes: Solves IK for target_pose (gripper_end in base_link, quaternion read as roll/pitch/yaw) from the current joints
    and, on success, steps the hold target to q_solution at once (no trajectory); returns q_solution.
- name: /rebotarm/gripper/set
  type: rebotarm_msgs/srv/SetGripper
  node: /reBotArmController
  source:
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_services.py#L37
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_services.py#L111-L123
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/hardware_manager.py#L583-L590
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarm_msgs/srv/SetGripper.srv#L1-L5
  notes: 'position: gripper motor rad within [0.0, 5.0]; max_effort ignored. Waits up to 3 s for |position - target| < 0.12
    rad; success = reached, reached_position = motor rad.'
- name: /rebotarm/gripper/open
  type: rebotarm_msgs/srv/GripperCommand
  node: /reBotArmController
  source:
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_services.py#L38
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_services.py#L125-L128
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_services.py#L135-L154
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarm_msgs/srv/GripperCommand.srv#L1-L6
  notes: position 0.0 means the configured open position 5.0 motor rad, else that position; timeout <= 0 means 3 s.
- name: /rebotarm/gripper/close
  type: rebotarm_msgs/srv/GripperCommand
  node: /reBotArmController
  source:
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_services.py#L39
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_services.py#L130-L133
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_services.py#L135-L154
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarm_msgs/srv/GripperCommand.srv#L1-L6
  notes: position 0.0 means the configured close position 0.0 motor rad, else that position; timeout <= 0 means 3 s.
actions:
- name: /rebotarm/move_to_pose
  type: rebotarm_msgs/action/MoveToPose
  node: /reBotArmController
  source:
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_actions.py#L18-L26
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_actions.py#L77-L132
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarm_msgs/action/MoveToPose.action#L1-L10
  - https://github.com/Seeed-Projects/reBotArm_control_py/blob/6415d43130d1e143c70dc106096a857ac5556f81/reBotArm_control_py/controllers/rebotarm_endpose_controller.py#L259-L324
  notes: 'Cartesian goal: target_pose of gripper_end in base_link, duration s (<= 0: max(1, distance / 0.1)). IK, SE(3)
    geodesic minimum-jerk plan at 0.01 s and CLIK tracking; the joint points are streamed to the hold target over duration.
    Succeeds when the stream ends (deadline duration + 2 s); no feedback is published.'
- name: /rebotarm/follow_joint_trajectory
  type: control_msgs/action/FollowJointTrajectory
  node: /reBotArmController
  source:
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_actions.py#L27-L35
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_actions.py#L134-L242
  notes: Arm joint trajectory (motions.arm).
- name: /rebotarm/gripper/command
  type: control_msgs/action/GripperCommand
  node: /reBotArmController
  source:
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_actions.py#L36-L44
  - https://github.com/Seeed-Projects/reBotArmController_ROS2/blob/7506dc0fc5c2a7787dcb974d89d13f9f49d16d61/src/rebotarmcontroller/rebotarmcontroller/ros_actions.py#L244-L291
  notes: Gripper motor position goal (motions.gripper).
