# AiNex action groups that can be played without the vendor's .d6a files: ESTIMATES, not
# vendor data (added 2026-10-03). Referenced by ros.yml motions[action_group]; format in
# robots_specs/SCHEMA.md, "Estimated action groups".
#
# Hiwonder ships its action groups (left_shot, greet, ...) as .d6a files on the robot image
# only; none is in any pinned source (ros.yml boot.data_files), so no vendor group can be
# played from the record. The groups below are defined here so that the action-group motion
# has playable, documented groups. They are not Hiwonder motions:
#
# * `wave`, `raise_hands` and `nod`: arm and head motions with this record's own names.
# * stand-ins under the vendor's own names (amended 2026-10-03): one group for every name the
#   pinned vendor code plays (each group's `vendor_source` is the line that names it), so a
#   client that plays a vendor name gets a visible motion resembling what the name says. They
#   are invented: the vendor files' content is unknown. The pinned code also names `three` and
#   `four`, only in commented-out lines (hand_gesture_control_node.py#L66-L68); they have no
#   group. The documentation's action-editing lesson (chapter 5.1.3) also opens a forward
#   walking group and one the reader makes; no pinned source plays them, so they have none.
schema_version: 1
robot_id: ainex
basis: estimate
reason: >-
  No vendor action group is in a pinned source. These groups are invented motions. `wave`,
  `raise_hands` and `nod` move only the arms and head, both feet left at the init pose. The
  stand-ins under the vendor's names (amended 2026-10-03) also move the legs, conservatively:
  their leg offsets were computed by inverse kinematics on model.xml for a pelvis shifted,
  raised, lowered, pitched or yawed over planted flat soles, or for one foot lifted at most
  4.5 cm with the pelvis first moved over the other foot; checked in a MuJoCo simulation of
  model.xml on a flat floor to leave the robot standing where it was (2026-10-03). Every group
  ends at the init pose, legs and head included, because the controller returns only the arms
  and grippers after a group (ainex_controller.py#L262-L318). Each joint target stays inside
  the URDF limit (+-2.09 rad) and inside the servo pulse range 0-1000 under `servos`,
  servo_controller.yaml's init/direction mapping (checked 2026-10-03 against
  Hiwonder/ainex@e8fe2a8; it allows only -0.52..2.09 rad for l_sho_pitch, -2.09..0.52 for
  r_sho_pitch, -1.0..2.09 for l_knee and -2.09..1.0 for r_knee).
player:
  # How the vendor's controller plays a group: /app/set_action <name> (ros.yml motions[action_group]).
  path: /home/ubuntu/software/ainex_controller/ActionGroups/<name>.d6a
  file_format: >-
    SQLite database with table ActionGroup, one row per frame in order: column 0 the frame
    index, column 1 the frame time in ms, columns 2.. the pulse (0-1000) of servo id 1, 2, ...;
    each frame is sent with its time as the move duration, then the player sleeps that time.
  source: https://github.com/Hiwonder/ainex/blob/e8fe2a816797cf83054135160df5a82ec3596a69/src/ainex_driver/ainex_kinematics/src/ainex_kinematics/motion_manager.py#L63-L99
frames_are: >-
  Each frame is {time_ms, offsets_rad}: offsets (rad) added to the recorded init pose,
  ros.yml parameter /ainex_controller/init_pose; a joint a frame does not name is at its
  init-pose angle. A frame converts to servo pulses as
  pulse = clamp(0, 1000, round(init + angle * sign * 1000 / (240 deg in rad))), with each
  joint's servo id, init and sign (-1 when the servo's min > max) from servo_controller.yaml.
pulse_source:
  - https://github.com/Hiwonder/ainex/blob/e8fe2a816797cf83054135160df5a82ec3596a69/src/ainex_driver/ainex_kinematics/config/servo_controller.yaml
  - https://github.com/Hiwonder/ainex/blob/e8fe2a816797cf83054135160df5a82ec3596a69/src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L24
# servo_controller.yaml's mapping (added 2026-10-03), joint: [servo id, init pulse, sign]
servos:
  l_ank_roll: [1, 500, 1]
  r_ank_roll: [2, 500, 1]
  l_ank_pitch: [3, 500, 1]
  r_ank_pitch: [4, 500, 1]
  l_knee: [5, 240, 1]
  r_knee: [6, 760, 1]
  l_hip_pitch: [7, 500, 1]
  r_hip_pitch: [8, 500, 1]
  l_hip_roll: [9, 500, 1]
  r_hip_roll: [10, 500, 1]
  l_hip_yaw: [11, 500, 1]
  r_hip_yaw: [12, 500, 1]
  l_sho_pitch: [13, 875, -1]
  r_sho_pitch: [14, 125, -1]
  l_sho_roll: [15, 500, 1]
  r_sho_roll: [16, 500, 1]
  l_el_pitch: [17, 500, 1]
  r_el_pitch: [18, 500, 1]
  l_el_yaw: [19, 500, 1]
  r_el_yaw: [20, 500, 1]
  l_gripper: [21, 500, 1]
  r_gripper: [22, 500, 1]
  head_pan: [23, 500, 1]
  head_tilt: [24, 500, 1]
smoke_example: wave
groups:
  wave:
    description: right arm raised forward and out, elbow waved three times, then back to the init pose
    frames:
      - {time_ms: 600, offsets_rad: {r_sho_pitch: -1.2, r_sho_roll: -1.3, r_el_yaw: 0.0}}
      - {time_ms: 400, offsets_rad: {r_sho_pitch: -1.2, r_sho_roll: -1.3, r_el_pitch: 0.6}}
      - {time_ms: 400, offsets_rad: {r_sho_pitch: -1.2, r_sho_roll: -1.3, r_el_pitch: -0.2}}
      - {time_ms: 400, offsets_rad: {r_sho_pitch: -1.2, r_sho_roll: -1.3, r_el_pitch: 0.6}}
      - {time_ms: 400, offsets_rad: {r_sho_pitch: -1.2, r_sho_roll: -1.3, r_el_pitch: -0.2}}
      - {time_ms: 400, offsets_rad: {r_sho_pitch: -1.2, r_sho_roll: -1.3, r_el_pitch: 0.6}}
      - {time_ms: 600, offsets_rad: {}}
  raise_hands:
    description: both arms raised sideways overhead and lowered again
    frames:
      - {time_ms: 800, offsets_rad: {r_sho_roll: -1.4, l_sho_roll: 1.4}}
      - {time_ms: 800, offsets_rad: {r_sho_roll: -2.4, l_sho_roll: 2.4}}
      - {time_ms: 800, offsets_rad: {r_sho_roll: -1.4, l_sho_roll: 1.4}}
      - {time_ms: 800, offsets_rad: {}}
  nod:
    description: head tilted down and up twice
    frames:
      - {time_ms: 400, offsets_rad: {head_tilt: -0.4}}
      - {time_ms: 400, offsets_rad: {head_tilt: 0.1}}
      - {time_ms: 400, offsets_rad: {head_tilt: -0.4}}
      - {time_ms: 400, offsets_rad: {}}
