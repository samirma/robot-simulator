      - https://github.com/Hiwonder/ainex/blob/e8fe2a816797cf83054135160df5a82ec3596a69/src/ainex_example/scripts/visual_patrol/visual_patrol_node.py#L56
    frames:
      - {time_ms: 800, offsets_rad: &stand_0 {l_hip_pitch: 0.158, l_knee: -0.335, l_ank_pitch: -0.176, r_hip_pitch: -0.158, r_knee: 0.335, r_ank_pitch: 0.176}}
      - {time_ms: 1000, offsets_rad: *stand_0}
      - {time_ms: 800, offsets_rad: {}}
