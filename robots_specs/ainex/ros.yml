    description: Restrict detection to the configured ROI.
    source: https://github.com/Hiwonder/ainex/blob/e8fe2a816797cf83054135160df5a82ec3596a69/src/ainex_example/scripts/color_detection/color_detection_node.launch
  - name: /face_detect/enable_display
