stop_command: >-
  Official way (docs 5.2.4 Walking Control, GaitManager.stop()): call service /walking/command
  with command "stop". ainex_controller then calls walking_module.stop() and blocks until the
  current step cycle ends and /walking/is_walking goes False (ainex_controller.py#L356-L359).
  "disable" also stops and additionally blocks gait output until "enable"/"start".
  /app/set_running false and a stick release in joystick_control both end in this same "stop".
  Nuance: start/stop/enable/disable are ignored (the service still returns result=true) unless
  control is enabled (init_pose_finish true, ainex_controller.py#L350). "enable_control" sets it
  true and "disable_control" sets it false; the app sends disable_control on entering fall_rise
  (app_node.py#L339) and enable_control on control/idle (app_node.py#L292, #L308), and
  /app/set_action clears it while an action group plays. So after disable_control, send
  "enable_control" before "stop" or the stop is a no-op. To stop the whole stack, the vendor
  instructs `sudo systemctl stop start_app_node.service` (bringup.launch header, docs).
