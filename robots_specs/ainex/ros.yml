    description: Enable gyro bias estimation.
    source: https://github.com/Hiwonder/ainex/blob/e8fe2a816797cf83054135160df5a82ec3596a69/src/ainex_peripherals/launch/imu.launch#L35
  - name: /imu_filter/do_adaptive_gain
    type: bool
    value: true
    description: Enable adaptive gain.
    source: https://github.com/Hiwonder/ainex/blob/e8fe2a816797cf83054135160df5a82ec3596a69/src/ainex_peripherals/launch/imu.launch#L36
  # app / vision
  - name: /color_track
    type: dict
    value: "{pid1_p: 0.13, pid1_i: 0.0, pid1_d: 0.003, pid2_p: 0.13, pid2_i: 0.0, pid2_d: 0.003}"
    description: Head-tracking PID gains (rl, ud) read by app; loaded at root by start.launch and again as /app/color_track.
    source: https://github.com/Hiwonder/ainex/blob/e8fe2a816797cf83054135160df5a82ec3596a69/src/ainex_app/launch/start.launch#L4
  - name: /app/color_track
    type: dict
