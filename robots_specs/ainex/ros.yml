    source: https://github.com/Hiwonder/ainex/blob/e8fe2a816797cf83054135160df5a82ec3596a69/src/ainex_peripherals/launch/joystick_control.launch#L6
  # IMU pipeline
  - name: /imu_calib/calib_file
    type: string
    value: $(find ainex_calibration)/config/imu_calib.yaml
