      - ROSMASTER-X3Plus_ROS1_code.zip!/software.zip!/software/library_ws/src/orbbec-ros-sdk/src/ob_camera_node.cpp#L694-L725
      - yahboomcar_X3plus.urdf joint astra_joint
      notes: optical frame at camera_link (URDF astra_joint); the colour-to-camera_link offset is the unit's factory
        extrinsic, estimated as zero
    hardware: Orbbec Astra Pro Plus IR sensor (native FoV 58.4 x 45.5 deg per Orbbec; the driver labels it with
      the colour optical frame)
  lidars:
  - id: ydlidar_4ros
    topic: /scan
    frame_id: laser
    model: YDLIDAR 4ROS (ToF)
    angle_min: -1.48353
    angle_max: 1.48353
    samples: 945
    range_min: 0.01
    range_max: 50.0
    scan_rate: 10
    invalid_range: inf
    mount:
      parent: laser_link
      xyz:
      - 0.0
      - 0.0
      - 0.0
      rpy:
      - 0.0
      - 0.0
      - 6.28
      basis: source
      source: ROSMASTER-X3Plus_ROS1_code.zip!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_nav/launch/laser_astrapro_bringup.launch#L10-L11
    basis: source
    source:
    - ROSMASTER-X3Plus_ROS1_code.zip!/software.zip!/software/library_ws/src/ydlidar_ros_driver/launch/TG.launch#L17-L36
    - ROSMASTER-X3Plus_ROS1_code.zip!/software.zip!/software/library_ws/src/ydlidar_ros_driver/src/ydlidar_ros_driver.cpp#L185-L202
    notes: angle limits +/-85 deg and ranges from TG.launch (range_max 50 m is the launch setting; Yahboom states
      a 30 m scanning radius). samples = 170 deg / (360 deg / (sample_rate 20 kHz / 10 Hz)) + 1 = 945 is DERIVED
      from the launch settings assuming the SDK's fixed resolution; the SDK source (YDLidar-SDK) is not in the pinned
      archive.
  imus:
  - id: board_imu
    topic: /imu/data_raw
    frame_id: imu_link
    rate: 20
    mount:
      parent: base_link
      xyz:
      - 0.001
      - 0.017
      - 0.0322
      rpy:
      - 0.0
      - 3.1415
      - 1.5707
      basis: source
      source: yahboomcar_X3plus.urdf joint base_imu
    source: ROSMASTER-X3Plus_ROS1_code.zip!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L64-L101
    notes: ICM20948 or MPU9250 on the expansion board; fused copy on /imu/data
tolerances:
- figure: 'drive: translation displacement (forward/back/sideways) over a commanded run'
  applies_to: motions[drive], judged from /odom or /odom_raw
  tolerance:
    relative: 0.15
  basis: estimate
  notes: no vendor accuracy figure; covers mecanum roller slip and the odometry scale factors 1.1 (x) / 0.95 (y)
    that odometry_publisher applies to /vel_raw
- figure: 'drive: yaw change over a commanded turn'
  applies_to: motions[drive], judged from /odom
  tolerance:
    relative: 0.15
  basis: estimate
  notes: no vendor figure
- figure: 'drive: residual motion after the stop command'
  applies_to: motions[drive]
  tolerance:
    absolute: 0.02
    unit: m
  basis: estimate
  notes: distance travelled after the zero Twist; the firmware brakes on an all-zero command
- figure: arm joint reached position
  applies_to: motions[arm], each arm_joint1-5
  tolerance:
    absolute: 0.035
    unit: rad
  basis: estimate
  notes: bus-servo position loop under gravity load; servo command resolution is 180 deg / 2200 counts (Rosmaster_Lib
    __arm_convert_value); no vendor accuracy figure
- figure: gripper reached position (free, no object)
  applies_to: motions[gripper], grip_joint
  tolerance:
    absolute: 0.05
    unit: rad
  basis: estimate
- figure: camera and lidar mount poses
  applies_to: sensors.cameras[*].mount, sensors.lidars[*].mount
  tolerance:
    absolute: 0.005
    unit: m
  basis: estimate
  notes: URDF poses are exact; the colour-sensor offset inside the Astra is unknown (factory extrinsic)
- figure: camera horizontal field of view
  applies_to: sensors.cameras[*].hfov_deg
  tolerance:
    absolute: 5.0
    unit: deg
  basis: estimate
  notes: intrinsics are an estimate (see sensors.cameras[*].intrinsics)
notes: 'Excluded as ROS infrastructure: rosbridge/rosapi, /rosout, /rosout_agg, master parameters, and every node''s
  get_loggers / set_logger_level services. Topic rates are derived from the pinned source (rate_basis source) and
  have not been measured on a real ROSMASTER X3 PLUS. Frame ids on the wire keep any leading slash the launch files
  give them (/laser_link, /laser, /camera_link, ...); robot_localization strips its own.'
