  direction: in
  nodes:
  - /driver_node
  rate: non_periodic
  notes: light-bar effect 0-6 (0 off, 1 running water, 2 marquee, 3 breathing, 4 gradient, 5 starlight, 6 battery)
  source: ROSMASTER-X3Plus_ROS1_code.zip!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L38
- name: /Buzzer
