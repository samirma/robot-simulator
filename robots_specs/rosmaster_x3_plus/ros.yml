# ROSMASTER X3 PLUS — official ROS 1 interface.
# Yahboom ships no ROS source on GitHub for this robot: github.com/YahboomTechnology/ROSMASTERX3-PLUS
# (main @ 9732c62247dfb57a899aea01e4fe72ed434bac6d) holds only PDF tutorials and points to the official
# Google Drive annex, whose 4.X3PLUS_Code folder holds ROSMASTER-X3Plus_ROS1_code.zip (Drive id
# 1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU, 6343438429 bytes, retrieved 2026-09-27). Source references below use
# <zip url>!/<inner zip>!/<path>#Lnn. Inner members: yahboomcar_ws.zip (CRC32 8169fcda, mtime 2025-03-29,
# SHA-256 13d752e04cba3e34116912c3903bbe194e5ca5185c304036fb0ddedb59937162) and software.zip
# (CRC32 3abdab11, mtime 2025-03-29; ydlidar_ros_driver and orbbec-ros-sdk under library_ws/src).
# The workspace was built against /opt/ros/noetic (build/CMakeCache.txt), matching the Noetic Docker
# images for Pi 5 / Jetson Orin; the Jetson Nano image and the repo README use ROS 1 Melodic (same packages).
# Yahboom's X3 PLUS docs offer no ROS 2 image. Names exclude ROS runtime topics/services (/rosout, get_loggers, set_logger_level).
# Environment: ROBOT_TYPE=X3plus (every launch reads $(env ROBOT_TYPE)).
dialect: ros1          # ROS 1 Noetic (Melodic on the Jetson Nano image)
sources:
  - https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU
  - https://github.com/YahboomTechnology/ROSMASTERX3-PLUS/tree/9732c62247dfb57a899aea01e4fe72ed434bac6d
  - http://www.yahboom.net/study/ROSMASTER-X3-PLUS
boot_launch: roslaunch yahboomcar_nav laser_astrapro_bringup.launch   # ROBOT_TYPE=X3plus; includes ydlidar_ros_driver/TG.launch, orbbec_camera/astraproplus.launch, yahboomcar_bringup/bringup.launch (+ yahboomcar_ctrl/yahboom_joy.launch). Base only: roslaunch yahboomcar_bringup bringup.launch. At power-on the image autostarts Yahboom's non-ROS APP program (start_rosmaster_app), which must be closed first.
joints: ["arm_joint1", "arm_joint2", "arm_joint3", "arm_joint4", "arm_joint5", "grip_joint"]   # grip_joint drives mimic joints rlink_joint2/3, llink_joint1/2/3; mecanum wheels are not jointed in the URDF
topics:
  - name: /cmd_vel
    type: geometry_msgs/Twist
    direction: in
    rate_hz: event
    node: /driver_node
    description: "Chassis velocity command (linear.x, linear.y, angular.z) forwarded to the STM32 board via set_car_motion; no timeout watchdog"
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L37"
  - name: /RGBLight
    type: std_msgs/Int32
    direction: in
    rate_hz: event
    node: /driver_node
    description: "Light-bar effect 0-6 (0 off, 1 running water, 2 marquee, 3 breathing, 4 gradient, 5 starlight, 6 battery)"
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L38"
  - name: /Buzzer
    type: std_msgs/Bool
    direction: in
    rate_hz: event
    node: /driver_node
    description: Buzzer on (true) / off (false)
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L39"
  - name: /TargetAngle
    type: yahboomcar_msgs/ArmJoint
    direction: in
    rate_hz: event
    node: /driver_node
    description: "Arm servo target: single servo (id 1-6, angle deg, run_time ms) or all six via joints[] (degrees)"
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L40"
  - name: /ArmAngleUpdate
    type: yahboomcar_msgs/ArmJoint
    direction: out
    rate_hz: event
    node: /driver_node
    description: Echo of the arm target just applied (sent twice per command)
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L41"
  - name: /edition
    type: std_msgs/Float32
    direction: out
    rate_hz: 20
    node: /driver_node
    description: Expansion-board firmware version (publish loop sleeps 50 ms)
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L42"
  - name: /voltage
    type: std_msgs/Float32
    direction: out
    rate_hz: 20
    node: /driver_node
    description: Battery voltage (V)
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L43"
  - name: /joint_states
    type: sensor_msgs/JointState
    direction: out
    rate_hz: 20
    node: /driver_node
    description: "Commanded arm_joint1-5 and grip_joint positions (rad, servo deg minus 90; gripper 30-180 deg mapped to 0-90 first)"
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L44"
  - name: /vel_raw
    type: geometry_msgs/Twist
    direction: out
    rate_hz: 20
    node: /driver_node
    description: "Measured chassis velocity from the board (driver's /pub_vel remapped)"
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_bringup/launch/bringup.launch#L24"
  - name: /imu/data_raw
    type: sensor_msgs/Imu
    direction: out
    rate_hz: 20
    node: /driver_node
    description: "Raw accel + gyro in frame imu_link, no orientation (driver's /pub_imu remapped)"
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_bringup/launch/bringup.launch#L25"
  - name: /mag/mag_raw
    type: sensor_msgs/MagneticField
    direction: out
    rate_hz: 20
    node: /driver_node
    description: "Raw magnetometer in frame imu_link (driver's /pub_mag remapped)"
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_bringup/launch/bringup.launch#L26"
  - name: /driver_node/parameter_descriptions
    type: dynamic_reconfigure/ConfigDescription
    direction: out
    rate_hz: latched
    node: /driver_node
    description: dynamic_reconfigure description of PIDparam.cfg
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L49"
  - name: /driver_node/parameter_updates
    type: dynamic_reconfigure/Config
    direction: out
    rate_hz: latched
    node: /driver_node
    description: dynamic_reconfigure current values of PIDparam.cfg
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L49"
  - name: /odom_raw
    type: nav_msgs/Odometry
    direction: out
    rate_hz: 20
    node: /odometry_publisher
    description: "Dead-reckoned odom -> base_footprint from /vel_raw (scale x 1.1, y 0.95); published per /vel_raw message"
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_bringup/launch/bringup.launch#L37"
  - name: /imu/data
    type: sensor_msgs/Imu
    direction: out
    rate_hz: 20
    node: /imu_filter_madgwick
    description: "Madgwick-fused IMU with orientation (use_mag false); input /imu/data_raw. Topic names are imu_filter_madgwick defaults; the launch's /sub_imu,/pub_imu remaps match no topic"
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_bringup/launch/bringup.launch#L42"
    unverified: true
  - name: /odom
    type: nav_msgs/Odometry
    direction: out
    rate_hz: 20
    node: /ekf_localization
    description: "EKF (robot_localization, 2D) fusion of /odom_raw twist and /imu/data; odometry/filtered remapped"
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_bringup/launch/bringup.launch#L59"
  - name: /diagnostics
    type: diagnostic_msgs/DiagnosticArray
    direction: out
    rate_hz: unverified
    node: /ekf_localization
    description: "robot_localization diagnostics (print_diagnostics: true)"
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_bringup/param/robot_localization.yaml#L27"
    unverified: true
  - name: /tf
    type: tf2_msgs/TFMessage
    direction: out
    rate_hz: 20
    node: "/ekf_localization, /robot_state_publisher, /laser_link_to_laser"
    description: "odom->base_footprint (EKF), arm joints (robot_state_publisher from /joint_states), laser_link->laser (tf static_transform_publisher, 30 ms period)"
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_nav/launch/laser_astrapro_bringup.launch#L10"
    unverified: true
  - name: /tf_static
    type: tf2_msgs/TFMessage
    direction: out
    rate_hz: latched
    node: "/robot_state_publisher, /camera/camera, /camera/camera_base_link*"
    description: "Fixed URDF joints (base_footprint->base_link, imu_link, camera_link, laser_link, mono_link) and Astra camera frames"
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/software.zip!/software/library_ws/src/orbbec-ros-sdk/launch/astra_frames.launch#L11"
    unverified: true
  - name: /joy
    type: sensor_msgs/Joy
    direction: out
    rate_hz: event
    node: /joy_node
    description: USB gamepad state (autorepeat_rate 0 = on change)
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/joy/src/joy_node.cpp#L307"
  - name: /joy/set_feedback
    type: sensor_msgs/JoyFeedbackArray
    direction: in
    rate_hz: event
    node: /joy_node
    description: Gamepad force-feedback commands
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/joy/src/joy_node.cpp#L308"
  - name: /cmd_vel
    type: geometry_msgs/Twist
    direction: out
    rate_hz: event
    node: /yahboom_joy
    description: Teleop velocity from the gamepad (also sends zero Twist when joystick control is toggled off)
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_ctrl/scripts/yahboom_joy.py#L37"
  - name: /Buzzer
    type: std_msgs/Bool
    direction: out
    rate_hz: event
    node: /yahboom_joy
    description: Gamepad buzzer button
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_ctrl/scripts/yahboom_joy.py#L38"
  - name: /JoyState
    type: std_msgs/Bool
    direction: out
    rate_hz: event
    node: /yahboom_joy
    description: Whether gamepad control is active
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_ctrl/scripts/yahboom_joy.py#L39"
  - name: /RGBLight
    type: std_msgs/Int32
    direction: out
    rate_hz: event
    node: /yahboom_joy
    description: Gamepad cycles light effects
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_ctrl/scripts/yahboom_joy.py#L40"
  - name: /TargetAngle
    type: yahboomcar_msgs/ArmJoint
    direction: out
    rate_hz: event
    node: /yahboom_joy
    description: Gamepad jogs single arm servos (every 30 ms while held)
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_ctrl/scripts/yahboom_joy.py#L41"
  - name: /ArmAngleUpdate
    type: yahboomcar_msgs/ArmJoint
    direction: in
    rate_hz: event
    node: /yahboom_joy
    description: Tracks applied arm angles
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_ctrl/scripts/yahboom_joy.py#L43"
  - name: /move_base/cancel
    type: actionlib_msgs/GoalID
    direction: out
    rate_hz: event
    node: /yahboom_joy
    description: Cancels any navigation goal when gamepad control toggles
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_ctrl/scripts/yahboom_joy.py#L36"
  - name: /scan
    type: sensor_msgs/LaserScan
    direction: out
    rate_hz: 10
    node: /ydlidar_lidar_publisher
    description: "YDLIDAR 4ROS scan in frame laser, angle -85..85 deg, range 0.01-50 m (TG.launch settings)"
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/software.zip!/software/library_ws/src/ydlidar_ros_driver/src/ydlidar_ros_driver.cpp#L55"
  - name: /point_cloud
    type: sensor_msgs/PointCloud
    direction: out
    rate_hz: 10
    node: /ydlidar_lidar_publisher
    description: Same scan as a point cloud
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/software.zip!/software/library_ws/src/ydlidar_ros_driver/src/ydlidar_ros_driver.cpp#L56"
  - name: /camera/depth/image_raw
    type: sensor_msgs/Image
    direction: out
    rate_hz: 30
    node: /camera/camera
    description: Depth image 640x480 Y11
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/software.zip!/software/library_ws/src/orbbec-ros-sdk/src/ros_setup.cpp#L217"
  - name: /camera/depth/camera_info
    type: sensor_msgs/CameraInfo
    direction: out
    rate_hz: latched
    node: /camera/camera
    description: Depth intrinsics
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/software.zip!/software/library_ws/src/orbbec-ros-sdk/src/ros_setup.cpp#L224"
  - name: /camera/rgb/image_raw
    type: sensor_msgs/Image
    direction: out
    rate_hz: 30
    node: /camera/camera
    description: Color image 640x480 (MJPG source); color/image_raw remapped
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/software.zip!/software/library_ws/src/orbbec-ros-sdk/launch/astraproplus.launch#L90"
  - name: /camera/rgb/camera_info
    type: sensor_msgs/CameraInfo
    direction: out
    rate_hz: latched
    node: /camera/camera
    description: Color intrinsics; color/camera_info remapped
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/software.zip!/software/library_ws/src/orbbec-ros-sdk/launch/astraproplus.launch#L91"
  - name: /camera/ir/image_raw
    type: sensor_msgs/Image
    direction: out
    rate_hz: 30
    node: /camera/camera
    description: IR image 640x480 Y10
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/software.zip!/software/library_ws/src/orbbec-ros-sdk/src/ros_setup.cpp#L217"
  - name: /camera/ir/camera_info
    type: sensor_msgs/CameraInfo
    direction: out
    rate_hz: latched
    node: /camera/camera
    description: IR intrinsics
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/software.zip!/software/library_ws/src/orbbec-ros-sdk/src/ros_setup.cpp#L224"
  - name: /camera/depth/points
    type: sensor_msgs/PointCloud2
    direction: out
    rate_hz: 30
    node: /camera/camera
    description: Depth point cloud (enable_point_cloud true)
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/software.zip!/software/library_ws/src/orbbec-ros-sdk/src/ros_setup.cpp#L236"
  - name: /camera/depth_registered/points
    type: sensor_msgs/PointCloud2
    direction: out
    rate_hz: 30
    node: /camera/camera
    description: Colored point cloud (enable_colored_point_cloud true)
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/software.zip!/software/library_ws/src/orbbec-ros-sdk/src/ros_setup.cpp#L244"
services:
  - name: /CurrentAngle
    type: yahboomcar_msgs/RobotArmArray
    node: /driver_node
    description: Read back the six arm servo angles (deg; -1 = read failure)
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L48"
  - name: /driver_node/set_parameters
    type: dynamic_reconfigure/Reconfigure
    node: /driver_node
    description: Set PIDparam.cfg values; SetArmjoint=true moves the arm to joint1-6
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L49"
  - name: /stop_scan
    type: std_srvs/Empty
    node: /ydlidar_lidar_publisher
    description: Stop lidar scanning
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/software.zip!/software/library_ws/src/ydlidar_ros_driver/src/ydlidar_ros_driver.cpp#L154"
  - name: /start_scan
    type: std_srvs/Empty
    node: /ydlidar_lidar_publisher
    description: Start lidar scanning
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/software.zip!/software/library_ws/src/ydlidar_ros_driver/src/ydlidar_ros_driver.cpp#L156"
  - name: /camera/get_depth_exposure
    type: orbbec_camera/GetInt32
    node: /camera/camera
    description: Get depth exposure (created for each enabled stream; support depends on device)
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/software.zip!/software/library_ws/src/orbbec-ros-sdk/src/ros_service.cpp#L13"
  - name: /camera/set_depth_exposure
    type: orbbec_camera/SetInt32
    node: /camera/camera
    description: Set depth exposure (created for each enabled stream; support depends on device)
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/software.zip!/software/library_ws/src/orbbec-ros-sdk/src/ros_service.cpp#L19"
  - name: /camera/reset_depth_exposure
    type: std_srvs/Empty
    node: /camera/camera
    description: Reset depth exposure (created for each enabled stream; support depends on device)
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/software.zip!/software/library_ws/src/orbbec-ros-sdk/src/ros_service.cpp#L25"
  - name: /camera/get_depth_gain
    type: orbbec_camera/GetInt32
    node: /camera/camera
    description: Get depth gain (created for each enabled stream; support depends on device)
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/software.zip!/software/library_ws/src/orbbec-ros-sdk/src/ros_service.cpp#L32"
  - name: /camera/set_depth_gain
    type: orbbec_camera/SetInt32
    node: /camera/camera
    description: Set depth gain (created for each enabled stream; support depends on device)
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/software.zip!/software/library_ws/src/orbbec-ros-sdk/src/ros_service.cpp#L38"
  - name: /camera/reset_depth_gain
    type: std_srvs/Empty
    node: /camera/camera
    description: Reset depth gain (created for each enabled stream; support depends on device)
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/software.zip!/software/library_ws/src/orbbec-ros-sdk/src/ros_service.cpp#L44"
  - name: /camera/set_depth_mirror
