boot:
  summary: With ROBOT_TYPE=X3plus exported (every launch reads $(env ROBOT_TYPE)), the vendor lidar/camera bringup
    yahboomcar_nav/laser_astrapro_bringup.launch, which the tutorials start before every lidar, camera, mapping
    and navigation course. It includes ydlidar_ros_driver/TG.launch (YDLIDAR 4ROS), orbbec_camera/astraproplus.launch
    (Astra Pro Plus) and yahboomcar_bringup/bringup.launch (URDF + robot_state_publisher, Mcnamu_X3plus.py driver_node,
    odometry_publisher, imu_filter_madgwick, robot_localization EKF, and yahboomcar_ctrl/yahboom_joy.launch), plus
    a tf static_transform_publisher /laser_link -> /laser. The pinned workspace was built against /opt/ros/noetic
    (yahboomcar_ws/build/CMakeCache.txt; devel/_setup_util.py CMAKE_PREFIX_PATH ends in /opt/ros/noetic), matching
    Yahboom's Noetic Docker images (Raspberry Pi 5, Jetson Orin); the tutorial README states Ubuntu 18.04 + ROS
    Melodic for the Jetson Nano image, which runs the same packages.
  commands:
  - 'export ROBOT_TYPE=X3plus   # ~/.bashrc (tutorial 10.3 ''Robot information release'')'
  - 'export RPLIDAR_TYPE=4ROS   # ~/.bashrc (tutorial 19/12.1 ''Lidar basic-4ROS-EAI''); read only by mapping launches'
  - roslaunch yahboomcar_nav laser_astrapro_bringup.launch
  launch_files:
  - source: yahboomcar_ws
    path: yahboomcar_ws/src/yahboomcar_nav/launch/laser_astrapro_bringup.launch
    role: top-level boot
  - source: yahboomcar_ws
    path: yahboomcar_ws/src/yahboomcar_bringup/launch/bringup.launch
  - source: yahboomcar_ws
    path: yahboomcar_ws/src/yahboomcar_bringup/param/robot_localization.yaml
  - source: yahboomcar_ws
    path: yahboomcar_ws/src/yahboomcar_ctrl/launch/yahboom_joy.launch
  - source: software_zip
    path: software/library_ws/src/ydlidar_ros_driver/launch/TG.launch
  - source: software_zip
    path: software/library_ws/src/orbbec-ros-sdk/launch/astraproplus.launch
  - source: software_zip
    path: software/library_ws/src/orbbec-ros-sdk/launch/astra_frames.launch
  data_files:
  - source: yahboomcar_ws
    path: yahboomcar_ws/src/yahboomcar_description/urdf/yahboomcar_X3plus.urdf
    role: robot_description (loaded through xacro; the file has no xacro macros)
  hardware: 'Yahboom ROSMASTER X3 PLUS: aluminium chassis with four 80 mm mecanum wheels on 520 geared motors (205
    rpm, 56:1, 11-line Hall encoders; firmware ENCODER_CIRCLE_205) and pendulum suspension; Yahboom ROS expansion
    board V3 (STM32F103, firmware Rosmaster V3.5.1, 115200 baud on /dev/myserial, ICM20948 or MPU9250 IMU, car type
    2 = X3 PLUS); 6-DOF bus-servo arm (servos 1-4 0-180 deg, servo 5 0-270 deg, gripper servo 6); YDLIDAR 4ROS ToF
    lidar on /dev/ydlidar at 512000 baud; Orbbec Astra Pro Plus RGB-D camera (USB, vendor id 0x2bc5); optional USB
    gamepad (/dev/input/js0); main computer Jetson Nano 4GB, Jetson Orin NX/Nano SUPER or Raspberry Pi 5 (Noetic
    in Docker on Pi 5 and Orin). At power-on the image autostarts Yahboom''s non-ROS APP program, which the tutorials
    close before any roslaunch (05.Basic course/2).'
model:
  urdf: yahboomcar_X3plus.urdf
  urdf_sha256: 17c7c8fac92774f0d0cd093fb7500704d3b5149998cb8b60c958f5352646919c
  urdf_source:
    source: yahboomcar_ws
    path: yahboomcar_ws/src/yahboomcar_description/urdf/yahboomcar_X3plus.urdf
  mjcf: model.xml
  mjcf_official: false
  robot_description:
    published_as: ROS parameter /robot_description
    content: xacro --inorder of yahboomcar_X3plus.urdf (no macros, so the same links, joints, limits and meshes
      as the committed URDF)
    differences_from_model:
    - model.xml adds four wheel joints front_left_joint, front_right_joint, back_left_joint, back_right_joint and
      48 passive roller joints that robot_description does not have (the URDF draws the wheels as part of base_link.STL);
      they are not on the wire
    - model.xml replaces base_link's mesh collision with four boxes and shows the URDF's collision meshes as visuals
      of base_link, arm_link2, arm_link3 and arm_link4 (their visual STLs exceed MuJoCo's 200000-face limit)
    - the driver reports grip_joint = -pi/2 for the open gripper (servo 30 deg) while the URDF lower limit is -1.54
      rad; model.xml keeps the URDF limit (robot_description governs)
