    type: string
    default: imu_link
    node: /driver_node
    description: frame_id for IMU and magnetometer messages
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_bringup/launch/bringup.launch#L23"
