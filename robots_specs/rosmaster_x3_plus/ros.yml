parameters:
  - name: /robot_description
    type: string
    default: xacro of yahboomcar_description/urdf/yahboomcar_X3plus.urdf
    node: /robot_state_publisher
    description: Robot model (ROBOT_TYPE=X3plus)
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_bringup/launch/bringup.launch#L8"
  - name: /driver_node/xlinear_speed_limit
    type: double
    default: 0.7
    node: /driver_node
    description: Declared x speed limit (m/s); read but not applied in code
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_bringup/launch/bringup.launch#L20"
  - name: /driver_node/ylinear_speed_limit
    type: double
    default: 0.7
    node: /driver_node
    description: Declared y speed limit (m/s); read but not applied in code
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_bringup/launch/bringup.launch#L21"
  - name: /driver_node/angular_speed_limit
    type: double
    default: 3.2
    node: /driver_node
    description: Declared yaw rate limit (rad/s); read but not applied in code
    source: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_bringup/launch/bringup.launch#L22"
