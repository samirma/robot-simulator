  rate_basis: source
  rate_note: driver_node.pub_data() loops with sleep(0.05) plus serial reads, so at most 20 Hz (ROSMASTER-X3Plus_ROS1_code.zip!/yahboomcar_ws.zip!/yahboomcar_ws/src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L62-L105)
