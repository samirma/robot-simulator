  rate: non_periodic
  notes: chassis velocity command; linear.x, linear.y (m/s), angular.z (rad/s) forwarded unchanged to Rosmaster.set_car_motion
    (motions[drive]); /yahboom_joy also publishes it (yahboom_joy.py L37)
