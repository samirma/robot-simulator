# Robot embodiments shared by the workspace.
#
# One entry per robot. `id` is the value every `--robots`/`--robot` flag takes, and the
# default ROS namespace on a simulator wire. Each robot's folder, `robots_specs/<id>/`,
# holds its URDF, its MuJoCo model (`mjcf`, only where an official one exists) and its
# official ROS interface (`ros`), named after its dialect:
# `ros.yml` for ROS 1, `ros2.yml` for ROS 2. `simulated: true` marks the robots the
# simulator hosts; the others are physical-only. A composite robot names its base robot's
# id in `base`; its ROS file then `extends` the base's and lists only what it adds.
# `meshes` is the folder holding the official meshes the URDF/MJCF reference, laid out as
# upstream, or a list of such folders when the URDF and the MJCF use different ones; a
# `package://<pkg>/` mesh path resolves to the robot's own folder. `gripper` names the
# vendor accessory gripper a robot is fitted with, when it is not part of the robot itself.
# `kind` also says whether a robot moves about the scene: every kind but `arm` does (a
# mobile base, a mobile manipulator, a walking humanoid), so every robot but an `arm` is
# driven by teleop; an `arm` is fixed where it is placed.

robots:
  - id: myagv
    name: myAGV
    manufacturer: Elephant Robotics
    kind: mobile_base
    placement: floor
    simulated: true
    official_url: https://www.elephantrobotics.com/en/myagv-2023-pi-en/
    urdf: myagv/myAGV.urdf
    meshes: myagv/urdf
    ros: myagv/ros.yml
    source:
      repository: https://github.com/elephantrobotics/myagv_ros
      branch: myagv_ros_2023Pi
      revision: c71f3cc574e5ed1973a925238eabe88662cfa701
    documentation:
      - https://docs.elephantrobotics.com/docs/myagv_pi23_en/
      - https://github.com/YDLIDAR/ydlidar_ros_driver
      - https://github.com/ros-drivers/usb_cam/tree/addab4a65fdf65c460fec2cc3eee8fab94699370

  - id: so101
    name: SO-101
    manufacturer: TheRobotStudio
    kind: arm
    placement: worktop
    simulated: true
    official_url: https://github.com/TheRobotStudio/SO-ARM100
    urdf: so101/so101_new_calib.urdf
    mjcf: so101/so101_new_calib.xml
    meshes: so101/assets
    ros: so101/ros2.yml
    source:
      repository: https://github.com/TheRobotStudio/SO-ARM100
      revision: aec17bbc256d1a7342d53aaa4950595d4c30b40d
      ros_bringup:
        repository: https://github.com/ros-physical-ai/ros2_so_arm
        revision: e166df9d51f43b24da9b99047c6c51c306bda74f
    documentation:
      - https://github.com/TheRobotStudio/SO-ARM100/tree/main/Simulation/SO101
      - https://huggingface.co/docs/lerobot/so101
      - https://github.com/ros-drivers/usb_cam/tree/cb2ae6bc0a312de629f84fef933fb3e07dac1ef8

  - id: ainex
    name: AiNex
    manufacturer: Hiwonder
    kind: humanoid
    placement: worktop
    simulated: true
    official_url: https://www.hiwonder.com/products/ainex
    urdf: ainex/ainex.urdf
    meshes: ainex/meshes
    ros: ainex/ros.yml
    source:
      repository: https://github.com/Hiwonder/ainex
      branch: main
      revision: e8fe2a816797cf83054135160df5a82ec3596a69
    documentation:
      - https://docs.hiwonder.com/projects/AiNex/en/raspberry-pi5-version/

  - id: myagv_mycobot280
    name: myAGV + myCobot 280
    manufacturer: Elephant Robotics
    kind: mobile_manipulator
    placement: floor
    simulated: true
    official_url: https://www.elephantrobotics.com/en/myagv-2023-pi-en/
    base: myagv                  # the base's URDF; no official composite URDF exists
    urdf: myagv_mycobot280/mycobot_280_pi_adaptive_gripper.urdf   # arm + gripper; the arm is driven over a pymycobot socket, not ROS
    mjcf: myagv_mycobot280/xml/mycobot_280jn_mujoco.xml   # official myCobot 280 JetsonNano model, arm only; Elephant publishes none for the 280 Pi
    meshes:
      - myagv_mycobot280/urdf/mycobot_280_pi     # the URDF's arm
      - myagv_mycobot280/urdf/adaptive_gripper   # the URDF's gripper
      - myagv_mycobot280/meshes_mujoco            # the MJCF's
    gripper:
      id: adaptive_gripper
      name: myCobot Adaptive Gripper
      official_url: https://shop.elephantrobotics.com/collections/mycobot/products/adaptive-gripper
    ros: myagv_mycobot280/ros.yml
    source:
      repository: https://github.com/elephantrobotics/myagv_ros
      branch: myagv_ros_2023Pi
      revision: c71f3cc574e5ed1973a925238eabe88662cfa701
      arm_description:
        repository: https://github.com/elephantrobotics/mycobot_ros2   # the only official 280 Pi + gripper URDF; mycobot_ros (ROS 1) has none
        branch: humble
        revision: d42ff61a78122c79246623391540d75738b03b23
      arm_mjcf:
        repository: https://github.com/elephantrobotics/mycobot_mujoco
        branch: main
        revision: 72b7a1b01800304d90a33ef2c17776a3e9687472
    documentation:
      - https://docs.elephantrobotics.com/docs/myagv_pi23_en/7-ExamplesRobotsUsing/7.1-myagvAnd280Pi/7.1.1-SocketCommunication.html
      - https://www.elephantrobotics.com/en/mycobot-280-pi-2023-en/
      - https://docs.elephantrobotics.com/docs/mycobot_280_pi_en/4-SupportAndService/Accessories/AdaptiveGripper.html
      - https://docs.elephantrobotics.com/docs/mycobot_280_pi_en/3-FunctionsAndApplications/6.developmentGuide/python/6_gripper.html

  - id: rosmaster_x3_plus
    name: ROSMASTER X3 PLUS
    manufacturer: Yahboom
    kind: mobile_manipulator
    placement: floor
    simulated: true
    official_url: https://category.yahboom.net/products/rosmaster-x3-plus
    urdf: rosmaster_x3_plus/yahboomcar_X3plus.urdf
    meshes: rosmaster_x3_plus/meshes
    ros: rosmaster_x3_plus/ros.yml
    source:                      # the code is not in git; pinned by download
      repository: https://github.com/YahboomTechnology/ROSMASTERX3-PLUS   # tutorials only
      branch: main
      revision: 9732c62247dfb57a899aea01e4fe72ed434bac6d
      code_download:
        url: https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU
        file: ROSMASTER-X3Plus_ROS1_code.zip
        bytes: 6343438429
        retrieved: 2026-09-27
        urdf_sha256: 17c7c8fac92774f0d0cd093fb7500704d3b5149998cb8b60c958f5352646919c
        workspace_zip: yahboomcar_ws.zip   # the member holding the URDF and meshes
        workspace_zip_sha256: 13d752e04cba3e34116912c3903bbe194e5ca5185c304036fb0ddedb59937162
    documentation:
      - http://www.yahboom.net/study/ROSMASTER-X3-PLUS
