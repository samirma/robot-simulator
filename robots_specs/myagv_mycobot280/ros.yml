    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/param/base_local_planner_param/base_local_planner_params.yaml#L2
  - name: /move_base/move_base/base_global_planner
    description: global_planner/GlobalPlanner, one namespace too deep like the GlobalPlanner block beside it
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/param/base_local_planner_param/base_global_planner_params.yaml#L1

gripper_commands:
  # --- pymycobot over the arm's socket: the composite's official arm path, not ROS. The arm (280 Pi) runs pymycobot's
  # demo/Server_280.py (TCP 9000 -> /dev/ttyAMA0 @ 1000000); the myAGV connects with MyCobotSocket("<arm ip>", 9000)
  # as in manual 7.1.1. Gripper type 1 = adaptive gripper (the default when omitted). ---
  - name: set_gripper_state(flag, speed, _type_1=None)
    client: MyCobotSocket
    description: "Open or close: flag 0 = open, 1 = close (254 = release, the value pymycobot's check accepts; the docstring says 10); speed 1..100; _type_1 1 = adaptive. Open is arm.set_gripper_state(0, 80, 1), close is arm.set_gripper_state(1, 80, 1), exactly as mycobot_ros2's /set_gripper service does."
    source: https://github.com/elephantrobotics/pymycobot/blob/44d7fb1c34e1d6c3924ec86617e8f9637f449074/pymycobot/generate.py#L526
  - name: set_gripper_value(gripper_value, speed, gripper_type=None)
    client: MyCobotSocket
    description: Move to an opening, gripper_value 0 (closed) .. 100 (open), speed 1..100, gripper_type 1 = adaptive; replies when done.
    source: https://github.com/elephantrobotics/pymycobot/blob/44d7fb1c34e1d6c3924ec86617e8f9637f449074/pymycobot/generate.py#L545
  - name: set_gripper_calibration()
    client: MyCobotSocket
    description: Take the gripper's current position as its zero (servo value 2048).
    source: https://github.com/elephantrobotics/pymycobot/blob/44d7fb1c34e1d6c3924ec86617e8f9637f449074/pymycobot/generate.py#L563
  - name: get_gripper_value(gripper_type=None)
    client: MyCobot280Socket
    description: Current opening, 0..100. MyCobotSocket (the manual's class) decodes the reply but defines no such method at this commit, so reading needs MyCobot280Socket, the same wire protocol to the same Server_280.py.
    source: https://github.com/elephantrobotics/pymycobot/blob/44d7fb1c34e1d6c3924ec86617e8f9637f449074/pymycobot/mycobot280socket.py#L483
  - name: is_gripper_moving()
    client: MyCobot280Socket
    description: 1 while the gripper moves, 0 when still, -1 on error.
    source: https://github.com/elephantrobotics/pymycobot/blob/44d7fb1c34e1d6c3924ec86617e8f9637f449074/pymycobot/mycobot280socket.py#L501
  - name: init_gripper()
    client: MyCobot280Socket
    description: Initialise the gripper; 1 on success. MyCobot280Socket's set_gripper_state / set_gripper_value (L783, L807) also take is_torque (firmware >= 6.5).
    source: https://github.com/elephantrobotics/pymycobot/blob/44d7fb1c34e1d6c3924ec86617e8f9637f449074/pymycobot/mycobot280socket.py#L454

gripper_ros2:
  # --- mycobot_ros2 (humble), the arm's own ROS 2 stack run on the 280 Pi with a serial MyCobot280 (/dev/ttyAMA0 @ 1000000).
  # NOT started by the composite bringup, which is ROS 1 on the myAGV and reaches the arm only over the socket above. ---
  - name: /set_gripper
    type: mycobot_interfaces/srv/GripperStatus
    node: listen_real_service
    description: "Request bool status: true opens (set_gripper_state(0, 80, 1)), false closes (set_gripper_state(1, 80, 1)); response bool flag. mycobot_280pi teleop_keyboard.launch.py starts it; the teleop_keyboard node (run on its own) calls it on keys g (open) / h (close)."
    source: https://github.com/elephantrobotics/mycobot_ros2/blob/d42ff61a78122c79246623391540d75738b03b23/mycobot_280/mycobot_280pi/mycobot_280pi/listen_real_service.py#L186
  - name: /joint_states
    type: sensor_msgs/msg/JointState
    direction: in
    node: slider_control_adaptive_gripper
    description: slider_control_adaptive_gripper.launch.py (model mycobot_280_pi_adaptive_gripper.urdf) feeds joint_state_publisher_gui sliders to this node, which sends the six arm angles and maps the gripper position with gripper_value_map to set_gripper_value(value, 80, gripper_type=1). It takes every position after the sixth as the gripper and keeps the last; the URDF's last mimic joint has multiplier +1, so that equals gripper_controller.
    source: https://github.com/elephantrobotics/mycobot_ros2/blob/d42ff61a78122c79246623391540d75738b03b23/mycobot_280/mycobot_280pi/mycobot_280pi/slider_control_adaptive_gripper.py#L50
  # KNOWN DEFECT at the pinned commit: mycobot_280pi/setup.py#L61 and #L63 point listen_real_service and
  # slider_control_adaptive_gripper at the mycobot_280 (M5) package's modules, whose defaults are /dev/ttyUSB0 @ 115200.
  # The slider launch passes port/baud, so it still reaches /dev/ttyAMA0; teleop_keyboard.launch.py passes none (commented out).

stop_command: >-
  Base: publish a zero geometry_msgs/Twist on /cmd_vel. myagv_odometry_node keeps re-sending the last /cmd_vel every
  cycle with no timeout, so the base moves until a zero Twist arrives. If a navigation goal is active, first cancel it
  by publishing an actionlib_msgs/GoalID on /move_base/cancel (empty id cancels all), otherwise move_base keeps sending
  velocities; the official composite socket server does exactly this (publishers on /move_base/cancel and /cmd_vel).
  Arm: no ROS stop exists in the composite; the arm is commanded over pymycobot's MyCobotSocket.
  Refs: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_odometry/src/myAGVSub.cpp#L32
  https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/simple_navigation_goals/scripts/agv_socket_server.py#L36
