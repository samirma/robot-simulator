    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/base_local_planner/src/trajectory_planner_ros.cpp#L266

parameters:
  # --- composite_robot_navigation_active.launch ---
  - name: /map_server_for_test/frame_id
    description: map (map file myagv_navigation/map/composite_robot_map.yaml via launch arg map_file)
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/launch/composite_robot_navigation_active.launch#L7
  - name: /amcl/initial_pose_x
    description: 0.795 m (start position on the composite demo map)
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/launch/composite_robot_navigation_active.launch#L15
  - name: /amcl/initial_pose_y
    description: -0.452 m
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/launch/composite_robot_navigation_active.launch#L16
  - name: /amcl/initial_pose_a
    description: -2.229 rad
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/launch/composite_robot_navigation_active.launch#L17
  - name: /amcl/*
    unverified: true   # the launch loads param/amcl.yaml, which is missing at this commit; values here are from the closest file, base_local_planner_param/amcl.yaml
    description: If the path is fixed to base_local_planner_param/amcl.yaml, use_map_topic true, odom_frame_id odom, base_frame_id base_footprint, global_frame_id map, odom_model_type diff, particles 2000-5000, laser_max_beams 100, laser_max_range 12.0, update_min_d 0.15, update_min_a 0.2, transform_tolerance 0.3.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/param/base_local_planner_param/amcl.yaml
  - name: /move_base/base_global_planner
    description: global_planner/GlobalPlanner
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/launch/composite_robot_navigation_active.launch#L28
  - name: /move_base/planner_frequency
    description: 1.0 Hz
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/launch/composite_robot_navigation_active.launch#L29
  - name: /move_base/planner_patience
    description: 2.0 s
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/launch/composite_robot_navigation_active.launch#L30
  - name: /move_base/base_local_planner
    description: base_local_planner/TrajectoryPlannerROS
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/launch/composite_robot_navigation_active.launch#L32
  - name: /move_base/controller_frequency
    description: 5.0 Hz (also set to 5.0 by base_local_planner_params.yaml#L1)
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/launch/composite_robot_navigation_active.launch#L33
  - name: /move_base/controller_patience
    description: 3.0 s
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/launch/composite_robot_navigation_active.launch#L34
  - name: /move_base/clearing_rotation_allowed
    description: true
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/launch/composite_robot_navigation_active.launch#L35
  - name: /move_base/move_base/GlobalPlanner/*
    description: base_global_planner_params.yaml is loaded with ns="move_base" inside the move_base node, so its GlobalPlanner settings (use_dijkstra, use_quadratic, allow_unknown, cost_factor 0.55, neutral_cost 66, lethal_cost 253) land one namespace too deep and GlobalPlanner runs on its defaults.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/launch/composite_robot_navigation_active.launch#L25
  - name: /move_base/{global_costmap,local_costmap}/footprint
    description: "[[0.17, 0.12], [0.17, -0.12], [-0.17, -0.12], [-0.17, 0.12]] m, footprint_padding 0.01 (myAGV body only; the mounted arm is not in the footprint)"
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/param/base_local_planner_param/costmap_common_params.yaml#L1
  - name: /move_base/{global_costmap,local_costmap}/obstacle_layer/laser_scan_sensor
    description: LaserScan from /scan, marking + clearing, obstacle_range 2.0, raytrace_range 2.0
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/param/base_local_planner_param/costmap_common_params.yaml#L19
  - name: /move_base/{global_costmap,local_costmap}/inflation_layer/inflation_radius
    description: 0.25 m, cost_scaling_factor 5.0
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/param/base_local_planner_param/costmap_common_params.yaml#L29
  - name: /move_base/global_costmap/*
    description: global_frame map, robot_base_frame base_footprint, update_frequency 0.3, publish_frequency 0.3, static (rolling_window false), plugins static_layer / obstacle_layer (VoxelLayer) / inflation_layer
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/param/base_local_planner_param/global_costmap_params.yaml
  - name: /move_base/local_costmap/*
    description: global_frame map, robot_base_frame base_footprint, update_frequency 0.3, publish_frequency 2.0, rolling_window 3.0 x 3.0 m at 0.02 m, plugins static_layer / obstacle_layer / inflation_layer
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/param/base_local_planner_param/local_costmap_params.yaml
  - name: /move_base/TrajectoryPlannerROS/max_vel_x
    description: 0.2 m/s (min_vel_x 0.01, acc_lim_x 2)
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/param/base_local_planner_param/base_local_planner_params.yaml#L14
  - name: /move_base/TrajectoryPlannerROS/max_vel_theta
    description: 0.1 rad/s (min_vel_theta -0.1, min_in_place_vel_theta 0.25, acc_lim_theta 0.5)
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/param/base_local_planner_param/base_local_planner_params.yaml#L17
  - name: /move_base/TrajectoryPlannerROS/holonomic_robot
    description: false (no lateral commands from the planner even though the base is Mecanum)
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/param/base_local_planner_param/base_local_planner_params.yaml#L21
  - name: /move_base/TrajectoryPlannerROS/xy_goal_tolerance
    description: 0.25 m (yaw_goal_tolerance 0.25 rad)
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/param/base_local_planner_param/base_local_planner_params.yaml#L26
  - name: /move_base/TrajectoryPlannerROS/*
    description: every other TrajectoryPlannerROS setting of base_local_planner_params.yaml (acc_lim_*, min_vel_*, sim_*, *_samples, scoring biases, publish_cost_grid_pc true, ...)
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/myagv_navigation/param/base_local_planner_param/base_local_planner_params.yaml#L8
  - name: /move_base/NavfnROS/*
