# myAGV + myCobot 280 — official ROS 1 interface.
# Composite per the official myAGV 2023 Pi manual, chapter 7.1 "myAGV + 280Pi composite robot": a myCobot 280 Pi
# bolted on top of a myAGV 2023 Pi (four M4x8 screws, arm X axis aligned with the AGV X axis, front or rear
# mount). The two machines have separate computers linked over Wi-Fi. Only the myAGV side runs ROS. The arm is
# driven over a TCP socket with pymycobot (MyCobotSocket / Server.py on the arm), not through ROS, so the arm
# adds no topics, services or parameters here.
# End effector: Elephant's myCobot Adaptive Gripper (robots.yml `gripper`) on the arm's flange. The composite manual
# itself only shows the integrated suction pump; the gripper is the standard myCobot 280 accessory and has the only
# official 280 Pi + tool URDF with moving joints. It is opened and closed over the same pymycobot socket as the arm
# (gripper_commands below); the ROS 2 path in gripper_ros2 is mycobot_ros2's standalone arm stack, not the composite.
# Boot sequence on the myAGV (manual 7.1.2 section 6.1-6.2):
#   ./start_ydlidar.sh ; roslaunch myagv_odometry myagv_active.launch ; roslaunch myagv_navigation composite_robot_navigation_active.launch
# The second launch starts map_server, amcl, move_base (global_planner/GlobalPlanner + base_local_planner/TrajectoryPlannerROS)
# and rviz. The rviz GUI is left out; it only feeds /initialpose, /move_base_simple/goal_temp and /clicked_point from user clicks.
# KNOWN DEFECT at the pinned commit: composite_robot_navigation_active.launch#L14 loads
# $(find myagv_navigation)/param/amcl.yaml, which does not exist (the only amcl.yaml is param/base_local_planner_param/amcl.yaml).
# roslaunch would stop on that missing rosparam file, so the amcl entries below assume a user-fixed path (unverified).
# The launch's map and parameter files, at the pinned revision, are in robots_specs/myagv_mycobot280/myagv_navigation/,
# laid out as upstream (PROVENANCE.md there lists each file's hash): the /map below is that map, and every parameter
# row is what those files and the launch set.
# Rows with `active_while` carry their rate only while that holds (move_base's planning and control topics while a
# navigation goal is active); outside it the node publishes nothing on them.
# ROS runtime names (/rosout, /rosout_agg, logger services) are excluded. Each dynamic_reconfigure server listed under
# services also latches <ns>/parameter_descriptions and <ns>/parameter_updates (dynamic_reconfigure/ConfigDescription, /Config).
dialect: ros1          # ROS Noetic
extends: myagv/ros.yml # the base interface; entries below are only what the composite adds
sources:               # every URL a fact below cites, pinned where possible
  - https://github.com/elephantrobotics/myagv_ros/tree/c71f3cc574e5ed1973a925238eabe88662cfa701          # branch myagv_ros_2023Pi (vendors navigation, robot_pose_ekf, ydlidar_ros_driver)
  - https://github.com/elephantrobotics/myAGV-docs/blob/2510f8a3bd399823dd82088a92b1b2ee62d6d130/MYAGV_PI_2023_EN/7-ExamplesRobotsUsing/7.1-myagvAnd280Pi/7.1.1-SocketCommunication.md
  - https://github.com/elephantrobotics/myAGV-docs/blob/2510f8a3bd399823dd82088a92b1b2ee62d6d130/MYAGV_PI_2023_EN/7-ExamplesRobotsUsing/7.1-myagvAnd280Pi/7.1.2-ArucoCodeVisualCase.md
  - https://docs.elephantrobotics.com/docs/myagv_pi23_en/7-ExamplesRobotsUsing/7.1-myagvAnd280Pi/7.1.2-ArucoCodeVisualCase.html
  - https://github.com/elephantrobotics/mycobot_ros2/tree/d42ff61a78122c79246623391540d75738b03b23        # branch humble (arm + adaptive gripper URDF, gripper_ros2; the arm has no ROS role in the composite)
  - https://github.com/elephantrobotics/pymycobot/tree/44d7fb1c34e1d6c3924ec86617e8f9637f449074          # main (MyCobotSocket, MyCobot280Socket, demo/Server_280.py)
  - https://docs.elephantrobotics.com/docs/mycobot_280_pi_en/3-FunctionsAndApplications/6.developmentGuide/python/6_gripper.html
  - https://github.com/ros/robot_state_publisher/tree/85ed2140a0966f492a038d47f222f593047760c3        # noetic-devel, 1.15.3
  - https://github.com/ros/joint_state_publisher/tree/ccb4446b9092e7f6d7956d7058d17745df7f8475        # noetic-devel
  - https://github.com/ros/geometry/tree/f23e0aa39053a57263615ebb7d603fc97f09707c                     # noetic-devel, tf
boot_launch: myagv_odometry/launch/myagv_active.launch + myagv_navigation/launch/composite_robot_navigation_active.launch   # both no args; lidar powered first by myagv_odometry/scripts/start_ydlidar.sh
joints: [base_up]      # only movable joint in /robot_description (myAGV.urdf, continuous). Arm joints joint2_to_joint1 ... joint6output_to_joint6 and the gripper joints exist only in mycobot_280_pi_adaptive_gripper.urdf and are not on ROS.
gripper_joint: gripper_controller   # driver joint of the gripper in mycobot_280_pi_adaptive_gripper.urdf: revolute about gripper_base z, limits -0.74 .. 0.15 rad
gripper_mimic_joints: [gripper_base_to_gripper_left2, gripper_left3_to_gripper_left1, gripper_base_to_gripper_right3, gripper_base_to_gripper_right2, gripper_right3_to_gripper_right1]   # <mimic joint="gripper_controller">, multipliers +1, -1, -1, -1, +1, offset 0
gripper_open: 0.15     # rad on gripper_controller (upper limit) = gripper value 100 = fully open (opening range 20-45 mm per the accessory page)
gripper_closed: -0.74  # rad on gripper_controller (lower limit) = gripper value 0 = fully closed
gripper_value_map: value = round((q + 0.74) / 0.89 * 100)   # joint q (rad) -> pymycobot gripper value 0..100, as mycobot_ros2's slider_control_adaptive_gripper.py#L59-L62 maps it

topics:
  # --- map_server_for_test (map_server, map composite_robot_map.yaml) ---
  - name: /map
    type: nav_msgs/OccupancyGrid
    direction: out
    rate_hz: latched
    node: map_server_for_test
    description: Static map of the composite-robot demo field (composite_robot_map.pgm, 0.05 m/cell, origin [-1.0, -12.2, 0]), frame map.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/map_server/src/main.cpp#L84
  - name: /map_metadata
    type: nav_msgs/MapMetaData
    direction: out
    rate_hz: latched
    node: map_server_for_test
    description: Metadata of /map.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/map_server/src/main.cpp#L81

  # --- amcl ---
  - name: /initialpose
    type: geometry_msgs/PoseWithCovarianceStamped
    direction: in
    rate_hz: event
    node: amcl
    description: Re-initialise the localisation pose (rviz "2D Pose Estimate", as the manual instructs).
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/amcl/src/amcl_node.cpp#L494
  - name: /amcl_pose
    type: geometry_msgs/PoseWithCovarianceStamped
    direction: out
    rate_hz: event
    node: amcl
    description: Estimated robot pose in map, published (latched) after each filter update.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/amcl/src/amcl_node.cpp#L477
  - name: /particlecloud
    type: geometry_msgs/PoseArray
    direction: out
    rate_hz: event
    node: amcl
    description: Particle set (latched), published after resampling.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/amcl/src/amcl_node.cpp#L478
  - name: /tf
    type: tf2_msgs/TFMessage
    direction: out
    rate_hz: 30
    node: amcl
    description: map -> odom correction (tf_broadcast default true), sent on every laser scan -- recomputed after a filter update, republished otherwise -- so at the /scan rate (30), future-dated by transform_tolerance.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/amcl/src/amcl_node.cpp#L1493

  # --- move_base (actionlib server "move_base", move_base_msgs/MoveBaseAction) ---
  - name: /move_base/goal
    type: move_base_msgs/MoveBaseActionGoal
    direction: in
    rate_hz: event
    node: move_base
    description: Action goal (target_pose in map); the manual's composite demo sends goals via actionlib SimpleActionClient("move_base").
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/move_base/src/move_base.cpp#L61
  - name: /move_base/cancel
    type: actionlib_msgs/GoalID
    direction: in
    rate_hz: event
    node: move_base
    description: Cancel the active navigation goal (actionlib).
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/move_base/src/move_base.cpp#L61
  - name: /move_base/feedback
    type: move_base_msgs/MoveBaseActionFeedback
    direction: out
    rate_hz: 5
    active_while: a navigation goal is active
    node: move_base
    description: Current base pose while a goal is active (once per controller cycle, controller_frequency 5 Hz).
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/move_base/src/move_base.cpp#L61
  - name: /move_base/status
    type: actionlib_msgs/GoalStatusArray
    direction: out
    rate_hz: 5
    unverified: true   # actionlib default status_frequency, not set in the launch
    node: move_base
    description: actionlib goal status list.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/move_base/src/move_base.cpp#L61
  - name: /move_base/result
    type: move_base_msgs/MoveBaseActionResult
    direction: out
    rate_hz: event
    node: move_base
    description: Terminal result of a navigation goal (succeeded / aborted / preempted).
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/move_base/src/move_base.cpp#L61
  - name: /move_base_simple/goal
    type: geometry_msgs/PoseStamped
    direction: in
    rate_hz: event
    node: move_base
    description: Fire-and-forget goal, wrapped into an action goal.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/move_base/src/move_base.cpp#L107
  - name: /cmd_vel
    type: geometry_msgs/Twist
    direction: out
    rate_hz: 5
    active_while: a navigation goal is active
    node: move_base
    description: Velocity command from TrajectoryPlannerROS (controller_frequency 5 Hz) to myagv_odometry_node; zero Twist on stop/recovery.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/move_base/src/move_base.cpp#L96
  - name: /move_base/current_goal
    type: geometry_msgs/PoseStamped
    direction: out
    rate_hz: event
    node: move_base
    description: Goal currently being pursued, in the global frame.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/move_base/src/move_base.cpp#L97
  - name: /move_base/recovery_status
    type: move_base_msgs/RecoveryStatus
    direction: out
    rate_hz: event
    node: move_base
    description: Which recovery behaviour is running.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/move_base/src/move_base.cpp#L101
  - name: /move_base/global_costmap/costmap
    type: nav_msgs/OccupancyGrid
    direction: out
    rate_hz: 0.3
    node: move_base
    description: Global costmap (static_layer + VoxelLayer obstacle_layer + inflation_layer), frame map, publish_frequency 0.3.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/costmap_2d/src/costmap_2d_publisher.cpp#L52
  - name: /move_base/global_costmap/costmap_updates
    type: map_msgs/OccupancyGridUpdate
    direction: out
    rate_hz: 0.3
    active_while: a partial costmap update is sent (never, with always_send_full_costmap true)
    unverified: true   # always_send_full_costmap true, so full maps go on .../costmap instead
    node: move_base
    description: Incremental global costmap updates.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/costmap_2d/src/costmap_2d_publisher.cpp#L54
  - name: /move_base/global_costmap/footprint
    type: geometry_msgs/PolygonStamped
    direction: out
    rate_hz: 0.3
    node: move_base
    description: Padded robot footprint (0.34 x 0.24 m rectangle + 0.01 padding) in the global costmap frame.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/costmap_2d/src/costmap_2d_ros.cpp#L155
  - name: /move_base/global_costmap/footprint
    type: geometry_msgs/Polygon
    direction: in
    rate_hz: event
    node: move_base
    description: Replace the unpadded robot footprint at runtime (same name as the published footprint, per the source).
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/costmap_2d/src/costmap_2d_ros.cpp#L147
  - name: /move_base/global_costmap/obstacle_layer/clearing_endpoints
    type: sensor_msgs/PointCloud
    direction: out
    rate_hz: 0.3
    unverified: true   # emitted on costmap updates (update_frequency 0.3)
    node: move_base
    description: VoxelLayer raytrace clearing endpoints (global costmap only; publish_voxel_map is off, so no voxel_grid topic).
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/costmap_2d/plugins/voxel_layer.cpp#L64
  - name: /move_base/local_costmap/costmap
    type: nav_msgs/OccupancyGrid
    direction: out
    rate_hz: 2
    node: move_base
    description: Local rolling-window costmap 3 x 3 m at 0.02 m, frame map, publish_frequency 2.0.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/costmap_2d/src/costmap_2d_publisher.cpp#L52
  - name: /move_base/local_costmap/costmap_updates
    type: map_msgs/OccupancyGridUpdate
    direction: out
    rate_hz: 2
    active_while: a partial costmap update is sent (never, with always_send_full_costmap true)
    unverified: true   # always_send_full_costmap true
    node: move_base
    description: Incremental local costmap updates.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/costmap_2d/src/costmap_2d_publisher.cpp#L54
  - name: /move_base/local_costmap/footprint
    type: geometry_msgs/PolygonStamped
    direction: out
    rate_hz: 2
    node: move_base
    description: Padded robot footprint in the local costmap frame.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/costmap_2d/src/costmap_2d_ros.cpp#L155
  - name: /move_base/local_costmap/footprint
    type: geometry_msgs/Polygon
    direction: in
    rate_hz: event
    node: move_base
    description: Replace the unpadded robot footprint at runtime.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/costmap_2d/src/costmap_2d_ros.cpp#L147
  - name: /move_base/GlobalPlanner/plan
    type: nav_msgs/Path
    direction: out
    rate_hz: 1
    active_while: a navigation goal is active
    node: move_base
    description: Global path from global_planner/GlobalPlanner (planner_frequency 1.0).
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/global_planner/src/planner_core.cpp#L138
  - name: /move_base/GlobalPlanner/potential
    type: nav_msgs/OccupancyGrid
    direction: out
    rate_hz: 1
    active_while: a navigation goal is active
    node: move_base
    description: Navigation potential field of the last plan.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/global_planner/src/planner_core.cpp#L139
  - name: /move_base/TrajectoryPlannerROS/global_plan
    type: nav_msgs/Path
    direction: out
    rate_hz: 5
    active_while: a navigation goal is active
    node: move_base
    description: Portion of the global plan the local planner follows.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/base_local_planner/src/trajectory_planner_ros.cpp#L95
  - name: /move_base/TrajectoryPlannerROS/local_plan
    type: nav_msgs/Path
    direction: out
    rate_hz: 5
    active_while: a navigation goal is active
    node: move_base
    description: Selected local trajectory.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/base_local_planner/src/trajectory_planner_ros.cpp#L96
  - name: /move_base/TrajectoryPlannerROS/cost_cloud
    type: sensor_msgs/PointCloud2
    direction: out
    rate_hz: 5
    active_while: a navigation goal is active
    unverified: true   # namespace follows MapGridVisualizer("~/" + name); publish_cost_grid_pc true in base_local_planner_params.yaml
    node: move_base
    description: Local planner cost grid as a point cloud.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/base_local_planner/src/map_grid_visualizer.cpp#L51

services:
  - name: /static_map
    type: nav_msgs/GetMap
    node: map_server_for_test
    description: Return the loaded map.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/map_server/src/main.cpp#L75
  - name: /change_map
    type: nav_msgs/LoadMap
    node: map_server_for_test
    description: Load and publish a different map YAML.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/map_server/src/main.cpp#L78
  - name: /global_localization
    type: std_srvs/Empty
    node: amcl
    description: Scatter particles uniformly over free space.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/amcl/src/amcl_node.cpp#L479
  - name: /request_nomotion_update
    type: std_srvs/Empty
    node: amcl
    description: Force a filter update without motion.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/amcl/src/amcl_node.cpp#L482
  - name: /set_map
    type: nav_msgs/SetMap
    node: amcl
    description: Replace amcl's map and initial pose.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/amcl/src/amcl_node.cpp#L483
  - name: /amcl/set_parameters
    type: dynamic_reconfigure/Reconfigure
    node: amcl
    description: dynamic_reconfigure for amcl (AMCL.cfg).
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/amcl/src/amcl_node.cpp#L504
  - name: /move_base/make_plan
    type: nav_msgs/GetPlan
    node: move_base
    description: Compute a global plan without executing it.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/move_base/src/move_base.cpp#L151
  - name: /move_base/clear_costmaps
    type: std_srvs/Empty
    node: move_base
    description: Clear obstacles from both costmaps.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/move_base/src/move_base.cpp#L154
  - name: /move_base/GlobalPlanner/make_plan
    type: nav_msgs/GetPlan
    node: move_base
    description: GlobalPlanner's own planning service.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/global_planner/src/planner_core.cpp#L149
  - name: /move_base/set_parameters
    type: dynamic_reconfigure/Reconfigure
    node: move_base
    description: dynamic_reconfigure for move_base (MoveBase.cfg).
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/move_base/src/move_base.cpp#L177
  - name: /move_base/global_costmap/set_parameters
    type: dynamic_reconfigure/Reconfigure
    node: move_base
    description: dynamic_reconfigure for the global costmap (Costmap2D.cfg).
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/costmap_2d/src/costmap_2d_ros.cpp#L167
  - name: /move_base/local_costmap/set_parameters
    type: dynamic_reconfigure/Reconfigure
    node: move_base
    description: dynamic_reconfigure for the local costmap (Costmap2D.cfg).
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/costmap_2d/src/costmap_2d_ros.cpp#L167
  - name: /move_base/global_costmap/static_layer/set_parameters
    type: dynamic_reconfigure/Reconfigure
    node: move_base
    description: dynamic_reconfigure for the global static layer (same server exists for /move_base/local_costmap/static_layer).
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/costmap_2d/plugins/static_layer.cpp#L120
  - name: /move_base/local_costmap/static_layer/set_parameters
    type: dynamic_reconfigure/Reconfigure
    node: move_base
    description: dynamic_reconfigure for the local static layer.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/costmap_2d/plugins/static_layer.cpp#L120
  - name: /move_base/global_costmap/obstacle_layer/set_parameters
    type: dynamic_reconfigure/Reconfigure
    node: move_base
    description: dynamic_reconfigure for the global obstacle layer (VoxelLayer registers VoxelPlugin.cfg on the same namespace).
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/costmap_2d/plugins/voxel_layer.cpp#L69
  - name: /move_base/local_costmap/obstacle_layer/set_parameters
    type: dynamic_reconfigure/Reconfigure
    node: move_base
    description: dynamic_reconfigure for the local obstacle layer (ObstaclePlugin.cfg).
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/costmap_2d/plugins/obstacle_layer.cpp#L223
  - name: /move_base/global_costmap/inflation_layer/set_parameters
    type: dynamic_reconfigure/Reconfigure
    node: move_base
    description: dynamic_reconfigure for the global inflation layer.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/costmap_2d/plugins/inflation_layer.cpp#L95
  - name: /move_base/local_costmap/inflation_layer/set_parameters
    type: dynamic_reconfigure/Reconfigure
    node: move_base
    description: dynamic_reconfigure for the local inflation layer.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/costmap_2d/plugins/inflation_layer.cpp#L95
  - name: /move_base/GlobalPlanner/set_parameters
    type: dynamic_reconfigure/Reconfigure
    node: move_base
    description: dynamic_reconfigure for GlobalPlanner.
    source: https://github.com/elephantrobotics/myagv_ros/blob/c71f3cc574e5ed1973a925238eabe88662cfa701/navigation/global_planner/src/planner_core.cpp#L151
  - name: /move_base/TrajectoryPlannerROS/set_parameters
    type: dynamic_reconfigure/Reconfigure
