[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robot_console"
version = "0.2.0"
description = "Teleoperate, view and check ROS 1 / ROS 2 robots over rosbridge, simulated or physical."
requires-python = ">=3.10"
# The console speaks rosbridge JSON over a websocket and needs no ROS installation,
# robot firmware, simulator or sibling source tree.
dependencies = [
    "websockets>=13",          # rosbridge transport (sync client)
    "PyYAML>=6",               # packaged profiles
    "numpy>=1.24",             # camera frames (raw encodings decoded in numpy)
    "pygame>=2.5",             # teleop window: focus + held/released key events; JPEG/PNG decode
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "playwright>=1.45",        # browser tests of the view.sh page
]

[tool.hatch.build.targets.wheel]
packages = ["src/robot_console"]   # includes profiles/*.yaml and web/*

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = [
    "live: runs against real rosbridge servers in Docker (opt in with -m live)",
    "browser: drives the view.sh page in headless Chromium (playwright)",
]
