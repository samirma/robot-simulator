reads_note: >-
  A read maps each answered value to a control field as field = (raw - offset) / scale (offset 0, scale 1 when not
  given). The page calls a read service only when the user clicks its button; it is never called on load.
uncertainties:
  - "The ROS 2 docs page for the 280 Pi documents slider_control.launch.py (no gripper) but not the adaptive-gripper launch; slider_control_adaptive_gripper.launch.py is taken from the pinned Pi package as the equivalent boot for this end effector. Both present the same endpoint set."
  - "The executables slider_control_adaptive_gripper and listen_real_service of mycobot_280pi resolve to modules of the sibling mycobot_280 package (mycobot_ros2:mycobot_280/mycobot_280pi/setup.py#L61-L63), whose defaults are /dev/ttyUSB0 @ 115200. The adaptive-gripper launch passes port/baud (#L80-L90) so it works; teleop_keyboard.launch.py passes none (params commented out, mycobot_ros2:mycobot_280/mycobot_280pi/launch/teleop_keyboard.launch.py#L59-L62), so on a Pi the service node opens the wrong port unless port/baud are overridden. The service controls are therefore gated on /set_angles and /set_gripper being present."
  - "The boot has no hardware feedback: /joint_states and /tf reflect the commanded or slider state, never measured angles. Real feedback requires listen_real / listen_real_service / follow_display, which publish on the same /joint_states the slider node executes (feedback loop if combined)."
  - "Standard-node behaviour (robot_state_publisher /robot_description transient_local, /tf on joint_states, joint_state_publisher_gui publish rate and mimic-joint handling) comes from upstream ROS 2 Humble packages, not the pinned repo."
  - "Which end of the gripper_controller range (0 or 100 gripper value) is open vs closed is not stated in the pinned sources or the fetched API text; the control exposes the raw URDF joint range."

