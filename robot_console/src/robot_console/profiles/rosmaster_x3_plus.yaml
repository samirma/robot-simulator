id: rosmaster_x3_plus
name: "Yahboom ROSMASTER X3 PLUS (ROS 1)"
dialect: ros1
teleop: base

sources:
  yahboomcar_ws:
    url: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU (ROSMASTER-X3Plus_ROS1_code.zip) -> yahboomcar_ws.zip"
    sha256: 13d752e04cba3e34116912c3903bbe194e5ca5185c304036fb0ddedb59937162
    note: "Paths are relative to the extracted yahboomcar_ws/ directory (e.g. src/yahboomcar_bringup/...)."
  ROSMASTERX3-PLUS:
    url: https://github.com/YahboomTechnology/ROSMASTERX3-PLUS
    branch: main
    revision: 9732c62247dfb57a899aea01e4fe72ed434bac6d
  docs:
    url: http://www.yahboom.net/study/ROSMASTER-X3-PLUS
  software:
    url: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU (ROSMASTER-X3Plus download) -> software.zip"
    note: >-
      Paths are relative to software/library_ws/src/: the robot image's ydlidar_ros_driver (package.xml 1.0.1) and
      orbbec-ros-sdk (package orbbec_camera, package.xml 1.2.9), the drivers the authoritative boot includes
      (laser_astrapro_bringup.launch#L4-L5). software.zip itself has no pinned hash; the cited members have sha256
      ydlidar_ros_driver/launch/TG.launch 039cdcf5b88c0cfc3b2a153c0cc73cb984f245c4e4f5de787a25010dd2c9a699,
      ydlidar_ros_driver/src/ydlidar_ros_driver.cpp bece21734020a352376261709cd7efd8f11c084433a299e84545496c1e09d055,
      orbbec-ros-sdk/launch/astraproplus.launch ae61b8204c28b4d2b57959a48aaee4cea801d0b9a408f5a4d5192877208578ba,
      orbbec-ros-sdk/src/ros_setup.cpp be1e52e92560f70002de3852b77fad845ded3b04e69f571d3470462b89f5fa6f,
      orbbec-ros-sdk/src/ob_camera_node.cpp dda5a3ba953f147995d0870dbd3fc5a5873b0ee6aa912669844495fe5df2a6bc.
  py_install:
    url: "https://drive.google.com/file/d/1SRg1aD_u8kyxxjm4vp0cFYxu8Ddj2sXU (ROSMASTER-X3Plus download) -> py_install_V3.3.9.zip"
    sha256: 1761c5873b6d1407afe5b4f4c5c4fb05787e07730448e786243071fe9e8b6ce7
    note: >-
      Rosmaster_Lib V3.3.9, the library the driver imports (Mcnamu_X3plus.py#L14). Paths are relative to py_install/;
      Rosmaster_Lib/Rosmaster_Lib.py sha256 e9fd0f6bb015cda7dba58f4db6994402d83865cc125ab33035dbb39e978b1a8c.
  usb_cam:
    url: https://github.com/ros-drivers/usb_cam
    revision: "0.3.7"
    note: >-
      Not a vendor archive: the stock usb_cam the robot installs with apt (tutorial 11.Depth camera course/01, section
      1.1.1 installs ros-melodic-usb-cam), whose launch/usb_cam-test.launch the vendor launches include. Which version
      is installed on the robot image is not established.
  orbbec_astra_series:
    url: https://www.orbbec.com/products/structured-light-camera/astra-series/
    fetched: "2026-10-11"
    note: >-
      NOT a Yahboom source: the camera maker's Astra series page, read 2026-10-11. Its specification table gives the
      series' depth range as "0.6-8m, 0.4-2m (S)" and depth "Up to 640X480@30fps", and names the Astra Pro Plus only in
      its RGB rows. No Yahboom source states the depth range; used only for the depth camera's colour scale.

boot:
  - "yahboomcar_ws:src/yahboomcar_nav/launch/laser_astrapro_bringup.launch"
boot_note: >-
  Run with `export ROBOT_TYPE=X3plus` (the launch reads $(env ROBOT_TYPE),
  yahboomcar_ws:src/yahboomcar_nav/launch/laser_astrapro_bringup.launch#L2). The vendor
  lidar course lists `roslaunch yahboomcar_nav laser_astrapro_bringup.launch  # Astra + laser +
  yahboomcar` as the robot-side start for the lidar+Astra configuration
  (https://github.com/YahboomTechnology/ROSMASTERX3-PLUS/blob/9732c62247dfb57a899aea01e4fe72ed434bac6d/12.Lidar%20course/6.gmapping%20mapping%20algorithm/6.gmapping%20mapping%20algorithm.pdf,
  section 6.2.1). It includes ydlidar_ros_driver/launch/TG.launch (#L4), orbbec_camera/launch/astraproplus.launch
  (#L5), yahboomcar_bringup/launch/bringup.launch (#L6) and a tf static_transform_publisher
  laser_link->laser every 30 ms for X3plus (#L10-L11). bringup.launch
  (yahboomcar_ws:src/yahboomcar_bringup/launch/bringup.launch#L1-L74) starts robot_state_publisher (#L10),
  the X3plus driver Mcnamu_X3plus.py as driver_node (#L19-L27), base_node as odometry_publisher (#L31-L38),
  imu_filter_madgwick (#L42-L54), robot_localization ekf_localization_node as ekf_localization (#L58-L66)
  and yahboomcar_ctrl/launch/yahboom_joy.launch (#L70: joy_node + yahboom_joy,
  yahboomcar_ws:src/yahboomcar_ctrl/launch/yahboom_joy.launch#L4-L10). ydlidar_ros_driver, orbbec_camera and the
  stock packages (robot_state_publisher, imu_filter_madgwick, robot_localization) are NOT in the pinned
  workspace (joy is vendored, src/joy); endpoints of those are listed only where the pinned workspace or pinned tutorials name them.
  Variants: laser_bringup.launch (no camera), astrapro_bringup.launch (camera, depthimage_to_laserscan
  instead of lidar), laser_usb_bringup.launch (USB mono camera) — all in yahboomcar_ws:src/yahboomcar_nav/launch/.

namespace: null
namespace_note: >-
  The authoritative single-robot boot uses global/root names (driver remaps to absolute /vel_raw,
  /imu/data_raw, /mag/mag_raw, yahboomcar_ws:src/yahboomcar_bringup/launch/bringup.launch#L24-L26) and
  offers no namespace arg. Namespacing exists only in the separate multi-robot launch
  yahboomcar_ws:src/yahboomcar_multi/launch/laser_astrapro_bringup_multi.launch#L3-L19 (group ns, default
  "robot1") with library/bringup_multi.launch setting the driver ~prefix and /<ns>/... remaps
  (yahboomcar_ws:src/yahboomcar_multi/launch/library/bringup_multi.launch#L4-L30). That is a different launch,
  so it is not treated as the authoritative interface.

link_policy: >-
  Console policy: no link budget. The user chose to see every camera and sensor of the robot at once over link
  economy, so all five camera streams and both point clouds are subscribed on validation: at their caps about
  70 Mbit/s of JSON at 640x480 for the cameras (colour and the USB camera about 20 each, depth and infrared about 13
  each, the USB JPEG about 5), plus one cloud of each kind per 5 s. No Yahboom source states what the robot's Wi-Fi
  carries (the vendor's own tutorials view the cameras through web_video_server's compressed streams on the robot,
  11.Depth camera course/01.How to use the Astra camera, section 1.4). The safety net is the console's: queue_length 1,
  the rate caps below, the page's measured link load, and the congestion pause (console spec §2.3), which stops every
  camera and both clouds when the link backs up; each card can also stop its stream.

optional_rule: >-
  A row is required when the authoritative boot advertises it unconditionally: laser_astrapro_bringup.launch#L4-L6
  includes TG.launch, astraproplus.launch and bringup.launch, and their nodes advertise these topics whatever their
  subscribers (the lidar driver /scan and /point_cloud, software:ydlidar_ros_driver/src/ydlidar_ros_driver.cpp#L55-L57;
  the Astra driver, for each stream the launch enables (enable_color/depth/ir true, astraproplus.launch#L17, #L24, #L30),
  <stream>/image_raw and a latched <stream>/camera_info (software:orbbec-ros-sdk/src/ros_setup.cpp#L211-L227), and with
  enable_point_cloud and enable_colored_point_cloud true (astraproplus.launch#L11-L12) depth/points and
  depth_registered/points (#L231-L247)). Rows of other launches (the arm's USB camera, mapping, navigation) and
  parameter infrastructure are optional.

owned_prefixes:
  - "/driver_node/"
  - "/imu/"
  - "/mag/"

topics:
  # ---- driver_node: Mcnamu_X3plus.py (vendor, pinned) ----
  - name: /cmd_vel
    type: geometry_msgs/Twist
    direction: in
    rate_hz: null
    optional: false
    source: "yahboomcar_ws:src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L37"
    note: >-
      Callback forwards linear.x, linear.y, angular.z straight to Rosmaster.set_car_motion(vx, vy, wz)
      (#L165-L177) with NO clamping in the node: the ~xlinear_speed_limit/~ylinear_speed_limit/
      ~angular_speed_limit params (0.7/0.7/3.2 for X3plus, bringup.launch#L20-L22) are read (#L34-L36) but
      never applied. Units m/s and rad/s; the Rosmaster_Lib docs state v_x, v_y in [-1.0, 1.0], v_z in
      [-5.0, 5.0] (05.Basic course/8. Control robot movement.pdf). Also published by yahboom_joy
      (yahboomcar_ws:src/yahboomcar_ctrl/scripts/yahboom_joy.py#L37).
  - name: /RGBLight
    type: std_msgs/Int32
    direction: in
    rate_hz: null
    optional: false
    source: "yahboomcar_ws:src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L38"
    note: "Light-strip effect 0..6 (0 stop, 6 battery display), #L140-L150. Also published by yahboom_joy (yahboom_joy.py#L40)."
  - name: /Buzzer
    type: std_msgs/Bool
    direction: in
    rate_hz: null
    optional: false
    source: "yahboomcar_ws:src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L39"
    note: "true = buzzer on, false = off (#L152-L163); latches until false. Also published by yahboom_joy (yahboom_joy.py#L38)."
  - name: /TargetAngle
    type: yahboomcar_msgs/ArmJoint
    direction: in
    rate_hz: null
    optional: false
    source: "yahboomcar_ws:src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L40"
    note: >-
      ArmJoint {int32 id, int32 run_time, float32 angle, float32[] joints}
      (yahboomcar_ws:src/yahboomcar_msgs/msg/ArmJoint.msg#L1-L4). If joints is non-empty all six servos go
      to joints[0..5] (degrees) over run_time ms, else servo `id` (1..6) goes to `angle` (#L107-L127).
      No range check in the node. Also published by yahboom_joy (yahboom_joy.py#L41).
  - name: /ArmAngleUpdate
    type: yahboomcar_msgs/ArmJoint
    direction: out
    rate_hz: null
    optional: false
    source: "yahboomcar_ws:src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L41"
    note: "Echo published after each /TargetAngle command (#L115, #L123); on demand. Subscribed by yahboom_joy (yahboom_joy.py#L43)."
  - name: /edition
    type: std_msgs/Float32
    direction: out
    rate_hz: 20
    optional: false
    source: "yahboomcar_ws:src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L42"
    note: "Firmware version; pub_data loop sleeps 0.05 s per iteration (#L62-L63, #L104), so <= 20 Hz."
  - name: /voltage
    type: std_msgs/Float32
    direction: out
    rate_hz: 20
    optional: false
    source: "yahboomcar_ws:src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L43"
    note: "Battery voltage (V) (#L70, #L103); <= 20 Hz loop (#L63)."
  - name: /joint_states
    type: sensor_msgs/JointState
    direction: out
    rate_hz: 20
    optional: false
    source: "yahboomcar_ws:src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L44"
    note: >-
      Names arm_joint1..5, grip_joint (#L199); positions = (commanded servo deg - 90) in rad, gripper
      servo 30..180 mapped to 0..90 first (#L204-L210). Reflects the last COMMANDED angles, not a servo
      readback. Published every pub_data loop (#L105, <= 20 Hz) and after each arm command (#L125).
      No joint_state_publisher runs (commented out, bringup.launch#L11-L14).
  - name: /vel_raw
    type: geometry_msgs/Twist
    direction: out
    rate_hz: 20
    optional: false
    source: "yahboomcar_ws:src/yahboomcar_bringup/launch/bringup.launch#L24"
    note: "Driver publishes on /pub_vel (Mcnamu_X3plus.py#L45) remapped to /vel_raw; measured vx, vy, wz from the MCU (#L74, #L92-L95); <= 20 Hz."
  - name: /imu/data_raw
    type: sensor_msgs/Imu
    direction: out
    rate_hz: 20
    optional: false
    source: "yahboomcar_ws:src/yahboomcar_bringup/launch/bringup.launch#L25"
    note: >-
      Driver /pub_imu (Mcnamu_X3plus.py#L46) remapped to /imu/data_raw; frame imu_link (param bringup.launch#L23,
      set at Mcnamu_X3plus.py#L78); accel + gyro only, no orientation (#L77-L84); <= 20 Hz. (The state-estimation tutorial text
      says /imu/imu_raw, which is the remap used by yahboomcar.launch#L20, not by bringup.launch.)
  - name: /mag/mag_raw
    type: sensor_msgs/MagneticField
    direction: out
    rate_hz: 20
    optional: false
    source: "yahboomcar_ws:src/yahboomcar_bringup/launch/bringup.launch#L26"
    note: "Driver /pub_mag (Mcnamu_X3plus.py#L47) remapped; frame imu_link (#L85-L89); <= 20 Hz. Not consumed (imu filter use_mag=false, bringup.launch#L44)."
  - name: /driver_node/parameter_descriptions
    type: dynamic_reconfigure/ConfigDescription
    direction: out
    rate_hz: null
    optional: true
    source: "yahboomcar_ws:src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L49"
    note: "dynamic_reconfigure server for PIDparam.cfg (yahboomcar_ws:src/yahboomcar_bringup/cfg/PIDparam.cfg#L1-L20). Parameter infrastructure; listed only because /driver_node/ is an owned prefix."
  - name: /driver_node/parameter_updates
    type: dynamic_reconfigure/Config
    direction: out
    rate_hz: null
    optional: true
    source: "yahboomcar_ws:src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L49"
  # ---- odometry_publisher: base_node (vendor, pinned) ----
  - name: /odom_raw
    type: nav_msgs/Odometry
    direction: out
    rate_hz: 20
    optional: false
    source: "yahboomcar_ws:src/yahboomcar_bringup/launch/bringup.launch#L37"
    note: >-
      base_node advertises /pub_odom (yahboomcar_ws:src/yahboomcar_bringup/src/base.cpp#L22) remapped to
      /odom_raw; one message per /vel_raw (subscribed as /sub_vel, base.cpp#L21, remap bringup.launch#L36;
      publish base.cpp#L73), frame odom -> base_footprint (bringup.launch#L32-L33). base_node broadcasts no tf.
  # ---- imu_filter_madgwick (stock package, launched at bringup.launch#L42) ----
  - name: /imu/data
    type: sensor_msgs/Imu
    direction: out
    rate_hz: 20
    optional: false
    source: "yahboomcar_ws:src/yahboomcar_bringup/launch/bringup.launch#L42"
    note: >-
      Stock imu_filter_madgwick subscribes imu/data_raw and publishes imu/data (the /sub_imu,/pub_imu remaps
      at #L50-L53 match nothing in that node); topic table in the vendor tutorial
      (10.Robot control course/6.Robot state estimation, section 6.1.3). Consumed by the ekf as /imu0 ->
      /imu/data (#L60). Rate follows /imu/data_raw.
  # ---- ekf_localization (stock robot_localization, bringup.launch#L58) ----
  - name: /odom
    type: nav_msgs/Odometry
    direction: out
    rate_hz: 20
    optional: false
    source: "yahboomcar_ws:src/yahboomcar_bringup/launch/bringup.launch#L59"
    note: >-
      ekf output odometry/filtered remapped to odom; frequency 20
      (yahboomcar_ws:src/yahboomcar_bringup/param/robot_localization.yaml#L4); fuses /odom_raw (remap #L61)
      and /imu/data (remap #L60); frames odom -> base_footprint (#L62-L64). Topic table in tutorial
      10.Robot control course/6.Robot state estimation, section 6.1.4.
  - name: /tf
    type: tf2_msgs/TFMessage
    direction: out
    rate_hz: null
    optional: false
    source: "yahboomcar_ws:src/yahboomcar_bringup/launch/bringup.launch#L58"
    note: >-
      Aggregate: ekf odom->base_footprint (publish_tf default true, robot_localization.yaml#L37-L38; 20 Hz),
      robot_state_publisher movable arm joints from /joint_states (bringup.launch#L10; URDF
      yahboomcar_ws:src/yahboomcar_description/urdf/yahboomcar_X3plus.urdf#L138-L319), and tf
      static_transform_publisher laser_link->laser every 30 ms
      (yahboomcar_ws:src/yahboomcar_nav/launch/laser_astrapro_bringup.launch#L10-L11). No single rate.
  - name: /tf_static
    type: tf2_msgs/TFMessage
    direction: out
    rate_hz: null
    optional: false
    source: "yahboomcar_ws:src/yahboomcar_bringup/launch/bringup.launch#L10"
    note: "Latched; stock robot_state_publisher fixed joints base_joint, base_imu, astra_joint, laser_joint, mono_joint (yahboomcar_X3plus.urdf#L33, #L38, #L71, #L104, #L510)."
  # ---- yahboom_joy.launch (bringup.launch#L70) ----
  - name: /joy
    type: sensor_msgs/Joy
    direction: out
    rate_hz: null
    optional: false
    source: "yahboomcar_ws:src/joy/src/joy_node.cpp#L307"
    note: "Advertised unconditionally by joy_node (yahboom_joy.launch#L4); publishes only on gamepad events (autorepeat_rate default 0, joy_node.cpp#L313). Subscribed by yahboom_joy (yahboom_joy.py#L42)."
  - name: /joy/set_feedback
    type: sensor_msgs/JoyFeedbackArray
    direction: in
    rate_hz: null
    optional: true
    source: "yahboomcar_ws:src/joy/src/joy_node.cpp#L308"
  - name: /diagnostics
    type: diagnostic_msgs/DiagnosticArray
    direction: out
    rate_hz: null
    optional: true
    source: "yahboomcar_ws:src/joy/src/joy_node.cpp#L82"
    note: "joy_node diagnostic_updater; the ekf also prints diagnostics (robot_localization.yaml#L27)."
  - name: /JoyState
    type: std_msgs/Bool
    direction: out
    rate_hz: null
    optional: false
    source: "yahboomcar_ws:src/yahboomcar_ctrl/scripts/yahboom_joy.py#L39"
    note: "Published only on the gamepad cancel gesture (#L264-L277)."
  - name: /move_base/cancel
    type: actionlib_msgs/GoalID
    direction: out
    rate_hz: null
    optional: false
    source: "yahboomcar_ws:src/yahboomcar_ctrl/scripts/yahboom_joy.py#L36"
    note: "Advertised by yahboom_joy (relative move_base/cancel); publishes only on the gamepad cancel gesture (#L275). Also subscribed by move_base when navigation runs."
  # ---- lidar: ydlidar_ros_driver TG.launch (robot image's software archive, included at laser_astrapro_bringup.launch#L4) ----
  - name: /scan
    type: sensor_msgs/LaserScan
    direction: out
    rate_hz: 10
    optional: false
    source: "software:ydlidar_ros_driver/src/ydlidar_ros_driver.cpp#L55"
    note: >-
      Advertised unconditionally (#L55), published every scan (#L238) in a 10 Hz loop (#L169), frame laser
      (TG.launch#L2, #L6). TG.launch sets angle_min/max -85/85 deg, range_min 0.01 m, range_max 50 m, frequency 10 Hz
      and invalid_range_is_inf true (software:ydlidar_ros_driver/launch/TG.launch#L28, #L32-L36): the ranges array has
      one slot per angle_increment, +inf where there is no return (ydlidar_ros_driver.cpp#L199-L202). The tutorial's
      printed copy of TG.launch shows -90/90 (12.Lidar course/1.Lidar basics-EAI, section 1.4). Workspace consumer:
      yahboomcar_ws:src/yahboomcar_laser/scripts/laser_Avoidance.py#L30.
  - name: /point_cloud
    type: sensor_msgs/PointCloud
    direction: out
    rate_hz: 10
    optional: false
    source: "software:ydlidar_ros_driver/src/ydlidar_ros_driver.cpp#L56-L57"
    note: >-
      Advertised unconditionally beside /scan (#L56-L57) and published with every scan (#L239): the returns within
      range_min..range_max as points (z 0) with channels intensities and stamps, frame laser (#L183, #L204-L231).
  # ---- Astra Pro Plus: orbbec_camera astraproplus.launch (robot image's software archive, laser_astrapro_bringup.launch#L5) ----
  - name: /camera/rgb/image_raw
    type: sensor_msgs/Image
    direction: out
    rate_hz: 30
    optional: false
    source: "software:orbbec-ros-sdk/src/ros_setup.cpp#L217-L223"
    note: >-
      The colour stream's /camera/color/image_raw (ros_setup.cpp#L217-L223), remapped to /camera/rgb/image_raw
      (software:orbbec-ros-sdk/launch/astraproplus.launch#L90); rgb8 (ros_setup.cpp#L18), the camera's MJPG converted
      (astraproplus.launch#L18; software:orbbec-ros-sdk/src/ob_camera_node.cpp#L418-L428), 640x480 at 30 fps requested
      (astraproplus.launch#L14-L16). Plain ros::Publisher, not image_transport, so no /compressed subtopics; the
      device pipeline starts with the first image subscriber and stops with the last (ob_camera_node.cpp#L535-L589).
      Vendor consumers: yahboomcar_ws:src/yahboomcar_astra/src/KCF_Tracker.cpp#L51; tutorial 09.OpenCV courses/8,
      section 8.2.1.
  - name: /camera/rgb/camera_info
    type: sensor_msgs/CameraInfo
    direction: out
    rate_hz: null
    optional: false
    source: "software:orbbec-ros-sdk/src/ros_setup.cpp#L224-L226"
    note: >-
      Latched, beside the colour image (ros_setup.cpp#L224-L226; remap astraproplus.launch#L91), republished with each
      frame (software:orbbec-ros-sdk/src/ob_camera_node.cpp#L462-L474). Vendor consumer:
      yahboomcar_ws:src/yahboomcar_nav/launch/library/rtabmap_nav.launch#L57.
  - name: /camera/depth/image_raw
    type: sensor_msgs/Image
    direction: out
    rate_hz: 30
    optional: false
    source: "software:orbbec-ros-sdk/src/ros_setup.cpp#L217-L223"
    note: >-
      16UC1 (ros_setup.cpp#L11), the device values times their scale (software:orbbec-ros-sdk/src/ob_camera_node.cpp#L450-L453),
      i.e. millimetres at the default depth_precision 1mm (#L96); 640x480 at 30 fps requested (astraproplus.launch#L21-L24).
      Vendor consumers: yahboomcar_ws:src/yahboomcar_visual/src/astra_depth_image.cpp#L17 (TYPE_16UC1),
      yahboomcar_ws:src/yahboomcar_astra/src/KCF_Tracker.cpp#L52, #L144 (as 32FC1, divided by 1000 for metres, #L153-L157),
      yahboomcar_ws:src/yahboomcar_nav/launch/library/depthimage_to_laserscan.launch#L4.
  - name: /camera/depth/camera_info
    type: sensor_msgs/CameraInfo
    direction: out
    rate_hz: null
    optional: false
    source: "software:orbbec-ros-sdk/src/ros_setup.cpp#L224-L226"
    note: "Latched, beside the depth image. Vendor consumer: yahboomcar_ws:src/yahboomcar_nav/launch/library/depthimage_to_laserscan.launch#L5."
  - name: /camera/ir/image_raw
    type: sensor_msgs/Image
    direction: out
    rate_hz: 30
    optional: false
    source: "software:orbbec-ros-sdk/src/ros_setup.cpp#L217-L223"
    note: >-
      mono16 (ros_setup.cpp#L25), the sensor's Y10 format (astraproplus.launch#L31), 640x480 at 30 fps requested,
      enable_ir true (astraproplus.launch#L27-L30). Advertised at start-up; if the pipeline then fails to start with IR,
      the driver retries without it and the topic stays advertised but silent
      (software:orbbec-ros-sdk/src/ob_camera_node.cpp#L116-L124). Vendor consumer:
      yahboomcar_ws:src/yahboomcar_visual/src/IR_transform.cpp#L35.
  - name: /camera/ir/camera_info
    type: sensor_msgs/CameraInfo
    direction: out
    rate_hz: null
    optional: false
    source: "software:orbbec-ros-sdk/src/ros_setup.cpp#L224-L226"
    note: "Latched, beside the IR image."
  - name: /camera/depth/points
    type: sensor_msgs/PointCloud2
    direction: out
    rate_hz: null
    optional: false
    source: "software:orbbec-ros-sdk/src/ros_setup.cpp#L231-L238"
    note: >-
      Computed only while it has a subscriber (software:orbbec-ros-sdk/src/ob_camera_node.cpp#L220-L223), and a
      subscriber starts the depth stream (#L591-L594): fields xyz (point_step 16), height 1, width = the valid points,
      is_dense true, frame camera_depth_optical_frame (#L248-L279). Vendor consumer:
      yahboomcar_ws:src/yahboomcar_visual/scripts/sub_point.py#L16; tutorial 09.OpenCV courses/10, section 10.2.1.
  - name: /camera/depth_registered/points
    type: sensor_msgs/PointCloud2
    direction: out
    rate_hz: null
    optional: false
    source: "software:orbbec-ros-sdk/src/ros_setup.cpp#L239-L247"
    note: >-
      Computed only while it has a subscriber (software:orbbec-ros-sdk/src/ob_camera_node.cpp#L295-L298), which starts
      the depth and colour streams (#L604-L608): fields xyz + rgb (point_step 20), height 1, width = the valid points,
      is_dense true, frame camera_color_optical_frame (#L323-L375). Vendor rviz configs show it
      (yahboomcar_ws:src/yahboomcar_nav/rviz/yahboomcar_map.rviz#L126); tutorial 09.OpenCV courses/10, section 10.2.1.
  # ---- optional: mapping / navigation (separate launches) ----
  - name: /map
    type: nav_msgs/OccupancyGrid
    direction: out
    rate_hz: null
    optional: true
    source: "yahboomcar_ws:src/yahboomcar_nav/launch/library/gmapping.launch#L13"
    note: "slam_gmapping (yahboomcar_map.launch map_type:=gmapping) or map_server in navigation; topic table in the gmapping tutorial section 6.2."
  - name: /map_metadata
    type: nav_msgs/MapMetaData
    direction: out
    rate_hz: null
    optional: true
    source: "yahboomcar_ws:src/yahboomcar_nav/launch/library/gmapping.launch#L13"
  - name: /slam_gmapping/entropy
    type: std_msgs/Float64
    direction: out
    rate_hz: null
    optional: true
    source: "yahboomcar_ws:src/yahboomcar_nav/launch/library/gmapping.launch#L13"
    note: "Private ~entropy of the node named slam_gmapping (gmapping tutorial section 6.2)."

services:
  - name: /CurrentAngle
    type: yahboomcar_msgs/RobotArmArray
    optional: false
    source: "yahboomcar_ws:src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L48"
    note: "Request {string apply}, response {float64[] angles} (yahboomcar_ws:src/yahboomcar_msgs/srv/RobotArmArray.srv#L1-L5); reads the six servo angles in degrees, -1 on read error (#L129-L138)."
  - name: /driver_node/set_parameters
    type: dynamic_reconfigure/Reconfigure
    optional: true
    source: "yahboomcar_ws:src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L49"
    note: "PIDparam dynamic_reconfigure; SetArmjoint=true moves all six servos (#L220-L223). Not exposed as a control."
  - name: /dynamic_map
    type: nav_msgs/GetMap
    optional: true
    source: "yahboomcar_ws:src/yahboomcar_nav/launch/library/gmapping.launch#L13"
    note: "slam_gmapping service (gmapping tutorial section 6.2); mapping launch only."

actions:
  - name: /move_base
    type: move_base_msgs/MoveBaseAction
    optional: true
    source: "yahboomcar_ws:src/yahboomcar_nav/launch/library/move_base.launch#L6"
    note: "Navigation launch only (yahboomcar_navigation.launch)."

cameras:
  # The page's camera list (console spec §2.3). One more stream is one more row here: a row whose topic (or
  # camera_info) has no `topics` row declares that out topic itself (optional as the camera is).
  # Bandwidth: every frame crosses the same rosbridge websocket as /cmd_vel and its single zero-Twist stop, on a base
  # with no watchdog (see `watchdog`), as base64 JSON (a 640x480 rgb8 frame is about 1.2 MB; 16-bit, about 0.8 MB).
  # So this profile caps every raw stream at 2 frames/s (below the console default, for that reason) and the console
  # always asks for queue_length 1. Every stream starts on validation (see link_policy); any Astra subscription starts
  # the driver's whole pipeline anyway (software:orbbec-ros-sdk/src/ob_camera_node.cpp#L538-L544).
  - topic: /camera/rgb/image_raw
    type: sensor_msgs/Image
    encodings: [rgb8]
    rate_hz: 30
    max_rate_hz: 2
    stale_after_s: 2.0
    optional: false
    camera_info: /camera/rgb/camera_info
    source: "software:orbbec-ros-sdk/src/ros_setup.cpp#L18"
    policy: >-
      The Astra Pro Plus colour stream, rgb8 (ros_setup.cpp#L18) at 30 fps requested (astraproplus.launch#L16).
      Console policy: max_rate_hz 2 (about 20 Mbit/s of JSON at 640x480), lower than the console default because this
      base's only stop is one zero Twist on the same link and it has no watchdog; stale_after_s 2.0 s.
  - topic: /camera/depth/image_raw
    type: sensor_msgs/Image
    kind: depth
    encodings: [16UC1]
    unit_m: 0.001
    range_m: [0.6, 8.0]
    rate_hz: 30
    max_rate_hz: 2
    stale_after_s: 2.0
    optional: false
    camera_info: /camera/depth/camera_info
    caption: >-
      Registered to the colour image by the camera (stamped camera_color_optical_frame); its camera_info carries the
      camera parameters the SDK gives after that registration (D2C), so it describes this aligned image.
    source: "software:orbbec-ros-sdk/src/ros_setup.cpp#L11"
    policy: >-
      The Astra Pro Plus depth stream: 16UC1 (ros_setup.cpp#L11). Each value is the device value times the frame's
      getValueScale (software:orbbec-ros-sdk/src/ob_camera_node.cpp#L450-L453), giving millimetres: the vendor's
      KCF_Tracker divides it by 1000 for metres (yahboomcar_ws:src/yahboomcar_astra/src/KCF_Tracker.cpp#L144, #L153-L157),
      so unit_m = 0.001. (The depth_precision parameter is applied only to a Gemini2, software:orbbec-ros-sdk/src/ros_setup.cpp#L92-L97.)
      Registered to colour in hardware: astraproplus.launch enables the coloured point cloud
      (software:orbbec-ros-sdk/launch/astraproplus.launch#L12), which forces depth_registration (ob_camera_node.cpp#L98-L100),
      so the pipeline aligns depth to colour (ALIGN_D2C_HW_MODE, ros_setup.cpp#L271-L272) and the depth and infrared
      images are stamped camera_color_optical_frame (ob_camera_node.cpp#L483-L484). Its camera_info is built from the
      depth intrinsics of camera_params_ (ob_camera_node.cpp#L463-L466), which with depth_registration on come from
      pipeline_->getCameraParam() (#L455-L456); the SDK documents that this returns the camera parameters after D2C when
      D2C is enabled (software:orbbec-ros-sdk/SDK/include/libobsensor/hpp/Pipeline.hpp#L129). range_m 0.6-8 m is the camera maker's figure,
      not a Yahboom one (orbbec_astra_series), used only to scale the colours. Console policy: at most 2 frames/s
      (about 1.6 MB/s of JSON), stale_after_s 2.0 s.
  - topic: /camera/ir/image_raw
    type: sensor_msgs/Image
    kind: ir
    encodings: [mono16]
    rate_hz: 30
    max_rate_hz: 2
    stale_after_s: 2.0
    optional: true
    camera_info: /camera/ir/camera_info
    caption: >-
      Not aligned to colour, but its camera_info is the depth intrinsics the SDK gives after D2C, so it does not
      describe this image's own geometry.
    silent_note: >-
      The Astra driver keeps this topic advertised when its pipeline could not start with the infrared stream and
      restarted without it, so a robot can have no infrared frames at all.
    source: "software:orbbec-ros-sdk/src/ros_setup.cpp#L25"
    policy: >-
      The Astra Pro Plus infrared stream, mono16 (ros_setup.cpp#L25). The page draws it as the vendor's IR viewer does,
      each frame normalised from its minimum to its maximum (yahboomcar_ws:src/yahboomcar_visual/src/IR_transform.cpp#L19-L26).
      Its camera_info comes from the same camera_params_ as depth (ob_camera_node.cpp#L459-L466: the depth intrinsics,
      after D2C since depth_registration is on, #L455-L456), while the IR image itself is not aligned to colour.
      Optional camera (its frames, not its topic): when the pipeline fails with IR the driver restarts it without IR and
      leaves the topic advertised (software:orbbec-ros-sdk/src/ob_camera_node.cpp#L116-L124), hence silent_note. Stamped
      camera_color_optical_frame like depth (#L483-L484). Console policy: at most 2 frames/s, stale_after_s 2.0 s.
  - topic: /usb_cam/image_raw
    type: sensor_msgs/Image
    encodings: [rgb8]
    rate_hz: 30
    max_rate_hz: 2
    stale_after_s: 2.0
    optional: true
    camera_info: /usb_cam/camera_info
    missing_note: >-
      The arm's USB camera is started by laser_usb_bringup.launch or the vendor vision launches, not by the boot this
      profile follows (laser_astrapro_bringup.launch).
    source: "yahboomcar_ws:src/yahboomcar_nav/launch/laser_usb_bringup.launch#L5"
    policy: >-
      The USB camera on the arm's wrist (URDF mono_link on arm_link4,
      yahboomcar_ws:src/yahboomcar_description/urdf/yahboomcar_X3plus.urdf#L510-L514), declared by this row with its
      CameraInfo. usb_cam-test.launch, included by laser_usb_bringup.launch#L5, runs node /usb_cam at 640x480 yuyv, frame
      usb_cam (usb_cam:launch/usb_cam-test.launch#L2-L9); the node publishes rgb8 (usb_cam:src/usb_cam.cpp#L1252-L1256) in
      a 30 Hz loop (usb_cam:nodes/usb_cam_node.cpp#L101, #L258) whether or not anyone subscribes, and an uncalibrated
      camera_info (#L127-L136). The authoritative boot does not start it, so it is optional; its real frame rate is not
      established. The node publishes through image_transport, so its JPEG topic /usb_cam/image_raw/compressed is the next
      camera row (a tenth of this one's load). Console policy: at most 2 frames/s, stale_after_s 2.0 s.
  - topic: /usb_cam/image_raw/compressed
    type: sensor_msgs/CompressedImage
    encodings: [jpeg]
    rate_hz: 30
    max_rate_hz: 5
    stale_after_s: 2.0
    optional: true
    missing_note: >-
      The arm's USB camera is started by laser_usb_bringup.launch or the vendor vision launches, not by the boot this
      profile follows (laser_astrapro_bringup.launch).
    caption: "The arm's USB camera as JPEG (image_transport's compressed plugin): about a tenth of the raw stream's load on the link."
    source: "usb_cam:nodes/usb_cam_node.cpp#L88-L89"
    policy: >-
      usb_cam advertises its image through image_transport (it.advertiseCamera("image_raw"), usb_cam_node.cpp#L88-L89), so
      with image_transport's compressed plugin installed it also publishes sensor_msgs/CompressedImage JPEG on
      /usb_cam/image_raw/compressed. Evidence that the plugin is on Yahboom's image: the tutorial's `rostopic list` on it
      shows image_transport's compressed and compressedDepth subtopics (09.OpenCV courses/8. ROS+Opencv foundation,
      section 8.2.1), and the vendor's own vision apps read this topic
      (yahboomcar_ws:src/yahboomcar_voice_ctrl/scripts/colorHSV.py#L45, #L54-L57;
      yahboomcar_ws:src/yahboomcar_linefollw/launch/line.launch#L6). Optional like the raw stream (the boot does not start
      usb_cam). The browser decodes the JPEG. Console policy: at most 5 frames/s, stale_after_s 2.0 s: the
      compressed-stream exception to the wheeled bases' 2 frames/s (console spec §2.3). Its nominal load at 5 frames/s,
      about 4.9 Mbit/s at 640x480, is a quarter of one raw stream's at 2 frames/s (about 19.7 Mbit/s), and a frame
      occupies a 20 Mbit/s link for about 0.05 s instead of 0.5 s, so the stop waits behind less.
stamps_note: >-
  The Astra driver stamps every image with the SDK frame's systemTimeStamp() converted straight to a ros::Time
  (software:orbbec-ros-sdk/src/ob_camera_node.cpp#L454, software:orbbec-ros-sdk/src/utils.cpp#L217-L223), which the SDK
  describes as "on host clock domain" (software:orbbec-ros-sdk/SDK/include/libobsensor/hpp/Frame.hpp#L105); whether that
  host clock is the ROS clock rosapi reports is not established. usb_cam stamps with ros::Time::now()
  (usb_cam:src/usb_cam.cpp#L1240). A stream whose frames sit at a steady offset of more than 2 s behind the robot's
  clock is shown LAGGING, never live, with the note that this is either a real delay or stamps on another clock: the
  console cannot tell the two apart (console spec §2.3).
cameras_note: >-
  The first three streams come from the Astra Pro Plus that the authoritative boot starts (astraproplus.launch, included
  at laser_astrapro_bringup.launch#L5); the fourth is the arm's USB camera, present only when a launch that starts usb_cam
  runs.

sensors:
  # Read-only vendor data the view page shows (console spec §2.5). Each topic is an out topic above.
  - id: battery
    label: "Battery (/voltage)"
    topic: /voltage
    type: std_msgs/Float32
    stale_after_s: 1.0
    source: "yahboomcar_ws:src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L70"
    note: >-
      Rosmaster.get_battery_voltage() in volts (#L70, published #L103) every pub_data loop (<= 20 Hz, #L63): one byte of
      the board's speed report (py_install:Rosmaster_Lib/Rosmaster_Lib.py#L147) divided by 10 (#L1150-L1151), so 0.1 V
      steps; shown to 0.1 V. The library starts the value at 0 (#L114) and only a board report changes it, so 0.0 V
      means "no reading", not an empty battery. warn_below 9.6 V: below it the expansion board's buzzer alarms and the
      battery must be charged (01.Preparation and First Trial/2. Precautions for battery, item 5).
    fields:
      - {name: voltage, label: "Battery voltage", path: data, kind: number, unit: "V", decimals: 1, headline: true, warn_below: 9.6, no_reading: [0], no_reading_label: "no reading (the board has not reported a voltage)"}
  - id: imu_raw
    label: "IMU raw (/imu/data_raw)"
    topic: /imu/data_raw
    type: sensor_msgs/Imu
    stale_after_s: 1.0
    caption: >-
      No unit is shown: it depends on the expansion board. Rosmaster_Lib scales an MPU9250 board to rad/s and m/s²,
      but only divides an ICM20948 board's readings by 1000, in a unit no source states.
    source: "yahboomcar_ws:src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L77-L84"
    note: >-
      Accelerometer and gyroscope from the MCU (#L71-L72, #L79-L84) with no orientation (left all zero); frame imu_link.
      Units by board (py_install:Rosmaster_Lib/Rosmaster_Lib.py): MPU9250 report, gyro / 3754.9 = rad/s at +-500 deg/s and
      accel / 1671.84 = m/s² at +-2 g (#L150-L160); ICM20948 report (expansion board V3.0), each / 1000 (#L168-L177), whose
      unit the firmware sets and no source states (the vendor's ICM20948 hardware course converts to deg/s and g,
      04.Hardware course/11, ICM20948 edition, but that is a teaching sample). So no unit is shown.
    fields:
      - {name: linear_acceleration, label: "Acceleration", path: linear_acceleration, kind: vector3, decimals: 3}
      - {name: angular_velocity, label: "Angular velocity", path: angular_velocity, kind: vector3, decimals: 3}
  - id: imu
    label: "IMU filtered (/imu/data)"
    topic: /imu/data
    type: sensor_msgs/Imu
    stale_after_s: 1.0
    caption: >-
      Orientation is the filter's, in degrees, of the IMU frame imu_link, which the URDF mounts upside down and turned
      90 deg (rpy 0, 3.1415, 1.5707), so a level robot can read roll near 180 deg; it is also shown re-expressed for
      base_link through that mount. Rates and acceleration are the raw IMU's, unit by board as above.
    source: "yahboomcar_ws:src/yahboomcar_bringup/launch/bringup.launch#L42"
    note: >-
      imu_filter_madgwick (use_mag false, #L44) fuses /imu/data_raw into an orientation of imu_link and passes its angular
      velocity and acceleration on, so those carry the raw unit; tutorial 10.Robot control course/6, section 6.1.3.
      imu_link is mounted on base_link by joint base_imu at rpy 0 3.1415 1.5707
      (yahboomcar_ws:src/yahboomcar_description/urdf/yahboomcar_X3plus.urdf#L38-L42); the base_link orientation field is
      q_imu * conj(q_mount). Whether the physical board's axes match that URDF mount is not established.
    fields:
      - {name: orientation, label: "Orientation (imu_link)", path: orientation, kind: rpy, decimals: 1}
      - {name: orientation_base, label: "Orientation (base_link, via the URDF mount)", path: orientation, kind: rpy, decimals: 1, mount_rpy: [0, 3.1415, 1.5707]}
      - {name: angular_velocity, label: "Angular velocity", path: angular_velocity, kind: vector3, decimals: 3}
      - {name: linear_acceleration, label: "Acceleration", path: linear_acceleration, kind: vector3, decimals: 3}
  - id: mag
    label: "Magnetometer (/mag/mag_raw)"
    topic: /mag/mag_raw
    type: sensor_msgs/MagneticField
    stale_after_s: 1.0
    caption: "Raw readings: not Tesla, and no source states the unit."
    source: "yahboomcar_ws:src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L85-L89"
    note: "Rosmaster.get_magnetometer_data() (#L73, #L87-L89): raw counts on an MPU9250 board, counts / 1000 on an ICM20948 board (py_install:Rosmaster_Lib/Rosmaster_Lib.py#L162-L165, #L179-L182)."
    fields:
      - {name: magnetic_field, label: "Field", path: magnetic_field, kind: vector3, decimals: 3}
  - id: vel_raw
    label: "Measured velocity (/vel_raw)"
    topic: /vel_raw
    type: geometry_msgs/Twist
    stale_after_s: 1.0
    source: "yahboomcar_ws:src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L92-L95"
    note: >-
      Rosmaster.get_motion_data() (#L74): the board's vx, vy, vz as int16 / 1000 (py_install:Rosmaster_Lib/Rosmaster_Lib.py#L144-L146),
      published on /pub_vel remapped to /vel_raw (bringup.launch#L24). m/s and rad/s are the units /cmd_vel commands in
      (the same board kinematics, Mcnamu_X3plus.py#L171-L177).
    fields:
      - {name: vx, label: "vx", path: linear.x, kind: number, unit: "m/s", decimals: 3}
      - {name: vy, label: "vy", path: linear.y, kind: number, unit: "m/s", decimals: 3}
      - {name: wz, label: "wz", path: angular.z, kind: number, unit: "rad/s", decimals: 3}
  - id: odom_raw
    label: "Wheel odometry (/odom_raw)"
    topic: /odom_raw
    type: nav_msgs/Odometry
    stale_after_s: 1.0
    source: "yahboomcar_ws:src/yahboomcar_bringup/src/base.cpp#L29-L73"
    caption: "Linear velocities are /vel_raw's scaled by 1.1 (x) and 0.95 (y), so they differ from it; the heading rate is not scaled."
    note: >-
      base_node integrates /vel_raw after scaling it: vx by linear_scale_x, vy by linear_scale_y (base.cpp#L32-L33), which
      the boot sets to 1.1 and 0.95 (yahboomcar_ws:src/yahboomcar_bringup/launch/bringup.launch#L34-L35); wz unscaled (#L34).
      Position x, y in m (#L38-L44, #L53-L55), heading as a yaw quaternion (#L47, #L57), twist = the scaled velocities
      (#L62-L68).
    fields:
      - {name: x, label: "x", path: pose.pose.position.x, kind: number, unit: "m", decimals: 3, group: pose}
      - {name: y, label: "y", path: pose.pose.position.y, kind: number, unit: "m", decimals: 3, group: pose}
      - {name: orientation, label: "Orientation", path: pose.pose.orientation, kind: rpy, decimals: 1, group: pose}
      - {name: vx, label: "vx (×1.1)", path: twist.twist.linear.x, kind: number, unit: "m/s", decimals: 3, group: twist}
      - {name: vy, label: "vy (×0.95)", path: twist.twist.linear.y, kind: number, unit: "m/s", decimals: 3, group: twist}
      - {name: wz, label: "wz", path: twist.twist.angular.z, kind: number, unit: "rad/s", decimals: 3, group: twist}
  - id: odom
    label: "Fused odometry (/odom)"
    topic: /odom
    type: nav_msgs/Odometry
    stale_after_s: 1.0
    source: "yahboomcar_ws:src/yahboomcar_bringup/launch/bringup.launch#L59"
    note: "robot_localization ekf output at 20 Hz (yahboomcar_ws:src/yahboomcar_bringup/param/robot_localization.yaml#L4) fusing /odom_raw and /imu/data (bringup.launch#L60-L61); tutorial 10.Robot control course/6, section 6.1.4."
    fields:
      - {name: x, label: "x", path: pose.pose.position.x, kind: number, unit: "m", decimals: 3, group: pose}
      - {name: y, label: "y", path: pose.pose.position.y, kind: number, unit: "m", decimals: 3, group: pose}
      - {name: orientation, label: "Orientation", path: pose.pose.orientation, kind: rpy, decimals: 1, group: pose}
      - {name: vx, label: "vx", path: twist.twist.linear.x, kind: number, unit: "m/s", decimals: 3, group: twist}
      - {name: vy, label: "vy", path: twist.twist.linear.y, kind: number, unit: "m/s", decimals: 3, group: twist}
      - {name: wz, label: "wz", path: twist.twist.angular.z, kind: number, unit: "rad/s", decimals: 3, group: twist}
  - id: scan
    label: "Lidar (/scan)"
    topic: /scan
    type: sensor_msgs/LaserScan
    stale_after_s: 1.0
    plot: scan
    source: "software:ydlidar_ros_driver/src/ydlidar_ros_driver.cpp#L175-L238"
    note: >-
      The YDLIDAR 4ROS through TG.launch: 10 Hz, frame laser, -85..85 deg, range 0.01-50 m, +inf where there is no return
      (software:ydlidar_ros_driver/launch/TG.launch#L28, #L32-L36). The laser frame is laser_link turned by 6.28 rad
      (yahboomcar_ws:src/yahboomcar_nav/launch/laser_astrapro_bringup.launch#L10-L11), i.e. the chassis' axes to 0.2 deg
      (laser_joint rpy 0, yahboomcar_ws:src/yahboomcar_description/urdf/yahboomcar_X3plus.urdf#L104-L108), so the plot's up
      is the robot's front.
    fields:
      - {name: frame_id, label: "Frame", path: header.frame_id, kind: text}
      - {name: returns, label: "Ranges", path: ranges, kind: count}
      - {name: angle_min, label: "Angle min", path: angle_min, kind: number, unit: "rad", decimals: 3}
      - {name: angle_max, label: "Angle max", path: angle_max, kind: number, unit: "rad", decimals: 3}
      - {name: range_min, label: "Range min", path: range_min, kind: number, unit: "m", decimals: 2}
      - {name: range_max, label: "Range max", path: range_max, kind: number, unit: "m", decimals: 2}
  - id: lidar_points
    label: "Lidar points (/point_cloud)"
    topic: /point_cloud
    type: sensor_msgs/PointCloud
    stale_after_s: 3.0
    throttle_s: 1.0
    source: "software:ydlidar_ros_driver/src/ydlidar_ros_driver.cpp#L221-L231"
    policy: >-
      The lidar's in-range returns as points, frame laser; the driver publishes it with every scan whether or not anyone
      subscribes (#L239), so subscribing adds no work on the robot. Console policy: at most one message a second over the
      websocket, shown by its point count; stale after 3 s.
    fields:
      - {name: frame_id, label: "Frame", path: header.frame_id, kind: text}
      - {name: points, label: "Points", path: points, kind: count}
  - id: joint_states
    label: "Arm joint states (/joint_states)"
    topic: /joint_states
    type: sensor_msgs/JointState
    stale_after_s: 1.0
    source: "yahboomcar_ws:src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L194-L211"
    note: "The driver's echo of the last commanded servo angles in rad (servo deg - 90; gripper 30..180 deg first mapped to 0..90), names arm_joint1..5, grip_joint (#L199); not a servo readback."
    fields:
      - {name: arm_joint1, label: "arm_joint1", path: position.0, kind: number, unit: "rad", decimals: 3}
      - {name: arm_joint2, label: "arm_joint2", path: position.1, kind: number, unit: "rad", decimals: 3}
      - {name: arm_joint3, label: "arm_joint3", path: position.2, kind: number, unit: "rad", decimals: 3}
      - {name: arm_joint4, label: "arm_joint4", path: position.3, kind: number, unit: "rad", decimals: 3}
      - {name: arm_joint5, label: "arm_joint5", path: position.4, kind: number, unit: "rad", decimals: 3}
      - {name: grip_joint, label: "grip_joint", path: position.5, kind: number, unit: "rad", decimals: 3}
  - id: arm_angle_update
    label: "Arm command echo (/ArmAngleUpdate)"
    topic: /ArmAngleUpdate
    type: yahboomcar_msgs/ArmJoint
    stale_after_s: null
    event_only: true
    source: "yahboomcar_ws:src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L107-L124"
    note: >-
      An ordinary (not latched) publisher (#L41) that publishes only after a /TargetAngle command, twice per command
      (its loops at #L112-L116 and #L120-L124): event-only, so waiting for it is normal and it is never stale. A single-servo command echoes id and angle (deg,
      #L118-L119); an all-servo command echoes `joints`, which the driver fills with the servo angles held BEFORE
      the command (#L111), in degrees, servo order 1..6. run_time is not set by the driver.
    fields:
      - {name: id, label: "Servo id", path: id, kind: number, decimals: 0}
      - {name: angle, label: "Angle", path: angle, kind: number, unit: "deg", decimals: 1}
      - {name: joints, label: "Joints (deg)", path: joints, kind: list}
  - id: edition
    label: "Firmware (/edition)"
    topic: /edition
    type: std_msgs/Float32
    stale_after_s: 1.0
    source: "yahboomcar_ws:src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L69"
    note: >-
      Rosmaster.get_version(): the MCU firmware version as major + minor/10 (py_install:Rosmaster_Lib/Rosmaster_Lib.py#L215-L217,
      #L1215-L1224), or -1 when the board did not answer the request (#L1228); published every pub_data loop (#L104).
    fields:
      - {name: version, label: "MCU firmware", path: data, kind: number, decimals: 1, no_reading: [-1], no_reading_label: "no reading (the board did not answer)"}
  - id: joy_state
    label: "Gamepad control (/JoyState)"
    topic: /JoyState
    type: std_msgs/Bool
    stale_after_s: null
    event_only: true
    source: "yahboomcar_ws:src/yahboomcar_ctrl/scripts/yahboom_joy.py#L271-L273"
    note: "yahboom_joy toggles Joy_active on the gamepad cancel gesture and publishes it (true: the gamepad has taken control; vendor apps pause, yahboomcar_ws:src/yahboomcar_astra/scripts/colorTracker.py#L33). An ordinary publisher (#L39), not latched: event-only."
    fields:
      - {name: active, label: "Gamepad active", path: data, kind: bool}
  - id: depth_points
    label: "Depth point cloud (/camera/depth/points)"
    topic: /camera/depth/points
    type: sensor_msgs/PointCloud2
    stale_after_s: 15.0
    throttle_s: 5.0
    source: "software:orbbec-ros-sdk/src/ob_camera_node.cpp#L220-L223"
    policy: >-
      The driver computes this cloud only while it has a subscriber (#L220-L223), and a subscriber starts the depth
      stream (#L591-L594); a cloud is megabytes per message, and rosbridge receives every one from ROS whatever its
      throttle. Console policy (link_policy): subscribed on validation at one message per 5 s (queue_length 1),
      stale_after 15 s (three periods); the card can stop it, and it pauses with the cameras on congestion. Shown by
      size: height 1, width = the valid points (#L275-L277).
    fields:
      - {name: width, label: "Points", path: width, kind: number, decimals: 0}
      - {name: height, label: "Rows", path: height, kind: number, decimals: 0}
      - {name: point_step, label: "Point step", path: point_step, kind: number, unit: "B", decimals: 0}
      - {name: is_dense, label: "Dense", path: is_dense, kind: bool}
      - {name: frame_id, label: "Frame", path: header.frame_id, kind: text}
  - id: registered_points
    label: "Registered point cloud (/camera/depth_registered/points)"
    topic: /camera/depth_registered/points
    type: sensor_msgs/PointCloud2
    stale_after_s: 15.0
    throttle_s: 5.0
    source: "software:orbbec-ros-sdk/src/ob_camera_node.cpp#L295-L298"
    policy: >-
      As /camera/depth/points: computed only while subscribed (#L295-L298), a subscriber starts depth and colour
      (#L604-L608); one message per 5 s, stale after 15 s. Shown by size: height 1, width = the valid points
      (#L371-L373).
    fields:
      - {name: width, label: "Points", path: width, kind: number, decimals: 0}
      - {name: height, label: "Rows", path: height, kind: number, decimals: 0}
      - {name: point_step, label: "Point step", path: point_step, kind: number, unit: "B", decimals: 0}
      - {name: is_dense, label: "Dense", path: is_dense, kind: bool}
      - {name: frame_id, label: "Frame", path: header.frame_id, kind: text}
sensors_note: >-
  Every vendor state topic of the authoritative boot a client reads. Not shown: /tf and /tf_static (frames, not
  readings), /joy (raw gamepad input), /diagnostics (joy_node and ekf status), the CameraInfo topics of the cameras
  above, and the mapping/navigation outputs of other launches.

stop:
  - op: publish
    name: /cmd_vel
    type: geometry_msgs/Twist
    msg: {linear: {x: 0.0, y: 0.0, z: 0.0}, angular: {x: 0.0, y: 0.0, z: 0.0}}
    source: "yahboomcar_ws:src/yahboomcar_ctrl/scripts/yahboom_keyboard.py#L141"
    note: >-
      Vendor keyboard teleop: space sets (x, th) = (0, 0) and publishes the zero Twist (#L141, #L148-L152),
      and publishes Twist() on exit (#L154); the vendor gamepad cancel also publishes Twist()
      (yahboomcar_ws:src/yahboomcar_ctrl/scripts/yahboom_joy.py#L276). The driver forwards the zero to
      set_car_motion(0, 0, 0) (Mcnamu_X3plus.py#L177).

watchdog: >-
  None found in the pinned source. Mcnamu_X3plus.py forwards each /cmd_vel directly to
  Rosmaster.set_car_motion with no timer or timeout (yahboomcar_ws:src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L165-L177);
  it only sends set_car_motion(0, 0, 0) at start-up (#L51) and on node shutdown (#L179-L180). Whether the
  MCU firmware / Rosmaster_Lib times out a stale motion command is not established by these sources, so the
  base must be assumed to keep the last commanded velocity until a zero Twist arrives.

teleop_base:
  topic: /cmd_vel
  type: geometry_msgs/Twist
  rate_hz: 10
  rate_policy: "Console policy: re-publish at 10 Hz while a key is held; send one zero Twist on release (driver has no watchdog)."
  axes:
    x:
      speed: 0.2
      limit: 0.7
      unit: m/s
      source: "yahboomcar_ws:src/yahboomcar_bringup/launch/bringup.launch#L20"
      policy: >-
        Speed 0.2 = vendor keyboard teleop default linear speed
        (yahboomcar_ws:src/yahboomcar_ctrl/scripts/yahboom_keyboard.py#L108). Limit 0.7 = X3plus
        xlinear_speed_limit in the boot (bringup.launch#L20) and X3plus linear_speed_limit for the gamepad
        (yahboomcar_ws:src/yahboomcar_ctrl/launch/yahboom_joy.launch#L8). The driver itself does not clamp
        (Mcnamu_X3plus.py#L165-L177); Rosmaster_Lib range is [-1.0, 1.0] (tutorial 05.Basic course/8).
    y:
      speed: 0.2
      limit: 0.7
      unit: m/s
      source: "yahboomcar_ws:src/yahboomcar_bringup/launch/bringup.launch#L21"
      policy: >-
        Mecanum strafe (driver passes linear.y, Mcnamu_X3plus.py#L172). Speed 0.2 = keyboard default speed,
        which the keyboard applies to y when x/y is switched (yahboom_keyboard.py#L108, #L149-L150).
        Limit 0.7 = X3plus ylinear_speed_limit (bringup.launch#L21); Rosmaster_Lib range [-1.0, 1.0].
    yaw:
      speed: 0.5
      limit: 3.2
      unit: rad/s
      source: "yahboomcar_ws:src/yahboomcar_bringup/launch/bringup.launch#L22"
      policy: >-
        Speed 0.5 = console policy, conservative (half of the keyboard default turn 1.0,
        yahboom_keyboard.py#L108). Limit 3.2 = X3plus angular_speed_limit (bringup.launch#L22,
        yahboom_joy.launch#L9); Rosmaster_Lib range [-5.0, 5.0].

controls:
  - id: arm_pose
    label: "Arm pose (servos 1-6)"
    kind: publish
    name: /TargetAngle
    type: yahboomcar_msgs/ArmJoint
    template: {id: 0, angle: 0.0, run_time: "$run_time", joints: ["$j1", "$j2", "$j3", "$j4", "$j5", "$gripper"]}
    fields:
      - {name: j1, label: "Servo 1 (base rotation)", min: 0, max: 180, default: 90, unit: deg, source: "yahboomcar_ws:src/yahboomcar_bringup/cfg/PIDparam.cfg#L13", note: "Rosmaster_Lib s_id 1~4: [0, 180] (tutorial 05.Basic course/9. Control Serial Servo); gamepad clamp yahboom_joy.py#L87-L89; URDF arm_joint1 +-1.5708 rad = 90 +- 90 deg (yahboomcar_X3plus.urdf#L143). Default = driver start pose Mcnamu_X3plus.py#L53."}
      - {name: j2, label: "Servo 2 (shoulder)", min: 0, max: 180, default: 145, unit: deg, source: "yahboomcar_ws:src/yahboomcar_bringup/cfg/PIDparam.cfg#L14", note: "URDF arm_joint2 +-1.5708 rad (yahboomcar_X3plus.urdf#L178); default = driver start pose (Mcnamu_X3plus.py#L53)."}
      - {name: j3, label: "Servo 3 (elbow)", min: 0, max: 180, default: 0, unit: deg, source: "yahboomcar_ws:src/yahboomcar_bringup/cfg/PIDparam.cfg#L15", note: "URDF arm_joint3 +-1.5708 rad (yahboomcar_X3plus.urdf#L213); default = driver start pose."}
      - {name: j4, label: "Servo 4 (wrist pitch)", min: 0, max: 180, default: 45, unit: deg, source: "yahboomcar_ws:src/yahboomcar_bringup/cfg/PIDparam.cfg#L16", note: "URDF arm_joint4 +-1.5708 rad (yahboomcar_X3plus.urdf#L248); default = driver start pose."}
      - {name: j5, label: "Servo 5 (wrist rotation)", min: 0, max: 270, default: 90, unit: deg, source: "yahboomcar_ws:src/yahboomcar_bringup/cfg/PIDparam.cfg#L17", note: "Rosmaster_Lib s_id 5: [0, 270]; gamepad clamp yahboom_joy.py#L81-L83; URDF arm_joint5 -1.5708..3.14159 rad (yahboomcar_X3plus.urdf#L283)."}
      - {name: gripper, label: "Servo 6 (gripper)", min: 30, max: 180, default: 30, unit: deg, source: "yahboomcar_ws:src/yahboomcar_bringup/cfg/PIDparam.cfg#L18", note: "Rosmaster_Lib s_id 6: [30, 180]; gamepad clamp yahboom_joy.py#L84-L86; 30 = open (vendor release pose), larger = closed (grip 146 in arm_color_transport/scripts/transport_main.py#L102). Vendor warning: too large an angle on an object stalls/burns the servo (01.Preparation and First Trial/4.Precautions for DIY Robotic Arm)."}
      - {name: run_time, label: "Move time", min: 500, max: 3000, default: 1000, unit: ms, source: "yahboomcar_ws:src/arm_color_transport/scripts/transport_main.py#L84", policy: "Console policy bounds. Vendor pose moves use run_time 1000 ms (transport_main.py#L84, driver start-up Mcnamu_X3plus.py#L54); Rosmaster_Lib minimum is 0 (tutorial 05.Basic course/9)."}
    stop: null
    prerequisites: [/TargetAngle]
    source: "yahboomcar_ws:src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L110-L116"
    note: >-
      One message = one finite six-servo target: non-empty `joints` makes the driver call
      set_uart_servo_angle_array(joints, run_time) (#L110-L116); the order is servo 1..6 (joint6 = gripper,
      PIDparam.cfg#L13-L18). Same pattern as the vendor transport demo
      (yahboomcar_ws:src/arm_color_transport/scripts/transport_main.py#L83-L84, pubArm in
      transport_common.py#L89-L96). The node does not range-check; the bounds above are the documented servo
      ranges. Joint-space only: collisions with the chassis/camera are not checked.
  - id: gripper
    label: "Gripper (servo 6)"
    kind: publish
    name: /TargetAngle
    type: yahboomcar_msgs/ArmJoint
    template: {id: 6, angle: "$angle", run_time: "$run_time", joints: []}
    fields:
      - {name: angle, label: "Gripper angle", min: 30, max: 180, default: 30, unit: deg, source: "yahboomcar_ws:src/yahboomcar_bringup/cfg/PIDparam.cfg#L18", note: "30 = open (transport_main.py#L86), 146 used to grip the 3 cm demo block (transport_main.py#L102); vendor gripper table: 180 deg for a 0 cm object, 134 deg for 3 cm; do not over-close on an object (01.Preparation and First Trial/4.Precautions for DIY Robotic Arm)."}
      - {name: run_time, label: "Move time", min: 300, max: 2000, default: 500, unit: ms, source: "yahboomcar_ws:src/arm_color_transport/scripts/transport_common.py#L89", policy: "Console policy bounds; default 500 ms = vendor pubArm default run_time (transport_common.py#L89)."}
    stop: null
    prerequisites: [/TargetAngle]
    source: "yahboomcar_ws:src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L117-L124"
    note: >-
      Single-servo form: empty `joints` makes the driver call set_uart_servo_angle(id, angle, run_time)
      (#L117-L124). Same form as the vendor demo pubArm([], 6, 30) (transport_main.py#L86).
controls_note: >-
  Buzzer (/Buzzer) and light strip (/RGBLight) are documented driver inputs but are deliberately not
  exposed as page controls (only arm and gripper). No base-drive controls here (teleop_base covers it).

reads:
  - id: current_angle
    service: /CurrentAngle
    type: yahboomcar_msgs/RobotArmArray
    request: {apply: GetArmJoints}
    invalid: [-1]
    source: "yahboomcar_ws:src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L129-L138"
    note: >-
      The driver answers with the six servo angles read back from the servo bus
      (Rosmaster.get_uart_servo_angle_array, #L134-L136), in degrees and servo order 1..6, the units of the arm
      controls; -1 marks an angle that could not be read. The request is the one the vendor gamepad node sends
      (yahboomcar_ws:src/yahboomcar_ctrl/scripts/yahboom_joy.py#L46-L63, which also treats -1 as unread). Unlike
      /joint_states (the echo of the last command), this is a measurement. Called only when the user clicks the read
      button.
    values:
      - {control: arm_pose, field: j1, path: angles.0, source: "yahboomcar_ws:src/yahboomcar_msgs/srv/RobotArmArray.srv#L5"}
      - {control: arm_pose, field: j2, path: angles.1, source: "yahboomcar_ws:src/yahboomcar_msgs/srv/RobotArmArray.srv#L5"}
      - {control: arm_pose, field: j3, path: angles.2, source: "yahboomcar_ws:src/yahboomcar_msgs/srv/RobotArmArray.srv#L5"}
      - {control: arm_pose, field: j4, path: angles.3, source: "yahboomcar_ws:src/yahboomcar_msgs/srv/RobotArmArray.srv#L5"}
      - {control: arm_pose, field: j5, path: angles.4, source: "yahboomcar_ws:src/yahboomcar_msgs/srv/RobotArmArray.srv#L5"}
      - {control: arm_pose, field: gripper, path: angles.5, source: "yahboomcar_ws:src/yahboomcar_msgs/srv/RobotArmArray.srv#L5"}
      - {control: gripper, field: angle, path: angles.5, source: "yahboomcar_ws:src/yahboomcar_msgs/srv/RobotArmArray.srv#L5"}
reads_note: >-
  A read maps each answered value to a control field as field = (raw - offset) / scale (offset 0, scale 1 when not
  given). The page calls a read service only when the user clicks its button; it is never called on load.

model:
  source: "yahboomcar_ws:src/yahboomcar_description/urdf/yahboomcar_X3plus.urdf"
  note: >-
    Kinematic description for the page's 3D model, taken from the pinned vendor URDF the boot's robot_state_publisher loads:
    joint origins, axes, limits and the gripper's mimic joints as written there; links are drawn as sticks between joint origins,
    the chassis as boxes bounding its mesh. The imu frame is not drawn. Servo degrees map to the URDF joint angles exactly as
    the driver's joint_states does (#L205-L209): rad = (deg - 90) * pi/180 (scale pi/180, offset -pi/2); gripper
    rad = ((deg - 30) * 0.6 - 90) * pi/180 (scale 0.6 * pi/180, offset -108 * pi/180).
  root: base_footprint
  feedback:
    topic: /joint_states
    type: sensor_msgs/JointState
    measured: false
    source: "yahboomcar_ws:src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L194-L211"
    note: >-
      The driver's echo of the last commanded servo angles (not a servo readback): rad = (deg - 90) * pi/180, the gripper's 30..180 deg first mapped to 0..90 (#L205-L209); published every pub_data loop (<= 20 Hz) and after each arm command.
  joints:
    - {name: base_joint, type: fixed, parent: base_footprint, child: base_link, xyz: [0, 0, 0.076], rpy: [0, 0, 0], source: "yahboomcar_ws:src/yahboomcar_description/urdf/yahboomcar_X3plus.urdf#L33-L37"}
    - {name: astra_joint, type: fixed, parent: base_link, child: camera_link, xyz: [-0.043645, 0, 0.41955], rpy: [0, 0, 0], source: "yahboomcar_ws:src/yahboomcar_description/urdf/yahboomcar_X3plus.urdf#L71-L75"}
    - {name: laser_joint, type: fixed, parent: base_link, child: laser_link, xyz: [0.10478, 0, 0.0471], rpy: [0, 0, 0], source: "yahboomcar_ws:src/yahboomcar_description/urdf/yahboomcar_X3plus.urdf#L104-L108"}
    - {name: arm_joint1, type: revolute, parent: base_link, child: arm_link1, xyz: [0.09825, 0, 0.102], rpy: [0, 0, 0], axis: [0, 0, -1], min: -1.5708, max: 1.5708, reported: "arm_joint1", command: [{control: arm_pose, field: j1, scale: 0.0174532925, offset: -1.57079633, source: "yahboomcar_ws:src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L205-L209"}], source: "yahboomcar_ws:src/yahboomcar_description/urdf/yahboomcar_X3plus.urdf#L138-L144"}
    - {name: arm_joint2, type: revolute, parent: arm_link1, child: arm_link2, xyz: [0, 0, 0.0405], rpy: [-1.5708, 0, 0], axis: [0, 0, -1], min: -1.5708, max: 1.5708, reported: "arm_joint2", command: [{control: arm_pose, field: j2, scale: 0.0174532925, offset: -1.57079633, source: "yahboomcar_ws:src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L205-L209"}], source: "yahboomcar_ws:src/yahboomcar_description/urdf/yahboomcar_X3plus.urdf#L173-L179"}
    - {name: arm_joint3, type: revolute, parent: arm_link2, child: arm_link3, xyz: [0, -0.0829, 0], rpy: [0, 0, 0], axis: [0, 0, -1], min: -1.5708, max: 1.5708, reported: "arm_joint3", command: [{control: arm_pose, field: j3, scale: 0.0174532925, offset: -1.57079633, source: "yahboomcar_ws:src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L205-L209"}], source: "yahboomcar_ws:src/yahboomcar_description/urdf/yahboomcar_X3plus.urdf#L208-L214"}
    - {name: arm_joint4, type: revolute, parent: arm_link3, child: arm_link4, xyz: [0, -0.0829, 0], rpy: [0, 0, 0], axis: [0, 0, -1], min: -1.5708, max: 1.5708, reported: "arm_joint4", command: [{control: arm_pose, field: j4, scale: 0.0174532925, offset: -1.57079633, source: "yahboomcar_ws:src/yahboomcar_bringup/scripts/Mcnamu_X3plus.py#L205-L209"}], source: "yahboomcar_ws:src/yahboomcar_description/urdf/yahboomcar_X3plus.urdf#L243-L249"}
