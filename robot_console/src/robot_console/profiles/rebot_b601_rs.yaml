stop: []
stop_note: >-
  No velocity-driven motion exists (teleop none). Each action server accepts every cancel request (cancel_callback,
  rebotarm_ros2:src/rebotarmcontroller/rebotarmcontroller/ros_actions.py#L61-L62; see controls[].stop). Arm motion
  is stopped by cancelling the active FollowJointTrajectory goal: a cancelled trajectory holds the current position
  (ros_actions.py#L211-L216). The gripper is not stopped by cancelling its GripperCommand goal: the cancel only ends
  the goal as canceled (#L263-L270), while the motor target set_gripper_target set stays (hardware_manager.py#L563-L573)
  and the SDK's end-pose control loop keeps driving the gripper to it
  (rebotarm_sdk:reBotArm_control_py/controllers/rebotarm_endpose_controller.py#L161-L162, #L353-L358). The pinned
  sources document no gripper stop.
watchdog: "No command timeout in the pinned controller: the SDK end-pose loop holds the last joint target until a new target, safe home or disable (rebotarm_ros2:src/rebotarmcontroller/rebotarmcontroller/hardware_manager.py#L243-L262); on node exit it moves to safe home and disables the motors (rebotarm_controller.py#L79-L96). None found in source for a lost client."
controls:
  - id: arm_trajectory
    label: "Arm joint goal"
    kind: action
    name: /follow_joint_trajectory
    type: control_msgs/action/FollowJointTrajectory
    template:
      trajectory:
        joint_names: ["joint1", "joint2", "joint3", "joint4", "joint5", "joint6"]
        points:
          - positions: ["$joint1", "$joint2", "$joint3", "$joint4", "$joint5", "$joint6"]
            time_from_start: {sec: "$duration", nanosec: 0}
    fields:
      - {name: joint1, label: "Joint 1", min: -2.8, max: 2.8, default: 0.0, unit: rad, source: "rebotarm_ros2:src/rebotarm_bringup/description/RS/urdf/ReBot_Arm_RS.urdf#L111-L115"}
      - {name: joint2, label: "Joint 2", min: 0.0, max: 3.14, default: 0.0, unit: rad, source: "rebotarm_ros2:src/rebotarm_bringup/description/RS/urdf/ReBot_Arm_RS.urdf#L205-L209"}
      - {name: joint3, label: "Joint 3", min: 0.0, max: 3.14, default: 0.0, unit: rad, source: "rebotarm_ros2:src/rebotarm_bringup/description/RS/urdf/ReBot_Arm_RS.urdf#L319-L323"}
      - {name: joint4, label: "Joint 4", min: -1.57, max: 1.57, default: 0.0, unit: rad, source: "rebotarm_ros2:src/rebotarm_bringup/description/RS/urdf/ReBot_Arm_RS.urdf#L393-L397"}
      - {name: joint5, label: "Joint 5", min: -1.57, max: 1.57, default: 0.0, unit: rad, source: "rebotarm_ros2:src/rebotarm_bringup/description/RS/urdf/ReBot_Arm_RS.urdf#L477-L481"}
      - {name: joint6, label: "Joint 6", min: -3.14, max: 3.14, default: 0.0, unit: rad, source: "rebotarm_ros2:src/rebotarm_bringup/description/RS/urdf/ReBot_Arm_RS.urdf#L531-L535"}
      - {name: duration, label: "Duration", min: 1, max: 10, default: 2, unit: s, integer: true, policy: "Console policy: whole seconds written to builtin_interfaces/Duration.sec (the wiki's example sends sec 5, wiki_documents:sites/en/docs/Robotics/Robot_Kits/reBot_Arm/B601_RS/reBot_Arm_B601_RS_ROS2_Integration.md#L370-L373); the default is the vendor MoveTo example's --duration 2.0 (rebotarm_ros2:src/rebotarmcontroller/rebotarmcontroller/examples/move_to.py#L177). The URDF velocity limits (40-50 rad/s) are no useful bound, so a conservative 1-10 s range is used."}
    stop:
      - {op: cancel}
    busy:
      new_goal: reject
      source: "rebotarm_ros2:src/rebotarmcontroller/rebotarmcontroller/ros_actions.py#L46-L59"
      note: >-
        The server's goal callback (arm_goal_callback, shared with /move_to_pose, ros_actions.py#L18-L35) returns
        GoalResponse.REJECT in state TRAJ_RUNNING, GRAVITY_COMP or SAFE_HOMING (#L46-L59). An accepted trajectory
        enters TRAJ_RUNNING as it starts (begin_trajectory_stream, ros_actions.py#L161-L163,
        hardware_manager.py#L412-L416), as does a move_to_pose goal (hardware_manager.py#L418-L421), and returns to
        IDLE before its result is sent, unless safe home ended it (the finally at ros_actions.py#L228-L231 precedes
        goal_handle.succeed at #L233, and the cancel and exception returns pass through it; the invalid-goal aborts
        at #L140-L159 never enter TRAJ_RUNNING). Safe home (the /safe_home service, ros_services.py#L22, #L70-L71)
        sets SAFE_HOMING (hardware_manager.py#L320) and keeps it until the homing motion ends
        (hardware_manager.py#L322-L328). A running trajectory then ends aborted, by its SAFE_HOMING check
        (ros_actions.py#L182-L190) or because its next joint target is refused (hardware_manager.py#L252-L254,
        caught at ros_actions.py#L222-L227), and the finally leaves the state SAFE_HOMING (#L229). So a goal that
        arrives while an arm goal of any client runs is rejected and never preempts it, with these exceptions in
        the pinned code. The gate reads the state without the hardware lock (_gate_goal, ros_actions.py#L54-L59;
        the state_machine property, hardware_manager.py#L161-L163), and an accepted goal enters TRAJ_RUNNING only
        when its execute callback reaches begin_trajectory_stream (ros_actions.py#L161-L162,
        hardware_manager.py#L412-L416): a second goal that arrives before then is accepted. Its own
        begin_trajectory_stream then raises in TRAJ_RUNNING (_require_idle, hardware_manager.py#L407-L410), its
        except calls hold_current_position() (ros_actions.py#L222-L223) and aborts it, and its finally sets IDLE
        (#L228-L231) while the first trajectory still runs, so later goals are accepted beside that trajectory.
        /disable and /set_zero also set IDLE in mid-trajectory (hardware_manager.py#L293, #L342). The page's own
        goals race this way only with a goal whose execution has not started within 1 s: a goal's first feedback,
        published after begin_trajectory_stream (ros_actions.py#L209), acknowledges it, and the page sends the
        control's next goal only after an acknowledged goal's result or after 1 s without acknowledgement (console
        spec §2.2). The next goal sent after the running goal's result is accepted, except after a goal that safe
        home ended: that goal is rejected until the homing ends.
    prerequisites:
      - /follow_joint_trajectory
      - /joint_states
    source: "rebotarm_ros2:src/rebotarmcontroller/rebotarmcontroller/ros_actions.py#L134-L242"
    note: >-
      One point with all six joints, joint_names exactly joint1..joint6 (ros_actions.py#L146-L152; the wiki's example,
      wiki_documents:sites/en/docs/Robotics/Robot_Kits/reBot_Arm/B601_RS/reBot_Arm_B601_RS_ROS2_Integration.md#L367-L374).
      The driver does not clamp, so the fields carry the URDF joint limits; the defaults are the safe-home pose, every
      joint at 0 (rebotarm_sdk:reBotArm_control_py/controllers/rebotarm_endpose_controller.py#L175-L190).
  - id: gripper
    label: "Gripper"
    kind: action
    name: /gripper/command
    type: control_msgs/action/GripperCommand
    template:
      command:
        position: "$position"
        max_effort: 0.0
    fields:
      - {name: position, label: "Gripper motor (0 closed, 5 open)", min: 0.0, max: 5.0, default: 0.0, unit: rad, source: "rebotarm_ros2:src/rebotarm_bringup/config/rebotarm_hardware.yaml#L48-L51", note: "Motor angle, close 0.0 .. open 5.0 for model rs; the driver refuses a position outside that range (hardware_manager.py#L121-L143)."}
    stop:
      - op: cancel
        source: "rebotarm_ros2:src/rebotarmcontroller/rebotarmcontroller/ros_actions.py#L61-L62"
        note: >-
          The documented cancel, but not a gripper stop: the server accepts it (#L61-L62) and the execute loop ends
          the goal as canceled (#L263-L270) without touching the motor. The target set_gripper_target set stays
          (hardware_manager.py#L563-L573) and the SDK's end-pose control loop keeps driving the gripper to it
          (rebotarm_sdk:reBotArm_control_py/controllers/rebotarm_endpose_controller.py#L161-L162, #L353-L358). The
          pinned sources document no gripper stop.
    busy:
      new_goal: parallel
      source: "rebotarm_ros2:src/rebotarmcontroller/rebotarmcontroller/ros_actions.py#L51-L59"
      note: >-
        The gripper's goal callback rejects only in GRAVITY_COMP or SAFE_HOMING (gripper_goal_callback,
        ros_actions.py#L51-L59), and a gripper goal enters no state (set_gripper_target,
        hardware_manager.py#L563-L573): a goal that arrives while another gripper goal runs is accepted and executed
        beside it, each execute callback on its own thread of the node's reentrant group (ros_actions.py#L36-L44,
        rebotarm_controller.py#L20, MultiThreadedExecutor of 4 threads, #L88). The newer goal's target replaces the
        motor target, and every running gripper goal ends when the motor is within 0.12 rad of that target or after
        5 s (ros_actions.py#L259-L291, hardware_manager.py#L13, #L608-L612). Nothing preempts or cancels the older
        goal, so streamed goals would pile up on the server, each holding an executor thread for up to 5 s. While an
        arm goal runs (TRAJ_RUNNING) a gripper goal is accepted and then aborted (set_gripper_target refuses it,
        hardware_manager.py#L650-L661; ros_actions.py#L249-L257).
    prerequisites:
      - /gripper/command
      - /joint_states
    source: "rebotarm_ros2:src/rebotarmcontroller/rebotarmcontroller/ros_actions.py#L244-L291"
    note: >-
      command.position in gripper motor rad (rebotarm_ros2:API_zh.md#L546-L564). max_effort is sent as the vendor's
      documented 0.0: the adapter applies no force limit with it (API_zh.md#L556-L558) and only uses it for the
      stalled flag (ros_actions.py#L274). The default is the closed position the safe home also commands
      (hardware_manager.py#L323-L324).
uncertainties:
  - "/robot_description, /tf and /tf_static are published by stock robot_state_publisher (not in the pinned repos); its QoS and rates are Jazzy defaults, not stated in the pinned sources. In particular the /tf rate: the launch sets no publish_frequency (rebotarm_ros2:src/rebotarm_bringup/launch/bringup.launch.py#L118-L125), and its 20.0 Hz default and the per-joint-state rate limit come from robot_state_publisher's jazzy branch (src/robot_state_publisher.cpp), not from a release the profile pins."
  - "The wiki's joint motion demo (wiki_documents:sites/en/docs/Robotics/Robot_Kits/reBot_Arm/B601_RS/reBot_Arm_B601_RS_ROS2_Integration.md#L411-L419) sends joint2 = joint3 = -0.20 rad, and joint3 = -0.20 rad alone, outside the RS URDF bounds [0, 3.14] the arm fields use (rebotarm_ros2:src/rebotarm_bringup/description/RS/urdf/ReBot_Arm_RS.urdf#L205-L209, #L319-L323). The values lie within the DM variant's joint2/joint3 range [-3.14, 0] (rebotarm_ros2:src/rebotarm_bringup/description/DM/urdf/ReBot_Arm_DM.urdf#L157, #L205), so the demo looks carried over from the B601-DM. The controller checks no limits (ros_actions.py#L161-L220); the profile keeps the RS URDF bounds."
  - "/joint_states and the motor state topics use sensor-data QoS (best effort, rebotarm_controller.py#L22); a rosbridge that subscribes reliably sees no messages (the vendor API notes the incompatibility, rebotarm_ros2:API_zh.md#L100-L112)."
  - "The vendor API reference also lists /set_mode and the cmd/vel raw topics (rebotarm_ros2:API_zh.md#L18-L45), which the pinned controller code does not create; the profile follows the code."
  - "The finger positions on /joint_states are derived from the gripper motor angle (ratio of close..open, clamped, times 0.05 / 0.0715 m), not measured finger positions (ros_publishers.py#L92-L114)."
  - "An empty arm_namespace is replaced by \"rebotarm\" in the controller (rebotarm_controller.py#L37) while robot_state_publisher's remap would become //joint_states; only non-empty namespaces are a documented configuration."
  - "Several reBots on one wire would each start a robot_state_publisher named /robot_state_publisher publishing the global /robot_description and /tf (bringup.launch.py#L118-L125); the console selects among them by namespace."
