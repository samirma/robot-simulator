actions: []

cameras:
  - topic: /camera/image_raw
    type: sensor_msgs/Image
    encodings: [rgb8]
    rate_hz: 30
    max_rate_hz: 2
    max_rate_policy: >-
      Console policy: at most 2 frames/s (about 20 Mbit/s at 640x480), below the console default because the gait runs
      until a /walking/command stop call on this same link and nothing stops it on its own
      (ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L234-L242).
    camera_info: /camera/camera_info
    stale_after_s: 1.0
    optional: false
    source: "ainex:src/ainex_peripherals/launch/usb_cam.launch#L8-L15"
    note: >-
      yuyv capture converted by usb_cam; vendor consumers treat the frame as RGB
      (ainex:src/ainex_example/scripts/color_detection/color_detection_node.py#L164-L166) and publish results as rgb8
      (ainex:src/ainex_driver/ainex_sdk/src/ainex_sdk/common.py#L26-L33). 30 fps = usb_cam default (framerate not set
      in the launch) - not pinned in this repo. stale_after_s = max(1.0, 5/30).
  - topic: /camera/image_rect_color
    type: sensor_msgs/Image
    encodings: [rgb8]
    rate_hz: 30
    max_rate_hz: 1
    camera_info: /camera/camera_info
    stale_after_s: 2.0
    optional: false
    source: "ainex:src/ainex_peripherals/launch/image_calib.launch#L11-L17"
    caption: "Publishes nothing while the camera is uncalibrated (camera_info K[0] = 0, rectify.cpp#L115-L141), and no pinned source holds the calibration file: on such a robot this card stays empty and reads STALE."
    note: >-
      The rectified copy of /camera/image_raw from image_proc/rectify (image_calib.launch#L11-L17, manager
      /camera/manager, #L8). Rectification keeps the encoding of its input, so the frame is rgb8 as the raw stream.
      The nodelet publishes only while something subscribes (image_calib.launch), and this page subscribes to it
      once the target is validated. Its calibration is the raw stream's /camera/camera_info. Console policy: at most
      1 frame/s, below the raw stream's 2 frames/s, because a 640x480 rgb8 frame as base64 JSON is about 1.2 MB: the
      raw stream at 2 frames/s is about 20 Mbit/s, and both at 2 frames/s would take almost all of this robot's
      40 Mbit/s link budget, which the gait's stop shares. The two together are about 30 Mbit/s. At 1 frame/s a
      frame period is 1 s, so stale_after_s is 2.0 s (the loader requires a period of at most half the threshold).

sensors:
  # Read-only board and filter data the view page shows (console spec §2.5). Each topic is an out topic above.
  - id: imu_raw
    label: "IMU raw (/ros_robot_controller/imu_raw)"
    topic: /ros_robot_controller/imu_raw
    type: sensor_msgs/Imu
    stale_after_s: 1.0
    caption: "Raw board readings: acceleration in m/s² (g × 9.80665), angular velocity in rad/s, as the driver publishes them."
    source: "ainex:src/ainex_driver/ros_robot_controller/scripts/ros_robot_controller_node.py#L33"
    note: >-
      Published only when the board delivered an IMU frame (ros_robot_controller_node.py#L256-L300), at the node's
      100 Hz loop (ros_robot_controller_node.launch#L3). Its linear acceleration and angular velocity are the standard
      Imu fields of the board's frame; the message carries no orientation.
    fields:
      - {name: linear_acceleration, label: "Acceleration", path: linear_acceleration, kind: vector3, unit: "m/s²", decimals: 3}
      - {name: angular_velocity, label: "Angular velocity", path: angular_velocity, kind: vector3, unit: "rad/s", decimals: 3}
  - id: imu_corrected
    label: "IMU corrected (/imu_corrected)"
    topic: /imu_corrected
    type: sensor_msgs/Imu
    stale_after_s: 1.0
    caption: "The raw readings with the imu_calib correction applied: no unit is shown."
    source: "ainex:src/ainex_peripherals/launch/imu.launch#L24-L28"
    note: "imu_calib apply_calib 'corrected' (ainex:src/third_party/imu_calib/src/apply_calib.cpp#L72); follows imu_raw."
    fields:
      - {name: linear_acceleration, label: "Acceleration", path: linear_acceleration, kind: vector3, decimals: 3}
      - {name: angular_velocity, label: "Angular velocity", path: angular_velocity, kind: vector3, decimals: 3}
  - id: imu
    label: "IMU filtered (/imu)"
    topic: /imu
    type: sensor_msgs/Imu
    stale_after_s: 1.0
    caption: "Orientation is the complementary filter's, in the world frame (ENU); its header frame is imu_link. Its rates and acceleration are the corrected IMU's (no unit shown)."
    source: "ainex:src/ainex_peripherals/launch/imu.launch#L30-L40"
    note: "imu_complementary_filter output (imu/data -> imu, use_mag true); follows imu_corrected."
    fields:
      - {name: orientation, label: "Orientation (world frame, ENU)", path: orientation, kind: rpy, decimals: 1}
      - {name: angular_velocity, label: "Angular velocity", path: angular_velocity, kind: vector3, decimals: 3}
      - {name: linear_acceleration, label: "Acceleration", path: linear_acceleration, kind: vector3, decimals: 3}
  - id: mag
    label: "Magnetometer (/ros_robot_controller/mag)"
    topic: /ros_robot_controller/mag
    type: sensor_msgs/MagneticField
    stale_after_s: 1.0
    caption: "Calibrated with the board's mag_calib.yaml; no unit is shown, as the profile records none."
    source: "ainex:src/ainex_driver/ros_robot_controller/scripts/ros_robot_controller_node.py#L291-L299"
    note: "Only when the board's IMU frame carries nine values (ros_robot_controller_node.py#L285-L290); the raw /ros_robot_controller/mag_raw is not shown (its message type, sensor_msgs_ext/magnetometer, has no layout in the cited sources)."
    fields:
      - {name: magnetic_field, label: "Field", path: magnetic_field, kind: vector3, decimals: 3}

stop:
  - op: call
    name: /walking/command
    type: ainex_interfaces/SetWalkingCommand
    request: {command: stop}
    source: "ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L356-L359"
    note: "walking_module.stop() then blocks until the gait cycle finishes (self.stop set at #L225-L230); vendor GaitManager.stop() does exactly this (ainex:src/ainex_driver/ainex_kinematics/src/ainex_kinematics/gait_manager.py#L210-L212)"

watchdog: >-
  none found in source: with period_times=0 the gait runs until /walking/command stop
  (ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L234-L242); the /app/heartbeat timeout only logs
  (ainex:src/ainex_app/scripts/app_node.py#L213-L214). The console must send stop itself on key release / disconnect.

teleop_walk:
  param_topic: /walking/set_param
  param_type: ainex_interfaces/WalkingParam
  param_template:
    init_x_offset: 0.0
    init_y_offset: -0.005
    init_z_offset: 0.025
    init_roll_offset: 0.0
    init_pitch_offset: 0.0
    init_yaw_offset: 0.0
    period_time: 400.0
    dsp_ratio: 0.2
    step_fb_ratio: 0.028
    period_times: 0
    x_move_amplitude: 0.0
    y_move_amplitude: 0.0
    z_move_amplitude: 0.02
    angle_move_amplitude: 0.0
    move_aim_on: false
    arm_swing_gain: 0.5
    y_swap_amplitude: 0.02
    z_swap_amplitude: 0.006
    pelvis_offset: 5.0
    hip_pitch_offset: 15.0
    balance_enable: false
    balance_hip_roll_gain: 0.0
    balance_knee_gain: 0.0
    balance_ankle_roll_gain: 0.0
    balance_ankle_pitch_gain: 0.0
  param_template_source: "ainex:src/ainex_driver/ainex_kinematics/config/walking_param.yaml#L3-L22"
  param_template_note: >-
    Field list from ainex:src/ainex_interfaces/msg/WalkingParam.msg#L1-L31. Values are the walking_param.yaml the
    controller loads on real hardware (ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L146).
    period_times 0 = walk continuously until stop (#L234-L242). balance_* are not in the yaml and are never read by
    the controller (#L594-L645): policy false/0. Units: offsets/amplitudes m, roll/pitch/yaw/hip/pelvis deg,
    period_time ms, arm_swing_gain rad (clamped 0..60 deg, #L79,#L639-L643).
  axes:
    x:
      field: x_move_amplitude
      speed: 0.01
      limit: 0.02
      unit: m
      source: "ainex:src/ainex_driver/ainex_kinematics/src/ainex_kinematics/gait_manager.py#L29-L30"
      policy: >-
        0.01 m per step = the stride every app speed preset uses (ainex_controller.py#L470,#L511,#L554);
        limit 0.02 = GaitManager tested range (update_param rejects |x|>0.02, gait_manager.py#L114-L115);
        controller hard clamp is +-0.05 (ainex_controller.py#L72,#L611-L615).
    y:
      field: y_move_amplitude
      speed: 0.01
      limit: 0.02
      unit: m
      source: "ainex:src/ainex_driver/ainex_kinematics/src/ainex_kinematics/gait_manager.py#L31"
      policy: >-
        0.01 m (app presets ainex_controller.py#L472,#L513,#L556); limit 0.02 = GaitManager check
        (gait_manager.py#L116-L117); controller hard clamp +-0.05 (ainex_controller.py#L73,#L616-L620).
    yaw:
      field: angle_move_amplitude
      speed: 5.0
      limit: 10.0
      unit: deg
      source: "ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L77"
      policy: >-
        5 deg per step (below the joystick's 8 deg, ainex:src/ainex_peripherals/scripts/joystick_control.py#L62-L67);
        limit = controller clamp +-10 deg (ainex_controller.py#L626-L630) = GaitManager range (gait_manager.py#L35,#L118-L119).
  enable:
    - op: call
      name: /walking/command
      type: ainex_interfaces/SetWalkingCommand
      request: {command: enable_control}
      source: "ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L368-L369"
      note: "sets init_pose_finish=True (already True at real-hardware boot, #L89-L90); the app may have cleared it (disable_control, ainex:src/ainex_app/scripts/app_node.py#L339). Vendor remote-control mode calls it first (app_node.py#L306-L309)."
    - op: call
      name: /walking/command
      type: ainex_interfaces/SetWalkingCommand
      request: {command: enable}
      source: "ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L360-L361"
      note: "sets walking_enable=True (True at boot, #L120); cleared by 'disable'. Same call as GaitManager.enable (gait_manager.py#L218-L220)."
  start:
    - op: publish
      name: /walking/set_param
      type: ainex_interfaces/WalkingParam
      msg: "$param"
      source: "ainex:src/ainex_driver/ainex_kinematics/src/ainex_kinematics/gait_manager.py#L145-L153"
      note: "publish the template with the axis amplitudes first (GaitManager.set_step order, #L176-L194)"
    - op: call
      name: /walking/command
      type: ainex_interfaces/SetWalkingCommand
      request: {command: start}
      source: "ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L352-L355"
      note: "only honoured while init_pose_finish is True (#L350); GaitManager sends it once when entering the walking state (gait_manager.py#L189-L194)"
  stop:
    - op: call
      name: /walking/command
      type: ainex_interfaces/SetWalkingCommand
      request: {command: stop}
      source: "ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L356-L359"
      note: "blocks until the current gait cycle ends; joystick_control releases the stick -> gait_manager.stop() (joystick_control.py#L76-L78)"
  rate_hz: 5
  rate_policy: "console policy: re-publish the param at 5 Hz while a key is held (the joystick only publishes on axis change, joystick_control.py#L162-L164)"

head:
  pan:
    topic: /head_pan_controller/command
    type: ainex_interfaces/HeadState
    template: {position: 0.0, duration: 0.2}
    field: position
    min: -1.57
    max: 1.57
    rate: 1.0
    unit: rad
    source: "ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L156,#L337-L339"
    limit_source: "ainex:src/ainex_app/scripts/app_node.py#L89"
    note: >-
      min/max = vendor app 'control' mode pan range pulses 125..875 (app_node.py#L89) converted with
      angle2pulse: pulse = 500 + rad*1000/(240 deg) (ainex_controller.py#L24-L25,#L320-L322;
      servo_controller.yaml#L222-L231 init 500, 0..1000). Hardware/URDF limit +-2.09 rad
      (ainex:src/ainex_simulations/ainex_description/urdf/ainex.urdf.xacro#L788-L790). Direction: the
      vendor model's head_pan joint turns about -Z (ainex:src/ainex_simulations/ainex_description/urdf/ainex.urdf.xacro#L786-L787),
      so a negative pan turns the head to the robot's left (console spec §2.1): teleop's
      Left key and the page's head pad send a negative pan for left. Note for hardware checks: the vendor app's
      find-ball 'left' uses pan pulse 650, a positive pan (app_node.py#L144-L146).
    policy: "slew 1.0 rad/s (servo max ~0.2 s/60 deg, ainex_controller.py#L177); duration 0.2 s per command as the app's manual head moves (app_node.py#L684)"
  tilt:
    topic: /head_tilt_controller/command
    type: ainex_interfaces/HeadState
    template: {position: 0.0, duration: 0.2}
    field: position
    min: -0.77
    max: 0.52
    rate: 1.0
    unit: rad
    source: "ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L157,#L341-L343"
    limit_source: "ainex:src/ainex_app/scripts/app_node.py#L89"
    note: >-
      min/max = vendor app 'control' mode tilt range pulses 315..625 (app_node.py#L89) -> -0.775..+0.524 rad,
      rounded inward. Servo 24 0..1000 (servo_controller.yaml#L232-L241), URDF +-2.09
      (ainex.urdf.xacro#L845-L847). Positive = higher pulse = up (app 'up' 500 vs 'down' 300, app_node.py#L144-L146).
    policy: "slew 1.0 rad/s; duration 0.2 s per command"

# The page lists the controls of one group together, as one compact joint list, under the group's label
# and note. Every servo of the body has one control: the head through the controller's head topics, the
# other 22 servos through the board driver's set_position topic, one servo id per message.
groups:
  - id: head
    label: "Head"
    source: "ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L156-L157,#L337-L343"
  - id: left_arm
    label: "Left arm"
    note: &arm_note >-
      Stand (init pose) and action groups also command these servos and overwrite these targets;
      walking with arm swing sets the shoulder pitch too.
    source: &arm_source "ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L186-L209,#L309-L316,#L375-L384"
  - id: right_arm
    label: "Right arm"
    note: *arm_note
    source: *arm_source
  - id: left_leg
    label: "Left leg"
    note: &leg_note >-
      Walking, Stand (init pose) and action groups also command these servos and overwrite these targets.
    source: &leg_source "ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L186-L209,#L297-L308,#L375-L384"
  - id: right_leg
    label: "Right leg"
    note: *leg_note
    source: *leg_source
groups_note: >-
  Group notes: the gait loop sends the leg servos and, with arm swing, both shoulder pitches (ainex_controller.py#L186-L209,
  #L195); Stand (/walking/init_pose) sends the arm servos outside the gait (#L309-L316) and restarts the gait module, which
  brings the legs and shoulder pitches back to its init position (#L297-L308); an action group plays every servo column of its
  .d6a and then Stand (#L375-L384; ainex:src/ainex_driver/ainex_kinematics/src/ainex_kinematics/motion_manager.py#L85-L90).
  A direct set_position does not change the gait's own joint state (#L194-L201), so it holds until one of these runs.

controls:
  - id: head_pan
    label: "Head pan"
    group: head
    kind: publish
    name: /head_pan_controller/command
    type: ainex_interfaces/HeadState
    template: {position: "$position", duration: "$duration"}
    fields:
      - {name: position, label: "Pan (- = left, + = right)", min: -1.57, max: 1.57, default: 0.0, unit: rad, source: "ainex:src/ainex_app/scripts/app_node.py#L89", note: "Sign: the vendor model's head_pan turns about -Z (ainex:src/ainex_simulations/ainex_description/urdf/ainex.urdf.xacro#L786-L787; console spec §2.1)."}
      - {name: duration, label: "Duration", min: 0.2, max: 2.0, default: 0.5, unit: s, policy: "console policy; controller converts to ms (ainex_controller.py#L339)"}
    stop: null
    prerequisites: [/head_pan_controller/command]
    source: "ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L156,#L337-L339"
  - id: head_tilt
    label: "Head tilt"
    group: head
    kind: publish
    name: /head_tilt_controller/command
    type: ainex_interfaces/HeadState
    template: {position: "$position", duration: "$duration"}
    fields:
      - {name: position, label: "Tilt (+ = up)", min: -0.77, max: 0.52, default: 0.0, unit: rad, source: "ainex:src/ainex_app/scripts/app_node.py#L89"}
      - {name: duration, label: "Duration", min: 0.2, max: 2.0, default: 0.5, unit: s, policy: "console policy; controller converts to ms (ainex_controller.py#L343)"}
    stop: null
    prerequisites: [/head_tilt_controller/command]
    source: "ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L157,#L341-L343"
  # ---- one control per body servo: /ros_robot_controller/bus_servo/set_position with a single servo id.
  # position (rad) goes on the wire as the controller's angle2pulse: pulse = init + round(rad * coef), coef =
  # +-180/3.1415926/240*1000 (negative when the servo's min > max) from servo_controller.yaml
  # (ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L24-L25,#L92-L104,#L320-L322). Limits: the
  # servo's 0..1000 pulses in rad, within the URDF's +-2.09, rounded inward to 0.001 rad. Default: init_pose.yaml.
  - id: l_sho_pitch
    label: "Left shoulder pitch"
    group: left_arm
    kind: publish
    name: /ros_robot_controller/bus_servo/set_position
    type: ros_robot_controller/SetBusServosPosition
    template: {duration: "$duration", position: [{id: 13, position: "$position"}]}
    fields:
      - {name: position, label: "l_sho_pitch (servo 13)", min: -0.523, max: 2.09, default: 0, unit: rad, source: "ainex:src/ainex_driver/ainex_kinematics/config/servo_controller.yaml#L62-L71", limit_source: "ainex:src/ainex_simulations/ainex_description/urdf/ainex.urdf.xacro#L1207-L1227", default_source: "ainex:src/ainex_driver/ainex_kinematics/config/init_pose.yaml#L8", to_wire: {offset: 875, scale: -238.7324187, integer: true, min: 0, max: 1000, source: "ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L92-L104,#L320-L322"}, note: "servo 13: init 875, pulses 1000..0 (flipped: min > max); limits = that range in rad, within the URDF's +-2.09; default = init pose"}
      - {name: duration, label: "Duration", min: 0.2, max: 2.0, default: 0.5, unit: s, policy: &servo_duration "console policy, as the head controls: 0.2..2 s, default 0.5. Documented range 0.02..30 s (ainex:src/ainex_tutorial/scripts/serial_servo/serial_servo_move_demo.py#L14); the board takes int(duration*1000) ms (ainex:src/ainex_driver/ros_robot_controller/src/ros_robot_controller/ros_robot_controller_sdk.py#L438-L440)"}
    stop: null
    prerequisites: [/ros_robot_controller/bus_servo/set_position]
    source: "ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L55"
  - id: l_sho_roll
    label: "Left shoulder roll"
    group: left_arm
    kind: publish
    name: /ros_robot_controller/bus_servo/set_position
    type: ros_robot_controller/SetBusServosPosition
    template: {duration: "$duration", position: [{id: 15, position: "$position"}]}
    fields:
      - {name: position, label: "l_sho_roll (servo 15)", min: -2.09, max: 2.09, default: 1.293, unit: rad, source: "ainex:src/ainex_driver/ainex_kinematics/config/servo_controller.yaml#L72-L81", limit_source: "ainex:src/ainex_simulations/ainex_description/urdf/ainex.urdf.xacro#L1264-L1284", default_source: "ainex:src/ainex_driver/ainex_kinematics/config/init_pose.yaml#L9", to_wire: {offset: 500, scale: 238.7324187, integer: true, min: 0, max: 1000, source: "ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L92-L104,#L320-L322"}, note: "servo 15: init 500, pulses 0..1000; limits = that range in rad, within the URDF's +-2.09; default = init pose"}
      - {name: duration, label: "Duration", min: 0.2, max: 2.0, default: 0.5, unit: s, policy: *servo_duration}
    stop: null
    prerequisites: [/ros_robot_controller/bus_servo/set_position]
    source: "ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L56"
  - id: l_el_pitch
    label: "Left elbow pitch"
    group: left_arm
    kind: publish
    name: /ros_robot_controller/bus_servo/set_position
    type: ros_robot_controller/SetBusServosPosition
    template: {duration: "$duration", position: [{id: 17, position: "$position"}]}
    fields:
      - {name: position, label: "l_el_pitch (servo 17)", min: -2.09, max: 2.09, default: -0.1, unit: rad, source: "ainex:src/ainex_driver/ainex_kinematics/config/servo_controller.yaml#L82-L91", limit_source: "ainex:src/ainex_simulations/ainex_description/urdf/ainex.urdf.xacro#L1321-L1341", default_source: "ainex:src/ainex_driver/ainex_kinematics/config/init_pose.yaml#L10", to_wire: {offset: 500, scale: 238.7324187, integer: true, min: 0, max: 1000, source: "ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L92-L104,#L320-L322"}, note: "servo 17: init 500, pulses 0..1000; limits = that range in rad, within the URDF's +-2.09; default = init pose"}
      - {name: duration, label: "Duration", min: 0.2, max: 2.0, default: 0.5, unit: s, policy: *servo_duration}
    stop: null
    prerequisites: [/ros_robot_controller/bus_servo/set_position]
    source: "ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L58"
  - id: l_el_yaw
    label: "Left elbow yaw"
    group: left_arm
    kind: publish
    name: /ros_robot_controller/bus_servo/set_position
    type: ros_robot_controller/SetBusServosPosition
    template: {duration: "$duration", position: [{id: 19, position: "$position"}]}
    fields:
      - {name: position, label: "l_el_yaw (servo 19)", min: -2.09, max: 2.09, default: -1.926, unit: rad, source: "ainex:src/ainex_driver/ainex_kinematics/config/servo_controller.yaml#L92-L101", limit_source: "ainex:src/ainex_simulations/ainex_description/urdf/ainex.urdf.xacro#L1378-L1398", default_source: "ainex:src/ainex_driver/ainex_kinematics/config/init_pose.yaml#L11", to_wire: {offset: 500, scale: 238.7324187, integer: true, min: 0, max: 1000, source: "ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L92-L104,#L320-L322"}, note: "servo 19: init 500, pulses 0..1000; limits = that range in rad, within the URDF's +-2.09; default = init pose"}
      - {name: duration, label: "Duration", min: 0.2, max: 2.0, default: 0.5, unit: s, policy: *servo_duration}
    stop: null
    prerequisites: [/ros_robot_controller/bus_servo/set_position]
    source: "ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L60"
  - id: l_gripper
    label: "Left hand (gripper)"
    group: left_arm
    kind: publish
    name: /ros_robot_controller/bus_servo/set_position
    type: ros_robot_controller/SetBusServosPosition
    template: {duration: "$duration", position: [{id: 21, position: "$position"}]}
    fields:
      - {name: position, label: "l_gripper (servo 21)", min: -2.09, max: 2.09, default: 0, unit: rad, source: "ainex:src/ainex_driver/ainex_kinematics/config/servo_controller.yaml#L102-L111", limit_source: "ainex:src/ainex_simulations/ainex_description/urdf/ainex.urdf.xacro#L1435-L1455", default_source: "ainex:src/ainex_driver/ainex_kinematics/config/init_pose.yaml#L12", to_wire: {offset: 500, scale: 238.7324187, integer: true, min: 0, max: 1000, source: "ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L92-L104,#L320-L322"}, note: "servo 21: init 500, pulses 0..1000; limits = that range in rad, within the URDF's +-2.09; default = init pose"}
      - {name: duration, label: "Duration", min: 0.2, max: 2.0, default: 0.5, unit: s, policy: *servo_duration}
    stop: null
    prerequisites: [/ros_robot_controller/bus_servo/set_position]
    source: "ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L62"
  - id: r_sho_pitch
    label: "Right shoulder pitch"
    group: right_arm
    kind: publish
    name: /ros_robot_controller/bus_servo/set_position
    type: ros_robot_controller/SetBusServosPosition
    template: {duration: "$duration", position: [{id: 14, position: "$position"}]}
    fields:
      - {name: position, label: "r_sho_pitch (servo 14)", min: -2.09, max: 0.523, default: 0, unit: rad, source: "ainex:src/ainex_driver/ainex_kinematics/config/servo_controller.yaml#L172-L181", limit_source: "ainex:src/ainex_simulations/ainex_description/urdf/ainex.urdf.xacro#L922-L942", default_source: "ainex:src/ainex_driver/ainex_kinematics/config/init_pose.yaml#L19", to_wire: {offset: 125, scale: -238.7324187, integer: true, min: 0, max: 1000, source: "ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L92-L104,#L320-L322"}, note: "servo 14: init 125, pulses 1000..0 (flipped: min > max); limits = that range in rad, within the URDF's +-2.09; default = init pose"}
      - {name: duration, label: "Duration", min: 0.2, max: 2.0, default: 0.5, unit: s, policy: *servo_duration}
    stop: null
    prerequisites: [/ros_robot_controller/bus_servo/set_position]
    source: "ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L54"
  - id: r_sho_roll
    label: "Right shoulder roll"
    group: right_arm
