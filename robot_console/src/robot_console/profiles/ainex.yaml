reads_note: >-
  A read maps each answered value to a control field as field = (raw - offset) / scale. The page calls a read service
  only when the user clicks its button, except a read with poll_s, which it calls about every poll_s seconds once the
  target is validated (console spec §2.2); nothing is read before validation or on load.

model:
  source: "ainex:src/ainex_simulations/ainex_description/urdf/ainex.urdf.xacro"
  note: >-
    Kinematic description for the page's 3D model, taken from the pinned vendor URDF: joint origins, axes and limits as written
    there (head_pan turns about -Z, so a negative head_pan turns the head to the robot's left, #L786-L787). Links are drawn as sticks
    between joint origins, terminal links to their centre of mass; torso and head as boxes bounding their meshes. The fixed camera
    and imu frames are not drawn (the URDF attaches the camera to body_link, not to the head). The boot publishes no joint
    positions (no /joint_states, so feedback is null); the page polls reads.joint_positions instead and draws each joint at the
    measured value of the control field that commands it. Every joint is commanded by the control of its servo, in the URDF
    joint's own rad: the controller sends the same goal_position to the Gazebo joint controller or, through angle2pulse, to
    the servo (ainex:src/ainex_driver/ainex_kinematics/scripts/ainex_controller.py#L196-L203). That is shown for the gait's
    joints (legs, shoulder pitch). Open for the other arm joints: the vendor's standing pose (init_pose.yaml#L9, l_sho_roll
    1.293) drawn on the URDF's axes holds the arms raised, while the vendor's Gazebo spawn puts them down at l_sho_roll -1.403
    (ainex:src/ainex_simulations/ainex_gazebo/launch/spwan_model.launch#L5); whether the shoulder-roll servos turn with the
    URDF axis is not documented, so check it on the hardware.
  root: base_link
  feedback: null
  joints:
    - {name: base_link_to_body, type: fixed, parent: base_link, child: body_link, xyz: [0, 0, 0], rpy: [0, 0, 0], source: "ainex:src/ainex_simulations/ainex_description/urdf/ainex.urdf.xacro#L14-L17"}
