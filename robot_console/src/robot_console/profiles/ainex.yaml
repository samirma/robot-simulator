    - {name: r_sho_roll, type: revolute, parent: r_sho_pitch_link, child: r_sho_roll_link, xyz: [0.0200035, -0.021506, 0], rpy: [0, 0, 0], axis: [1, 0, 0], min: -2.09, max: 2.09, source: "ainex:src/ainex_simulations/ainex_description/urdf/ainex.urdf.xacro#L979-L999"}
    - {name: r_el_pitch, type: revolute, parent: r_sho_roll_link, child: r_el_pitch_link, xyz: [-0.0200035, -0.0741099, 0], rpy: [0, 0, 0], axis: [0, -1, 0], min: -2.09, max: 2.09, source: "ainex:src/ainex_simulations/ainex_description/urdf/ainex.urdf.xacro#L1036-L1056"}
