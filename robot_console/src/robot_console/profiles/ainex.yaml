    - {name: l_sho_pitch, type: revolute, parent: body_link, child: l_sho_pitch_link, xyz: [-5.4627e-05, 0.052491, 0.087448], rpy: [0, 0, 0], axis: [0, -1, 0], min: -2.09, max: 2.09, source: "ainex:src/ainex_simulations/ainex_description/urdf/ainex.urdf.xacro#L1207-L1227"}
