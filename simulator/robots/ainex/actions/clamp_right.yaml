# clamp_left mirrored. The two hands are not exact mirrors in the vendor CAD, so the
# gripper angles differ in magnitude as well as in sign (ainex.py::GRIPPER_ANGLES).
frames:
  - duration: 0.5
    servos: {r_gripper: -0.520}
  - duration: 0.7
    servos: {r_sho_pitch: -0.520, r_sho_roll: -1.290, r_el_pitch: -1.200, r_el_yaw: 1.930}
  - duration: 0.5
    servos: {r_gripper: 1.660}
  - duration: 0.7
    servos: {r_sho_pitch: 0.0, r_sho_roll: -1.293, r_el_pitch: 0.10, r_el_yaw: 1.926}
